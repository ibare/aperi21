# 주제 SSOT — 무엇을 만들 수 있는 주제인가의 단일 원본.
#
# **생성물이 아니다. 사람이 고치는 원본이다.**
# 규약(모집단 · 수준 축 · 판정 기준 · 이 스키마)은 docs/topics/README.md.
# 사이트가 읽는 apps/catalog/src/data/catalog.json 은 여기서 생성된다 (pnpm catalog:topics).
#
# level 과 curricula 가 비어 있는 것은 네 교육과정 어디에서도 다루지 않는다는 뜻이다.
# 빼는 근거가 아니다 — 넣고 빼는 잣대는 visual 하나다 (README 1절).
# visual 의 "unsure" 는 판정을 미룬 상태이지 중립이 아니다 — 구현 대상 집계에서 빠진다.

# 분과는 열거의 비계다. 소속이 아니라 출처를 뜻한다 (README 3절).
domains:
  - id: kinematics
    name: 운동학
  - id: newtonian-mechanics
    name: 뉴턴 역학
  - id: energy-momentum
    name: 일·에너지·운동량
  - id: rotation-oscillation
    name: 회전과 진동
  - id: gravitation
    name: 중력과 천체
  - id: fluids
    name: 유체
  - id: thermodynamics
    name: 열과 통계
  - id: waves-acoustics
    name: 파동과 음향
  - id: optics
    name: 광학
  - id: electromagnetism
    name: 전자기
  - id: modern-physics
    name: 현대물리

topics:
  # ── 운동학
  - id: displacement-vs-distance
    name: 변위와 이동 거리
    desc: 방향을 가진 양과 누적된 양의 차이
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visual: "no"
    visualNote: 방향을 가진 양과 누적된 양의 차이 — 정의다
  - id: reference-frame
    name: 기준틀
    desc: 관찰자에 따라 달라지는 운동 기술
    domain: kinematics
    level: upper
    curricula: [ib]
    visual: "unsure"
  - id: coordinate-choice
    name: 좌표계 선택
    desc: 축을 어디에 두느냐가 식을 바꾸는 방식
    domain: kinematics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 축을 어디에 두느냐로 같은 운동의 식이 달라진다
  - id: average-velocity
    name: 평균 속도
    desc: 구간 전체를 대표하는 속도
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visual: "yes"
    visualNote: 구간을 바꾸면 대표값이 달라지는 것이 그래프에 보인다
  - id: instantaneous-velocity
    name: 순간 속도
    desc: 구간을 0으로 줄인 극한
    domain: kinematics
    level: upper
    curricula: [ib, ap, uk]
    visual: "no"
    visualNote: 극한의 정의다. 장면은 position-time-graph 의 접선이 담는다
  - id: speed-vs-velocity
    name: 속력과 속도
    desc: 크기만인 양과 방향까지 가진 양
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visual: "no"
    visualNote: 용어 구분이다
  - id: average-acceleration
    name: 평균 가속도
    desc: 속도 변화의 비율
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visual: "yes"
    visualNote: 속도-시간 그래프의 기울기로 나타난다
  - id: instantaneous-acceleration
    name: 순간 가속도
    desc: 속도의 순간 변화율
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visual: "no"
    visualNote: 극한의 정의다
  - id: direction-of-acceleration
    name: 가속도의 방향
    desc: 속도와 같은 방향인지 반대인지가 정하는 것
    domain: kinematics
    level: upper
    curricula: [kr]
    visual: "yes"
    visualNote: 속도와 같은 방향이면 빨라지고 반대면 느려진다
  - id: uniform-motion
    name: 등속 운동
    desc: 속도가 변하지 않는 운동
    domain: kinematics
    level: primary
    curricula: [ngss]
    visual: "yes"
    visualNote: 같은 시간에 같은 간격으로 자리를 옮긴다
    sim: aperi21:uniform-motion
  - id: uniformly-accelerated-motion
    name: 등가속도 운동
    desc: 가속도가 일정한 운동의 세 식
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 같은 시간에 벌어지는 간격이 일정하게 늘어난다
  - id: position-time-graph
    name: 위치-시간 그래프
    desc: 기울기가 속도인 표현
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visual: "yes"
    visualNote: 기울기가 속도로 읽힌다
    sim: aperi21:position-time-graph
  - id: velocity-time-graph
    name: 속도-시간 그래프
    desc: 기울기가 가속도, 넓이가 변위인 표현
    domain: kinematics
    level: lower
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 기울기가 가속도로, 넓이가 변위로 읽힌다
    sim: aperi21:velocity-time-graph
    batch: 00-pilot-kinematics
  - id: acceleration-time-graph
    name: 가속도-시간 그래프
    desc: 넓이가 속도 변화인 표현
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visual: "yes"
    visualNote: 넓이가 속도 변화로 쌓인다
  - id: free-fall
    name: 자유 낙하
    desc: 중력만 받는 연직 운동
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visual: "yes"
    visualNote: 질량이 달라도 나란히 떨어진다
    sim: aperi21:free-fall
  - id: vertical-throw
    name: 연직 투상
    desc: 올라갔다 내려오는 운동의 대칭
    domain: kinematics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 올라갈 때와 내려올 때가 거울처럼 겹친다
  - id: gravitational-acceleration
    name: 중력 가속도
    desc: 질량과 무관한 낙하 가속도
    domain: kinematics
    level: lower
    curricula: [kr]
    visual: "yes"
    visualNote: 무거운 것과 가벼운 것이 같이 닿는다
  - id: fall-with-air-resistance
    name: 저항이 있는 낙하
    desc: 속도에 의존하는 저항과 그 결과
    domain: kinematics
    level: upper
    curricula: [ib]
    visual: "yes"
    visualNote: 저항이 붙으면 가속이 점점 줄어든다
  - id: terminal-velocity
    name: 종단 속도
    desc: 저항과 중력이 균형에 이르는 속도
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visual: "yes"
    visualNote: 두 힘이 같아지는 순간 속도가 더 늘지 않는다
    sim: aperi21:terminal-velocity
  - id: vector-decomposition
    name: 벡터의 성분 분해
    desc: 한 벡터를 축 방향으로 나누기
    domain: kinematics
    level: lower
    curricula: [ap, uk]
    visual: "yes"
    visualNote: 한 화살표가 두 축 방향으로 갈라진다
  - id: vector-addition
    name: 벡터의 합성
    desc: 꼬리와 머리를 잇는 덧셈
    domain: kinematics
    level: lower
    curricula: [kr, ap, uk]
    visual: "yes"
    visualNote: 꼬리와 머리를 이으면 합이 나온다
    sim: aperi21:vector-addition
  - id: relative-velocity
    name: 상대 속도
    desc: 기준틀 사이의 속도 변환
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visual: "yes"
    visualNote: 기준틀을 바꾸면 같은 운동이 달라 보인다
    sim: aperi21:relative-velocity
  - id: river-crossing
    name: 강 건너기
    desc: 두 속도의 합성이 만드는 경로
    domain: kinematics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 뱃머리를 어디로 두느냐로 도착점이 달라진다
  - id: projectile-motion
    name: 포물선 운동
    desc: 수평·연직 성분의 독립
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 수평과 연직이 서로를 건드리지 않고 따로 간다
    sim: aperi21:projectile-motion
  # 사거리는 성분의 독립과 **장면이 다르다.** 앞의 것은 세 공을 잇는 선이 수평임을
  # 보이고, 이것은 각도를 바꿔 가며 사거리를 재게 한다 — 한 조각으로 둘 다 만들 수
  # 없으므로 주제를 나눈다 (README 1절).
  - id: projectile-range
    name: 사거리와 발사각
    desc: 던지는 각도가 날아가는 거리를 바꾸는 방식
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 45도에서 가장 멀리 간다
    sim: aperi21:projectile
  - id: trajectory-equation
    name: 궤적 방정식
    desc: 시간을 소거해 얻은 경로의 식
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap]
    visual: "yes"
    visualNote: 시간을 지우면 경로만 남는다
  - id: uniform-circular-motion
    name: 등속 원운동
    desc: 속력이 일정한 원 궤도
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 속력은 그대로인데 방향이 쉬지 않고 바뀐다
  - id: centripetal-acceleration
    name: 구심 가속도
    desc: 방향만 바뀌는 운동의 가속도
    domain: kinematics
    level: upper
    curricula: [ib, ap, uk]
    visual: "yes"
    visualNote: 속력은 그대로인데 방향만 바뀌는 가속이 보인다
    sim: aperi21:centripetal-acceleration
    batch: 00-pilot-kinematics
  - id: period-and-frequency
    name: 주기와 진동수
    desc: 한 바퀴에 걸리는 시간과 그 역수
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visual: "no"
    visualNote: 역수 관계 — 정의다
  - id: angular-velocity
    name: 각속도
    desc: 단위 시간당 각변위
    domain: kinematics
    level: upper
    curricula: [ib, ap, uk]
    visual: "no"
    visualNote: 단위 시간당 각변위 — 정의다
  - id: angular-acceleration
    name: 각가속도
    desc: 각속도의 변화율
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visual: "yes"
    visualNote: 회전이 점점 빨라진다
    sim: aperi21:angular-acceleration
  - id: tangential-normal-acceleration
    name: 접선·법선 가속도
    desc: 속력 변화와 방향 변화의 분리
    domain: kinematics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 가속도가 속력을 바꾸는 몫과 방향을 바꾸는 몫으로 갈린다
  - id: radius-of-curvature
    name: 곡률 반지름
    desc: 곡선이 국소적으로 닮은 원
    domain: kinematics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 굽은 정도에 맞는 원이 경로에 얹힌다
    sim: aperi21:radius-of-curvature
  - id: stopping-distance
    name: 정지 거리
    desc: 반응 거리와 제동 거리의 합
    domain: kinematics
    level: lower
    curricula: [uk]
    visual: "yes"
    visualNote: 속력을 올리면 반응 거리는 비례로, 제동 거리는 제곱으로 늘어난다
    sim: aperi21:stopping-distance
  # ── 뉴턴 역학
  - id: newtons-first-law
    name: 관성 법칙
    desc: 알짜힘이 없을 때의 운동 상태
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 기준틀을 바꾸면 같은 운동이 달라 보인다
    sim: aperi21:inertial-frame
    batch: 01-broad
  - id: inertia
    name: 관성
    desc: 운동 상태를 유지하려는 성질
    domain: newtonian-mechanics
    level: upper
    curricula: [kr]
    visual: "no"
    visualNote: 성질의 이름이다. 장면은 newtons-first-law 가 담는다
  - id: newtons-second-law
    name: 가속도 법칙
    desc: 알짜힘·질량·가속도의 관계
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ngss, ap, uk]
    visual: "yes"
    visualNote: 힘을 키우면 가속도가 비례로 커진다
  - id: newtons-third-law
    name: 작용 반작용
    desc: 힘의 쌍과 서로 다른 작용점
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ngss, ap, uk]
    visual: "yes"
    visualNote: 두 힘이 서로 다른 물체에 걸린다
  - id: net-force
    name: 알짜힘
    desc: 여러 힘의 벡터 합
    domain: newtonian-mechanics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visual: "yes"
    visualNote: 화살표를 모으면 남는 하나가 운동을 정한다
  - id: free-body-diagram
    name: 자유물체도
    desc: 한 물체에 작용하는 힘만 분리하기
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 한 물체만 떼어 내면 걸린 힘의 목록이 드러난다
  - id: mass-vs-weight
    name: 질량과 무게
    desc: 물질의 양과 중력이 주는 힘
    domain: newtonian-mechanics
    level: primary
    curricula: [kr, ib, ngss, uk]
    visual: "no"
    visualNote: 두 양의 구분이라 표가 낫다
  - id: inertial-vs-gravitational-mass
    name: 관성 질량과 중력 질량
    desc: 서로 다른 정의가 같은 값을 주는 것
    domain: newtonian-mechanics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 같이 떨어지는 것이 두 질량이 같다는 증거다
  - id: normal-force
    name: 수직항력
    desc: 접촉면이 수직으로 미는 힘
    domain: newtonian-mechanics
    level: upper
    curricula: [ib, ap]
    visual: "yes"
    visualNote: 면을 기울이면 수직항력이 줄고 미끄러진다
  - id: apparent-weight
    name: 겉보기 무게
    desc: 가속하는 엘리베이터 안의 저울
    domain: newtonian-mechanics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 엘리베이터가 오르내리면 저울 눈금이 달라진다
  - id: static-friction
    name: 정지 마찰력
    desc: 움직이기 전까지 버티는 힘
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap]
    visual: "yes"
    visualNote: 당기는 힘을 키워도 어느 문턱까지는 버틴다
  - id: kinetic-friction
    name: 운동 마찰력
    desc: 미끄러지는 동안의 마찰
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap]
    visual: "yes"
    visualNote: 움직이기 시작하는 순간 저항이 뚝 떨어진다
  - id: coefficient-of-friction
    name: 마찰 계수
    desc: 수직항력과 마찰력의 비
    domain: newtonian-mechanics
    level: upper
    curricula: [ap]
    visual: "no"
    visualNote: 수직항력과 마찰력의 비 — 값이다
  - id: angle-of-friction
    name: 마찰각
    desc: 미끄러지기 시작하는 경사
    domain: newtonian-mechanics
    level: null
    curricula: []
    visual: "yes"
    visualNote: 기울이다 보면 어느 각에서 미끄러지기 시작한다
  - id: inclined-plane
    name: 빗면
    desc: 중력을 면에 나란한 성분과 수직 성분으로
    domain: newtonian-mechanics
    level: primary
    curricula: [kr, ap]
    visual: "yes"
    visualNote: 각을 키우면 면에 나란한 성분이 커진다
  - id: tension
    name: 장력
    desc: 줄이 당기는 힘과 그 전달
    domain: newtonian-mechanics
    level: upper
    curricula: [ib, ap]
    visual: "yes"
    visualNote: 줄을 따라 같은 크기로 전달된다
  - id: pulley-system
    name: 도르래
    desc: 힘의 방향과 크기를 바꾸는 장치
    domain: newtonian-mechanics
    level: upper
    curricula: [ap]
    visual: "yes"
    visualNote: 줄 가닥을 늘리면 드는 힘이 줄고 당길 거리가 는다
  - id: connected-bodies
    name: 연결된 물체
    desc: 함께 움직이는 계의 가속도
    domain: newtonian-mechanics
    level: upper
    curricula: [ap]
    visual: "yes"
    visualNote: 한 몸처럼 움직이는 가속도가 나온다
  - id: spring-force
    name: 탄성력
    desc: 변형에 비례하는 복원력
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap, uk]
    visual: "yes"
    visualNote: 늘일수록 되돌리는 힘이 커진다
  - id: hookes-law
    name: 훅 법칙
    desc: 탄성 한계 안에서의 비례 관계
    domain: newtonian-mechanics
    level: lower
    curricula: [ap, uk]
    visual: "no"
    visualNote: 비례 관계의 진술이다. 장면은 spring-force·stress-strain-curve 가 나눠 가진다
  - id: centripetal-force
    name: 구심력
    desc: 원운동을 유지시키는 힘의 정체
    domain: newtonian-mechanics
    level: upper
    curricula: [kr, ib, ap, uk]
    visual: "yes"
