# 주제 SSOT — 시각화할 주제의 단일 원본.
#
# **생성물이 아니다. 사람이 고치는 원본이다.**
# 규약(모집단 · 수준 축 · 판정 기준 · 이 스키마)은 docs/topics/README.md.
# 사이트가 읽는 apps/catalog/src/data/catalog.json 은 여기서 생성된다 (pnpm catalog:topics).
#
# **여기 있는 것은 모두 시각화할 주제다.** 넣을지는 분류를 정리할 때 한 번 판정하고
# (README 2절), 시각화하지 않기로 한 주제는 이 목록에 남기지 않는다. 구현 대상도 사이트도
# 이 목록 하나를 그대로 쓴다.
#
# level 과 curricula 가 비어 있는 것은 네 교육과정 어디에서도 다루지 않는다는 뜻이다.
# 빼는 근거가 아니다 (README 1절).

# 분과는 열거의 비계다. 소속이 아니라 출처를 뜻한다 (README 3절).
# 호스트 카탈로그의 분야 원본이기도 하다 — 이름은 언어 → 문자열 (pnpm catalog:gen).
domains:
  - id: kinematics
    name: { ko: 운동학, en: "Kinematics", ja: "運動学", zh: "运动学", ar: "علم الحركة", es: "Cinemática", fr: "Cinématique", hi: "गतिकी", id: "Kinematika", pt: "Cinemática" }
  - id: newtonian-mechanics
    name: { ko: 뉴턴 역학, en: "Newtonian Mechanics", ja: "ニュートン力学", zh: "牛顿力学", ar: "الميكانيكا النيوتونية", es: "Mecánica newtoniana", fr: "Mécanique newtonienne", hi: "न्यूटनी यांत्रिकी", id: "Mekanika Newton", pt: "Mecânica newtoniana" }
  - id: energy-momentum
    name: { ko: 일·에너지·운동량, en: "Work, Energy and Momentum", ja: "仕事・エネルギー・運動量", zh: "功、能量与动量", ar: "الشغل والطاقة وكمية الحركة", es: "Trabajo, energía y momento lineal", fr: "Travail, énergie et quantité de mouvement", hi: "कार्य, ऊर्जा और संवेग", id: "Usaha, Energi, dan Momentum", pt: "Trabalho, energia e momento linear" }
  - id: rotation-oscillation
    name: { ko: 회전과 진동, en: "Rotation and Oscillation", ja: "回転と振動", zh: "转动与振动", ar: "الدوران والاهتزاز", es: "Rotación y oscilación", fr: "Rotation et oscillations", hi: "घूर्णन और दोलन", id: "Rotasi dan Osilasi", pt: "Rotação e oscilação" }
  - id: gravitation
    name: { ko: 중력과 천체, en: "Gravitation and Astronomy", ja: "重力と天文学", zh: "引力与天文", ar: "الجاذبية وعلم الفلك", es: "Gravitación y astronomía", fr: "Gravitation et astronomie", hi: "गुरुत्वाकर्षण और खगोलिकी", id: "Gravitasi dan Astronomi", pt: "Gravitação e astronomia" }
  - id: fluids
    name: { ko: 유체, en: "Fluids", ja: "流体", zh: "流体", ar: "الموائع", es: "Fluidos", fr: "Fluides", hi: "तरल", id: "Fluida", pt: "Fluidos" }
  - id: thermodynamics
    name: { ko: 열과 통계, en: "Thermal and Statistical Physics", ja: "熱・統計物理", zh: "热学与统计物理", ar: "الفيزياء الحرارية والإحصائية", es: "Física térmica y estadística", fr: "Physique thermique et statistique", hi: "ऊष्मीय और सांख्यिकीय भौतिकी", id: "Fisika Termal dan Statistik", pt: "Física térmica e estatística" }
  - id: waves-acoustics
    name: { ko: 파동과 음향, en: "Waves and Acoustics", ja: "波動と音響", zh: "波动与声学", ar: "الموجات والصوتيات", es: "Ondas y acústica", fr: "Ondes et acoustique", hi: "तरंगें और ध्वनिकी", id: "Gelombang dan Akustik", pt: "Ondas e acústica" }
  - id: optics
    name: { ko: 광학, en: "Optics", ja: "光学", zh: "光学", ar: "البصريات", es: "Óptica", fr: "Optique", hi: "प्रकाशिकी", id: "Optika", pt: "Óptica" }
  - id: electromagnetism
    name: { ko: 전자기, en: "Electromagnetism", ja: "電磁気学", zh: "电磁学", ar: "الكهرومغناطيسية", es: "Electromagnetismo", fr: "Électromagnétisme", hi: "विद्युतचुंबकत्व", id: "Elektromagnetisme", pt: "Eletromagnetismo" }
  - id: modern-physics
    name: { ko: 현대물리, en: "Modern Physics", ja: "現代物理学", zh: "近代物理", ar: "الفيزياء الحديثة", es: "Física moderna", fr: "Physique moderne", hi: "आधुनिक भौतिकी", id: "Fisika Modern", pt: "Física moderna" }

topics:
  # ── 운동학
  - id: reference-frame
    name: 기준틀
    desc: { ko: "관찰자에 따라 달라지는 운동 기술", en: "How the description of motion depends on the observer", ja: "観測者によって変わる運動の記述", zh: "运动的描述如何随观察者而变", ar: "كيف يتوقف وصف الحركة على الراصد", es: "Cómo la descripción del movimiento depende del observador", fr: "Comment la description du mouvement dépend de l’observateur", hi: "गति का वर्णन प्रेक्षक पर कैसे निर्भर करता है", id: "Bagaimana deskripsi gerak bergantung pada pengamat", pt: "Como a descrição do movimento depende do observador" }
    domain: kinematics
    level: upper
    curricula: [ib]
    visualNote: 같은 사건이 보는 사람에 따라 곧은 낙하로도 포물선으로도 그려진다
    sim: aperi21:reference-frame
  - id: coordinate-choice
    name: 좌표계 선택
    desc: { ko: "축을 어디에 두느냐가 식을 바꾸는 방식", en: "How the choice of axes changes the equations", ja: "軸の置き方で式が変わるしくみ", zh: "坐标轴的选取如何改变方程", ar: "كيف يغيّر اختيار المحاور المعادلات", es: "Cómo la elección de los ejes cambia las ecuaciones", fr: "Comment le choix des axes change les équations", hi: "अक्षों का चयन समीकरणों को कैसे बदलता है", id: "Bagaimana pilihan sumbu mengubah persamaan", pt: "Como a escolha dos eixos muda as equações" }
    domain: kinematics
    level: upper
    curricula: []
    visualNote: 축을 어디에 두느냐로 같은 운동의 식이 달라진다
    sim: aperi21:coordinate-choice
  - id: average-velocity
    name: 평균 속도
    desc: { ko: "구간 전체를 대표하는 속도", en: "One velocity standing for a whole interval", ja: "区間全体を代表する一つの速度", zh: "代表整个区间的一个速度", ar: "سرعة واحدة تمثّل فترة كاملة", es: "Una sola velocidad que representa todo un intervalo", fr: "Une seule vitesse pour tout un intervalle", hi: "पूरे अंतराल का प्रतिनिधित्व करने वाला एक वेग", id: "Satu kecepatan yang mewakili seluruh selang", pt: "Uma única velocidade que representa todo um intervalo" }
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 구간을 바꾸면 대표값이 달라지는 것이 그래프에 보인다
    sim: aperi21:average-velocity
  - id: average-acceleration
    name: 평균 가속도
    desc: { ko: "속도 변화의 비율", en: "Rate of change of velocity", ja: "速度の変化の割合", zh: "速度的变化率", ar: "معدل تغير السرعة", es: "Tasa de cambio de la velocidad", fr: "Taux de variation de la vitesse", hi: "वेग परिवर्तन की दर", id: "Laju perubahan kecepatan", pt: "Taxa de variação da velocidade" }
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visualNote: 속도-시간 그래프의 기울기로 나타난다
    sim: aperi21:average-acceleration
  - id: direction-of-acceleration
    name: 가속도의 방향
    desc: { ko: "속도와 같은 방향인지 반대인지가 정하는 것", en: "Whether it points with or against the velocity", ja: "速度と同じ向きか逆向きか", zh: "与速度同向还是反向", ar: "أيتجه مع السرعة أم عكسها", es: "Si apunta a favor o en contra de la velocidad", fr: "S’il pointe dans le sens de la vitesse ou en sens inverse", hi: "वह वेग की दिशा में है या उसके विपरीत", id: "Apakah searah atau berlawanan dengan kecepatan", pt: "Se aponta a favor ou contra a velocidade" }
    domain: kinematics
    level: upper
    curricula: [kr]
    visualNote: 속도와 같은 방향이면 빨라지고 반대면 느려진다
    sim: aperi21:direction-of-acceleration
  - id: uniform-motion
    name: 등속 운동
    desc: { ko: "속도가 변하지 않는 운동", en: "Motion whose velocity does not change", ja: "速度が変わらない運動", zh: "速度不变的运动", ar: "حركة لا تتغير سرعتها المتجهة", es: "Movimiento cuya velocidad no cambia", fr: "Mouvement dont la vitesse ne change pas", hi: "ऐसी गति जिसका वेग नहीं बदलता", id: "Gerak yang kecepatannya tidak berubah", pt: "Movimento cuja velocidade não muda" }
    domain: kinematics
    level: primary
    curricula: [ngss]
    visualNote: 같은 시간에 같은 간격으로 자리를 옮긴다
    sim: aperi21:uniform-motion
  - id: uniformly-accelerated-motion
    name: 등가속도 운동
    desc: { ko: "같은 시간마다 나아간 거리가 일정한 몫씩 길어지는 운동", en: "Motion in which the distance covered in each equal interval grows by a fixed amount", ja: "同じ時間ごとに進む距離が一定の分ずつ長くなる運動", zh: "每段相同时间内走过的距离按固定的量增加的运动", ar: "حركة تزداد فيها المسافة المقطوعة في كل فترة متساوية بمقدار ثابت", es: "Movimiento en que la distancia recorrida en cada intervalo igual crece en una cantidad fija", fr: "Mouvement où la distance parcourue à chaque intervalle égal s’allonge d’une quantité fixe", hi: "ऐसी गति जिसमें हर समान अंतराल में तय दूरी एक निश्चित मात्रा से बढ़ती है", id: "Gerak yang jarak tempuhnya pada setiap selang waktu yang sama bertambah dengan jumlah tetap", pt: "Movimento em que a distância percorrida em cada intervalo igual cresce de uma quantidade fixa" }
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visualNote: 같은 시간에 벌어지는 간격이 일정하게 늘어난다
    sim: aperi21:uniformly-accelerated-motion
  - id: position-time-graph
    name: 위치-시간 그래프
    desc: { ko: "기울기가 속도인 표현", en: "A representation whose slope is the velocity", ja: "傾きが速度になる表し方", zh: "斜率即速度的表示方式", ar: "تمثيل يكون ميله هو السرعة المتجهة", es: "Una representación cuya pendiente es la velocidad", fr: "Une représentation dont la pente est la vitesse", hi: "ऐसा निरूपण जिसकी ढलान वेग है", id: "Representasi yang kemiringannya adalah kecepatan", pt: "Uma representação cuja inclinação é a velocidade" }
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 기울기가 속도로 읽힌다
    sim: aperi21:position-time-graph
  - id: velocity-time-graph
    name: 속도-시간 그래프
    desc: { ko: "곡선 아래 넓이가 나아간 거리로 읽히는 표현", en: "A representation in which the area under the curve reads as the distance travelled", ja: "曲線の下の面積が進んだ距離として読める表し方", zh: "曲线下的面积可读作走过距离的表示方式", ar: "تمثيل تُقرأ فيه المساحة تحت المنحنى على أنها المسافة المقطوعة", es: "Una representación en la que el área bajo la curva se lee como la distancia recorrida", fr: "Une représentation où l’aire sous la courbe se lit comme la distance parcourue", hi: "ऐसा निरूपण जिसमें वक्र के नीचे का क्षेत्रफल तय दूरी के रूप में पढ़ा जाता है", id: "Representasi yang luas di bawah kurvanya terbaca sebagai jarak tempuh", pt: "Uma representação em que a área sob a curva se lê como a distância percorrida" }
    domain: kinematics
    level: lower
    curricula: [kr, ib, ap, uk]
    visualNote: 속도 곡선 아래를 칠하면 그만큼 나아간 거리가 된다
    sim: aperi21:velocity-time-graph
    batch: 00-pilot-kinematics
  - id: acceleration-time-graph
    name: 가속도-시간 그래프
    desc: { ko: "넓이가 속도 변화인 표현", en: "The area under the graph is the change in velocity", ja: "グラフの下の面積は速度の変化", zh: "图像下方的面积就是速度的变化量", ar: "المساحة تحت المنحنى هي التغير في السرعة", es: "El área bajo la gráfica es el cambio de velocidad", fr: "L’aire sous le graphique est la variation de vitesse", hi: "ग्राफ़ के नीचे का क्षेत्रफल वेग में परिवर्तन है", id: "Luas di bawah grafik adalah perubahan kecepatan", pt: "A área sob o gráfico é a variação da velocidade" }
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visualNote: 넓이가 속도 변화로 쌓인다
    sim: aperi21:acceleration-time-graph
  - id: free-fall
    name: 자유 낙하
    desc: { ko: "중력만 받는 연직 운동", en: "Vertical motion under gravity alone", ja: "重力だけを受ける鉛直方向の運動", zh: "只受重力作用的竖直运动", ar: "حركة رأسية تحت تأثير الجاذبية وحدها", es: "Movimiento vertical bajo la sola acción de la gravedad", fr: "Mouvement vertical sous l’effet de la seule pesanteur", hi: "केवल गुरुत्व के अधीन ऊर्ध्वाधर गति", id: "Gerak vertikal yang hanya dipengaruhi gravitasi", pt: "Movimento vertical sob a ação apenas da gravidade" }
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 질량이 달라도 나란히 떨어진다
    sim: aperi21:free-fall
  - id: vertical-throw
    name: 연직 투상
    desc: { ko: "올라갔다 내려오는 운동의 대칭", en: "The symmetry of going up and coming down", ja: "上がって下りる運動の対称性", zh: "上升与下降运动的对称性", ar: "تماثل الصعود والهبوط", es: "La simetría entre subir y bajar", fr: "La symétrie de la montée et de la descente", hi: "ऊपर जाने और नीचे आने की सममिति", id: "Simetri gerak naik dan turun", pt: "A simetria entre subir e descer" }
    domain: kinematics
    level: lower
    curricula: []
    visualNote: 올라갈 때와 내려올 때가 거울처럼 겹친다
    sim: aperi21:vertical-throw
  - id: gravitational-acceleration
    name: 중력 가속도
    desc: { ko: "속도가 0인 순간에도 멈추지 않는 가속", en: "Acceleration that does not stop even when the velocity is zero", ja: "速度が0になる瞬間にも止まらない加速度", zh: "即使速度为零也不会消失的加速度", ar: "تسارع لا يتوقف حتى حين تكون السرعة صفرًا", es: "Una aceleración que no se detiene ni cuando la velocidad es cero", fr: "Une accélération qui ne s’arrête pas, même quand la vitesse est nulle", hi: "ऐसा त्वरण जो वेग शून्य होने पर भी नहीं रुकता", id: "Percepatan yang tidak berhenti bahkan saat kecepatannya nol", pt: "Uma aceleração que não para nem quando a velocidade é zero" }
    domain: kinematics
    level: lower
    curricula: [kr]
    visualNote: 꼭대기에서 속도가 0이 되어도 속도는 같은 시간마다 같은 몫씩 계속 바뀐다
    sim: aperi21:gravitational-acceleration
  - id: terminal-velocity
    name: 종단 속도
    desc: { ko: "저항과 중력이 균형에 이르는 속도", en: "The speed at which drag and gravity come into balance", ja: "抗力と重力がつり合うときの速さ", zh: "阻力与重力达到平衡时的速率", ar: "السرعة التي تتوازن عندها قوة السحب مع الجاذبية", es: "La rapidez a la que el arrastre y la gravedad se equilibran", fr: "La vitesse à laquelle la traînée et la pesanteur s’équilibrent", hi: "वह चाल जिस पर कर्षण और गुरुत्व संतुलन में आ जाते हैं", id: "Kelajuan saat gaya hambat dan gravitasi mencapai keseimbangan", pt: "A velocidade em que o arrasto e a gravidade se equilibram" }
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visualNote: 두 힘이 같아지는 순간 속도가 더 늘지 않는다
    sim: aperi21:terminal-velocity
  - id: vector-decomposition
    name: 벡터의 성분 분해
    desc: { ko: "한 벡터를 축 방향으로 나누기", en: "Splitting one vector along the axes", ja: "一つのベクトルを軸の向きに分ける", zh: "把一个矢量沿坐标轴方向分开", ar: "تجزئة متجه واحد على امتداد المحاور", es: "Dividir un vector según las direcciones de los ejes", fr: "Décomposer un vecteur selon les axes", hi: "एक सदिश को अक्षों की दिशा में बाँटना", id: "Menguraikan satu vektor menurut arah sumbu", pt: "Dividir um vetor segundo as direções dos eixos" }
    domain: kinematics
    level: lower
    curricula: [ap, uk]
    visualNote: 한 화살표가 두 축 방향으로 갈라진다
    sim: aperi21:vector-decomposition
  - id: vector-addition
    name: 벡터의 합성
    desc: { ko: "꼬리와 머리를 잇는 덧셈", en: "Addition that joins tail to head", ja: "尾と頭をつなぐ足し算", zh: "首尾相接的加法", ar: "جمع يصل ذيل المتجه برأس الآخر", es: "Una suma que une la cola con la punta", fr: "Une addition qui relie la queue à la tête", hi: "पूँछ को सिर से जोड़ने वाला योग", id: "Penjumlahan yang menyambung ekor ke kepala", pt: "Uma soma que une a cauda à ponta" }
    domain: kinematics
    level: lower
    curricula: [kr, ap, uk]
    visualNote: 꼬리와 머리를 이으면 합이 나온다
    sim: aperi21:vector-addition
  - id: relative-velocity
    name: 상대 속도
    desc: { ko: "기준틀 사이의 속도 변환", en: "Converting velocity between frames of reference", ja: "基準系どうしの速度の変換", zh: "参考系之间的速度变换", ar: "تحويل السرعة المتجهة بين الأطر المرجعية", es: "Conversión de la velocidad entre sistemas de referencia", fr: "Conversion de la vitesse d’un référentiel à l’autre", hi: "संदर्भ फ्रेमों के बीच वेग का रूपांतरण", id: "Konversi kecepatan antarkerangka acuan", pt: "Conversão da velocidade entre referenciais" }
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visualNote: 기준틀을 바꾸면 같은 운동이 달라 보인다
    sim: aperi21:relative-velocity
  - id: river-crossing
