    desc: { ko: "힘과 거리를 어떻게 나누든 해 준 일이 같으면 끝 속력도 같음", en: "However force and distance are split, the same work done gives the same final speed", ja: "力と距離をどう分けても、した仕事が同じなら最後の速さも同じ", zh: "无论力和距离如何分配，做的功相同，末速率就相同", ar: "مهما قُسِّمت القوة والمسافة، يعطي الشغل نفسه السرعة النهائية نفسها", es: "Se repartan como se repartan la fuerza y la distancia, el mismo trabajo da la misma rapidez final", fr: "Quelle que soit la répartition entre force et distance, un même travail donne la même vitesse finale", hi: "बल और दूरी को कैसे भी बाँटें, समान कार्य करने पर अंतिम चाल समान रहती है", id: "Bagaimanapun gaya dan jarak dibagi, usaha yang sama menghasilkan kelajuan akhir yang sama", pt: "Como quer que se dividam força e distância, o mesmo trabalho dá a mesma velocidade final" }
