# 주제 SSOT — 무엇을 만들 수 있는 주제인가의 단일 원본.
#
# **생성물이 아니다. 사람이 고치는 원본이다.**
# 규약(모집단 · 수준 축 · 판정 기준 · 이 스키마)은 docs/topics/README.md.
# 사이트가 읽는 apps/catalog/src/data/catalog.json 은 여기서 생성된다 (pnpm catalog:topics).
#
# level 과 curricula 가 비어 있는 것은 아직 교육과정과 대조하지 않았다는 뜻이다.
# visual 의 "unsure" 는 판정을 미룬 상태이지 중립이 아니다 — 구현 대상 집계에서 빠진다.

# 분과는 열거의 비계다. 소속이 아니라 출처를 뜻한다 (README 3절).
domains:
  - id: kinematics
    name: 운동학
  - id: newtonian-mechanics
    name: 뉴턴 역학
  - id: energy-momentum
    name: 일·에너지·운동량
  - id: rotation-oscillation
    name: 회전과 진동
  - id: gravitation
    name: 중력과 천체
  - id: fluids
    name: 유체
  - id: thermodynamics
    name: 열과 통계
  - id: waves-acoustics
    name: 파동과 음향
  - id: optics
    name: 광학
  - id: electromagnetism
    name: 전자기
  - id: modern-physics
    name: 현대물리

