# 주제 SSOT — 시각화할 주제의 단일 원본.
#
# **생성물이 아니다. 사람이 고치는 원본이다.**
# 규약(모집단 · 수준 축 · 판정 기준 · 이 스키마)은 docs/topics/README.md.
# 사이트가 읽는 apps/catalog/src/data/catalog.json 은 여기서 생성된다 (pnpm catalog:topics).
#
# **여기 있는 것은 모두 시각화할 주제다.** 넣을지는 분류를 정리할 때 한 번 판정하고
# (README 2절), 시각화하지 않기로 한 주제는 이 목록에 남기지 않는다. 구현 대상도 사이트도
# 이 목록 하나를 그대로 쓴다.
#
# level 과 curricula 가 비어 있는 것은 네 교육과정 어디에서도 다루지 않는다는 뜻이다.
# 빼는 근거가 아니다 (README 1절).

# 분과는 열거의 비계다. 소속이 아니라 출처를 뜻한다 (README 3절).
# 호스트 카탈로그의 분야 원본이기도 하다 — 이름은 언어 → 문자열 (pnpm catalog:gen).
domains:
  - id: kinematics
    name: { ko: 운동학, en: "Kinematics" }
  - id: newtonian-mechanics
    name: { ko: 뉴턴 역학, en: "Newtonian Mechanics" }
  - id: energy-momentum
    name: { ko: 일·에너지·운동량, en: "Work, Energy and Momentum" }
  - id: rotation-oscillation
    name: { ko: 회전과 진동, en: "Rotation and Oscillation" }
  - id: gravitation
    name: { ko: 중력과 천체, en: "Gravitation and Astronomy" }
  - id: fluids
    name: { ko: 유체, en: "Fluids" }
  - id: thermodynamics
    name: { ko: 열과 통계, en: "Thermal and Statistical Physics" }
  - id: waves-acoustics
    name: { ko: 파동과 음향, en: "Waves and Acoustics" }
  - id: optics
    name: { ko: 광학, en: "Optics" }
  - id: electromagnetism
    name: { ko: 전자기, en: "Electromagnetism" }
  - id: modern-physics
    name: { ko: 현대물리, en: "Modern Physics" }

topics:
  # ── 운동학
  - id: reference-frame
    name: 기준틀
    desc: 관찰자에 따라 달라지는 운동 기술
    domain: kinematics
    level: upper
    curricula: [ib]
    visualNote: 같은 사건이 보는 사람에 따라 곧은 낙하로도 포물선으로도 그려진다
    sim: aperi21:reference-frame
  - id: coordinate-choice
    name: 좌표계 선택
    desc: 축을 어디에 두느냐가 식을 바꾸는 방식
    domain: kinematics
    level: null
    curricula: []
    visualNote: 축을 어디에 두느냐로 같은 운동의 식이 달라진다
    sim: aperi21:coordinate-choice
  - id: average-velocity
    name: 평균 속도
    desc: 구간 전체를 대표하는 속도
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 구간을 바꾸면 대표값이 달라지는 것이 그래프에 보인다
    sim: aperi21:average-velocity
  - id: average-acceleration
    name: 평균 가속도
    desc: 속도 변화의 비율
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visualNote: 속도-시간 그래프의 기울기로 나타난다
    sim: aperi21:average-acceleration
  - id: direction-of-acceleration
    name: 가속도의 방향
    desc: 속도와 같은 방향인지 반대인지가 정하는 것
    domain: kinematics
    level: upper
    curricula: [kr]
    visualNote: 속도와 같은 방향이면 빨라지고 반대면 느려진다
    sim: aperi21:direction-of-acceleration
  - id: uniform-motion
    name: 등속 운동
    desc: 속도가 변하지 않는 운동
    domain: kinematics
    level: primary
    curricula: [ngss]
    visualNote: 같은 시간에 같은 간격으로 자리를 옮긴다
    sim: aperi21:uniform-motion
  - id: uniformly-accelerated-motion
    name: 등가속도 운동
    desc: 같은 시간마다 나아간 거리가 일정한 몫씩 길어지는 운동
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visualNote: 같은 시간에 벌어지는 간격이 일정하게 늘어난다
    sim: aperi21:uniformly-accelerated-motion
  - id: position-time-graph
    name: 위치-시간 그래프
    desc: 기울기가 속도인 표현
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 기울기가 속도로 읽힌다
    sim: aperi21:position-time-graph
  - id: velocity-time-graph
    name: 속도-시간 그래프
    desc: 곡선 아래 넓이가 나아간 거리로 읽히는 표현
    domain: kinematics
    level: lower
    curricula: [kr, ib, ap, uk]
    visualNote: 속도 곡선 아래를 칠하면 그만큼 나아간 거리가 된다
    sim: aperi21:velocity-time-graph
    batch: 00-pilot-kinematics
  - id: acceleration-time-graph
    name: 가속도-시간 그래프
    desc: 넓이가 속도 변화인 표현
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visualNote: 넓이가 속도 변화로 쌓인다
    sim: aperi21:acceleration-time-graph
  - id: free-fall
    name: 자유 낙하
    desc: 중력만 받는 연직 운동
    domain: kinematics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 질량이 달라도 나란히 떨어진다
    sim: aperi21:free-fall
  - id: vertical-throw
    name: 연직 투상
    desc: 올라갔다 내려오는 운동의 대칭
    domain: kinematics
    level: null
    curricula: []
    visualNote: 올라갈 때와 내려올 때가 거울처럼 겹친다
    sim: aperi21:vertical-throw
  - id: gravitational-acceleration
    name: 중력 가속도
    desc: 속도가 0인 순간에도 멈추지 않는 가속
    domain: kinematics
    level: lower
    curricula: [kr]
    visualNote: 꼭대기에서 속도가 0이 되어도 속도는 같은 시간마다 같은 몫씩 계속 바뀐다
    sim: aperi21:gravitational-acceleration
  - id: terminal-velocity
    name: 종단 속도
    desc: 저항과 중력이 균형에 이르는 속도
    domain: kinematics
    level: lower
    curricula: [ib, ap, uk]
    visualNote: 두 힘이 같아지는 순간 속도가 더 늘지 않는다
    sim: aperi21:terminal-velocity
  - id: vector-decomposition
    name: 벡터의 성분 분해
    desc: 한 벡터를 축 방향으로 나누기
    domain: kinematics
    level: lower
    curricula: [ap, uk]
    visualNote: 한 화살표가 두 축 방향으로 갈라진다
    sim: aperi21:vector-decomposition
  - id: vector-addition
    name: 벡터의 합성
    desc: 꼬리와 머리를 잇는 덧셈
    domain: kinematics
    level: lower
    curricula: [kr, ap, uk]
    visualNote: 꼬리와 머리를 이으면 합이 나온다
    sim: aperi21:vector-addition
  - id: relative-velocity
    name: 상대 속도
    desc: 기준틀 사이의 속도 변환
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visualNote: 기준틀을 바꾸면 같은 운동이 달라 보인다
    sim: aperi21:relative-velocity
  - id: river-crossing
    name: 강 건너기
    desc: 두 속도의 합성이 만드는 경로
    domain: kinematics
    level: null
    curricula: []
    visualNote: 뱃머리를 어디로 두느냐로 도착점이 달라진다
    sim: aperi21:river-crossing
  - id: projectile-motion
    name: 포물선 운동
    desc: 수평·연직 성분의 독립
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visualNote: 수평과 연직이 서로를 건드리지 않고 따로 간다
    sim: aperi21:projectile-motion
  # 사거리는 성분의 독립과 **장면이 다르다.** 앞의 것은 세 공을 잇는 선이 수평임을
  # 보이고, 이것은 각도를 바꿔 가며 사거리를 재게 한다 — 한 조각으로 둘 다 만들 수
  # 없으므로 주제를 나눈다 (README 1절).
  - id: projectile-range
    name: 사거리와 발사각
    desc: 던지는 각도가 날아가는 거리를 바꾸는 방식
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visualNote: 45도에서 가장 멀리 간다
    sim: aperi21:projectile-range
  - id: trajectory-equation
    name: 궤적 방정식
    desc: 시각을 걷어 내도 남는 가로와 높이 사이의 관계
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap]
    visualNote: 시간을 지우면 경로만 남는다
    sim: aperi21:trajectory-equation
  - id: uniform-circular-motion
    name: 등속 원운동
    desc: 속력이 일정한 원 궤도
    domain: kinematics
    level: upper
    curricula: [kr, ib, ap, uk]
    visualNote: 속력은 그대로인데 방향이 쉬지 않고 바뀐다
    sim: aperi21:uniform-circular-motion
  - id: centripetal-acceleration
    name: 구심 가속도
    desc: 속력이 그대로인 운동에서 속도 변화가 향하는 곳
    domain: kinematics
    level: upper
    curricula: [ib, ap, uk]
    visualNote: 속력은 그대로인데 방향만 바뀌는 가속이 보인다
    sim: aperi21:centripetal-acceleration
    batch: 00-pilot-kinematics
  - id: angular-acceleration
    name: 각가속도
    desc: 각속도의 변화율
    domain: kinematics
    level: upper
    curricula: [ib, ap]
    visualNote: 회전이 점점 빨라진다
    sim: aperi21:angular-acceleration
  - id: tangential-normal-acceleration
    name: 접선·법선 가속도
    desc: 속력 변화와 방향 변화의 분리
    domain: kinematics
    level: null
    curricula: []
    visualNote: 가속도가 속력을 바꾸는 몫과 방향을 바꾸는 몫으로 갈린다
    sim: aperi21:tangential-normal-acceleration
  - id: radius-of-curvature
    name: 곡률 반지름
    desc: 곡선이 국소적으로 닮은 원
    domain: kinematics
    level: null
    curricula: []
    visualNote: 굽은 정도에 맞는 원이 경로에 얹힌다
    sim: aperi21:radius-of-curvature
  - id: stopping-distance
    name: 정지 거리
    desc: 반응 거리와 제동 거리의 합
    domain: kinematics
    level: lower
    curricula: [uk]
    visualNote: 속력을 올리면 반응 거리는 비례로, 제동 거리는 제곱으로 늘어난다
    sim: aperi21:stopping-distance
  # ── 뉴턴 역학
  - id: newtons-first-law
    name: 관성 법칙
    desc: 알짜힘이 없을 때의 운동 상태
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap, uk]
    visualNote: 버스의 자국은 브레이크에 몰리는데 승객의 자국은 간격 그대로 찍힌다
    sim: aperi21:newtons-first-law
    batch: 01-broad
  - id: newtons-second-law
    name: 가속도 법칙
    desc: 알짜힘·질량·가속도의 관계
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 힘을 키우면 가속도가 비례로 커진다
    sim: aperi21:newtons-second-law
  - id: newtons-third-law
    name: 작용 반작용
    desc: 힘의 쌍과 서로 다른 작용점
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 두 힘이 서로 다른 물체에 걸린다
    sim: aperi21:newtons-third-law
  - id: net-force
    name: 알짜힘
    desc: 여러 힘의 벡터 합
    domain: newtonian-mechanics
    level: primary
    curricula: [kr, ib, ngss, ap, uk]
    visualNote: 화살표를 모으면 남는 하나가 운동을 정한다
    sim: aperi21:net-force
  - id: free-body-diagram
    name: 자유물체도
    desc: 한 물체에 작용하는 힘만 분리하기
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap, uk]
    visualNote: 한 물체만 떼어 내면 걸린 힘의 목록이 드러난다
    sim: aperi21:free-body-diagram
  - id: inertial-vs-gravitational-mass
    name: 관성 질량과 중력 질량
    desc: 서로 다른 정의가 같은 값을 주는 것
    domain: newtonian-mechanics
    level: null
    curricula: []
    visualNote: 저울이 수평이 되는 추 개수에서 얼음 위 밀기도 똑같이 맞아떨어진다
    sim: aperi21:inertial-vs-gravitational-mass
  - id: normal-force
    name: 수직항력
    desc: 접촉면이 수직으로 미는 힘
    domain: newtonian-mechanics
    level: upper
    curricula: [ib, ap]
    visualNote: 위로 당길수록 바닥이 미는 힘이 줄다가 상자가 뜨면 0이 된다
    sim: aperi21:normal-force
  - id: apparent-weight
    name: 겉보기 무게
    desc: 가속하는 엘리베이터 안의 저울
    domain: newtonian-mechanics
    level: null
    curricula: []
    visualNote: 엘리베이터가 오르내리면 저울 눈금이 달라진다
    sim: aperi21:apparent-weight
  - id: static-friction
    name: 정지 마찰력
    desc: 움직이기 전까지 버티는 힘
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap]
    visualNote: 당기는 힘을 키워도 어느 문턱까지는 버틴다
    sim: aperi21:static-friction
  - id: kinetic-friction
    name: 운동 마찰력
    desc: 미끄러지는 동안의 마찰
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap]
    visualNote: 빠르기와 상관없이 같은 크기로 잡아 끈다
    sim: aperi21:kinetic-friction
  - id: angle-of-friction
    name: 마찰각
    desc: 미끄러지기 시작하는 경사
    domain: newtonian-mechanics
    level: null
    curricula: []
    visualNote: 기울이다 보면 어느 각에서 미끄러지기 시작한다
    sim: aperi21:angle-of-friction
  - id: inclined-plane
    name: 빗면
    desc: 중력을 면에 나란한 성분과 수직 성분으로
    domain: newtonian-mechanics
    level: primary
    curricula: [kr, ap]
    visualNote: 각을 키우면 면에 나란한 성분이 커진다
    sim: aperi21:inclined-plane
  - id: tension
    name: 장력
    desc: 줄이 당기는 힘과 그 전달
    domain: newtonian-mechanics
    level: upper
    curricula: [ib, ap]
    visualNote: 줄을 따라 같은 크기로 전달된다
    sim: aperi21:tension
  - id: pulley-system
    name: 도르래
    desc: 힘의 방향과 크기를 바꾸는 장치
    domain: newtonian-mechanics
    level: upper
    curricula: [ap]
    visualNote: 줄 가닥을 늘리면 드는 힘이 줄고 당길 거리가 는다
    sim: aperi21:pulley-system
  - id: connected-bodies
    name: 연결된 물체
    desc: 함께 움직이는 계의 가속도
    domain: newtonian-mechanics
    level: upper
    curricula: [ap]
    visualNote: 한 몸처럼 움직이는 가속도가 나온다
    sim: aperi21:connected-bodies
  - id: spring-force
    name: 탄성력
    desc: 변형에 비례하는 복원력
    domain: newtonian-mechanics
    level: lower
    curricula: [kr, ib, ap, uk]
    visualNote: 늘일수록 되돌리는 힘이 커진다
    sim: aperi21:spring-force
  - id: centripetal-force
    name: 구심력
    desc: 원운동을 붙드는 안쪽 힘과 그것이 사라졌을 때의 진로
    domain: newtonian-mechanics
    level: upper
    curricula: [kr, ib, ap, uk]
    visualNote: 줄을 놓으면 원 밖이 아니라 접선으로 날아간다
    sim: aperi21:centripetal-force
  - id: conical-pendulum
    name: 원뿔 진자
    desc: 장력과 중력이 만드는 원운동
    domain: newtonian-mechanics
    level: null
    curricula: []
    visualNote: 빨리 돌릴수록 줄이 더 눕는다
    sim: aperi21:conical-pendulum
  - id: banked-curve
    name: 경사진 커브
    desc: 마찰 없이도 도는 각도
    domain: newtonian-mechanics
    level: null
    curricula: []
    visualNote: 각을 맞추면 마찰 없이도 돈다
    sim: aperi21:banked-curve
  - id: vertical-loop
    name: 연직 원운동
    desc: 고리를 돌기에 속력이 모자라면 레일을 떠나는 자리
    domain: newtonian-mechanics
    level: null
    curricula: []
    visualNote: 느린 공은 꼭대기에 닿기도 전에 레일을 떠나고 그 자리에 고리가 남는다
    sim: aperi21:vertical-loop
  - id: drag-force
    name: 공기 저항
    desc: 속도의 1차·2차에 비례하는 저항
    domain: newtonian-mechanics
    level: lower
    curricula: [ib, ap, uk]
    visualNote: 빨라질수록 저항이 가파르게 는다
    sim: aperi21:drag-force
  - id: projectile-in-wind
    name: 바람과 사거리
    desc: 같은 발사라도 바람이 착지점을 옮기는 것
    domain: fluids
    level: null
    curricula: []
    visualNote: 뒷바람은 멀리, 앞바람은 가깝게 떨어뜨린다
    sim: aperi21:projectile-in-wind
  - id: buoyant-force-as-force
