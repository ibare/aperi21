name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 다른 검사는 모두 생성물끼리 맞댄다 — 조각을 더하고 생성기를 돌리지 않으면
      # 카탈로그도 등록부도 함께 옛 상태라 서로 일치해 전부 통과한다. 원본(sims/ ·
      # topics.yaml · concepts/)과 생성물을 맞대는 것은 이 스텝뿐이라 맨 앞에 둔다.
      - name: Generated artifacts are fresh
        run: pnpm gen:check

      # 통과 바. ESLint 를 두지 않으므로 strict tsc 가 기계적 검증의 전부다.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      # 발행본 전용 결함(src 누출 · workspace 프로토콜 잔존 · d.ts 가 미발행
      # 패키지를 참조)은 워크스페이스에서 멀쩡해 보이므로 여기서 잡는다.
      # 0.1.0 이 d.ts 가 끊긴 채로 발행된 적이 있다.
      - name: Release gate
        run: pnpm release:check
