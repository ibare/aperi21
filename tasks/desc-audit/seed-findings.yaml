# 조각 설명 전수 대조 — 본보기 11건 (2026-09-25)
#
# 글(desc)만 보고 문제로 고른 11건을 구현(physics.ts · 캡션 · NOTES)과 맞대 다시 판정한 결과다.
# 전수 대조의 **판정 기준 본보기**로 에이전트 지시에 넣는다. 전수 결과(findings.yaml)를 합칠 때
# 이 11건은 이 판정을 그대로 쓴다.
#
# 분류: A desc 오류(구현은 맞음) · B desc 보완 · D 조각 주장 오류 · E 이름·제목 · X 판정 불가
#       OK 는 문제없음 — 여기서는 「글만 보면 틀려 보였지만 구현을 보니 맞은」 본보기라 싣는다.

- id: elastic-collision
  class: A
  problem: desc 「부딪힌 뒤에도 빠르기를 잃지 않는」이 캡션 「부딪친 공은 그 자리에 멈추고」와 모순. 보존되는 것은 운동 에너지의 합이다
  evidence: sims/mechanics/elastic-collision/src/schema.ts:171 (caption.afterRest) · src/physics.ts:70 (afterVelocities, 일반식 맞음)
  fix_at: docs/topics/topics.yaml desc
  suggest: 운동 에너지의 합까지 보존되는 충돌
  confidence: high

- id: boundary-layer
  class: A
  problem: desc 「벽 근처에서 속도가 0이 되는 층」 — 0 인 곳은 벽면뿐이고, 층은 0 에서 바깥 속도까지 회복하는 곳이다. 캡션도 그렇게 말한다
  evidence: sims/fluids/boundary-layer/src/schema.ts:123 (caption.profile) · src/physics.ts:43 (두께 ∝ √x, 맞음)
  fix_at: docs/topics/topics.yaml desc
  suggest: 벽의 0 에서 바깥 흐름 속도까지 회복하는 얇은 층
  confidence: high

- id: wien-displacement-law
  class: A
  problem: ko desc 「온도와 최대 파장」은 가장 긴 파장으로 읽힌다. en 「peak wavelength」 는 맞다 — ko 만 고친다
  evidence: sims/modern/wien-displacement-law/src/physics.ts:54 (peakNm = b/T, 맞음)
  fix_at: docs/topics/topics.yaml desc (ko)
  suggest: 온도와 봉우리 파장
  confidence: high

- id: concave-mirror
  class: A
  problem: 조각의 핵심 주장은 「초점 안으로 들어가면 실상이 허상으로 뒤바뀐다」인데 desc 「초점과 실상」은 그 절반만 말한다
  evidence: sims/optics/concave-mirror/NOTES.md (a) 주장 · src/schema.ts:232,244 (caption.traceBack · caption.near)
  fix_at: docs/topics/topics.yaml desc
  suggest: 초점 밖에서는 실상, 안에서는 허상
  confidence: high

- id: random-walk
  class: B
  problem: desc 「제곱근에 비례하는 이동 거리」 — 화면에 걸음 막대(n 에 비례)와 처음 자리에서의 폭(√n)이 나란히 있어 「이동 거리」가 막대로 읽힌다
  evidence: sims/thermal/random-walk/NOTES.md (a) · src/schema.ts caption (root-mean-square distance from the start)
  fix_at: docs/topics/topics.yaml desc
  suggest: 걸음 수의 제곱근만큼만 멀어지는 처음 자리와의 거리
  confidence: high

- id: reactance
  class: B
  problem: desc 「주파수에 의존하는 저항」이 조각의 핵심 대비(진동수를 올리면 코일은 더 막고 축전기는 덜 막는다)를 빠뜨림. 「저항」도 엄밀하지 않다
  evidence: sims/em/reactance/NOTES.md (a) · src/physics.ts:69,74 (X_L = 2πfL, X_C = 1/2πfC, 맞음)
  fix_at: docs/topics/topics.yaml desc
  suggest: 진동수가 오르면 코일은 더 막고 축전기는 덜 막는 것
  confidence: high

- id: geostationary-orbit
  class: B
  problem: desc 「자전 주기와 같은 궤도」는 동기 궤도의 정의다. 정지 궤도는 적도 위 원 궤도여야 한다. 화면은 적도면 원 궤도라 모순은 없다
  evidence: sims/astro/geostationary-orbit/NOTES.md (a) (북극 위에서 내려다본 적도면 원 궤도)
  fix_at: docs/topics/topics.yaml desc
  suggest: 적도 위에서 지구 자전과 같은 주기로 도는 궤도
  confidence: high

- id: ionizing-radiation
  class: D
  problem: desc 는 화면과 맞다. 조각 자체가 10 eV 를 「결합을 끊는 문턱」으로 가르친다 — 10 eV 는 이온화 에너지의 관례값이고 화학 결합은 대개 3~5 eV 라 문턱 아래 자외선도 결합을 끊는다(DNA 손상). 주제는 이온화인데 화면에 이온화가 없다
  evidence: sims/modern/ionizing-radiation/NOTES.md (a) 주장 · src/schema.ts:363 (caption.ultraviolet 「문턱 아래 자외선은 결합을 세게 늘여도 끊지 못한다」)
  fix_at: sims/modern/ionizing-radiation (조각 주장 재설계) · 그 뒤 desc
  suggest: 문턱을 이온화(전자를 떼어 냄)로 다시 세우거나, 결합 해리를 말하려면 문턱과 캡션을 실제 결합 에너지에 맞춘다
  confidence: high

- id: star-radiation-gravity-balance
  class: E
  problem: 구현은 기체압 + 복사압을 합친 「압력」 하나로 맞게 다룬다. 이름·제목 「복사압과 중력의 평형」만 복사압이라 한다 — 대부분의 별을 떠받치는 것은 기체의 열적 압력이다
  evidence: sims/astro/star-radiation-gravity-balance/NOTES.md:65 (「가스압과 복사압을 가르지 않는다」) · src/schema.ts:74 (label.title)
  fix_at: docs/topics/topics.yaml name · schema label.title
  suggest: 압력과 중력의 평형 (또는 정역학 평형)
  confidence: high

- id: gravity-inside-earth
  class: OK
  problem: 글만 보면 「실제 지구는 핵 경계까지 커진다」로 틀려 보이지만, 균일 밀도 모형이 코드 · NOTES · 스테이지 이름(「밀도가 고른 지구」)에 명시되어 있고 desc 는 그 화면과 맞다
  evidence: sims/astro/gravity-inside-earth/NOTES.md:37 · src/physics.ts:4
  lesson: 조각이 좁은 모형을 **명시**했으면 그 모형 안에서 판정한다

- id: hydrostatic-pressure
  class: OK
  problem: 글만 보면 「절대압력엔 대기압이 더해진다」로 부정확해 보이지만, 계기압(대기압 제외)을 쓴다고 코드 · NOTES 에 명시되어 있다
  evidence: sims/fluids/hydrostatic-pressure/NOTES.md:37 · src/physics.ts:7
  lesson: 같은 원칙 — 명시된 모형 안에서 판정한다
