# 조각 설명 전수 대조 — 판정 (2026-09-25)
#
# 대조 444 · 이상 없음 400 · A 3 · B 34 (오독 21 · 누락 13) · D 1 · E 2 · X 5
# (sound-intensity 는 B 와 X 두 건 — 판정 45건 · 조각 44개)
#
# 후속 작업의 입력이다. 양식과 분류는 PLAN.md 「분류」「결과지」. 순서는 분류(A · B오독 · B누락 · E · D · X),
# 같은 분류 안에서는 topics.yaml 순서.
# kind (B 만) — 오독: desc 가 틀린 쪽으로 읽힌다 · 누락: 정의로는 맞고 조각의 핵심 주장만 빠졌다.
# A · B 는 모두 적용했다(최종 문구는 topics.yaml). suggest 는 ko 초안이다. 채택하면 topics.yaml desc 10개 언어를 함께 고치고 `pnpm description:gen`.
# seed-findings.yaml 의 11건은 그 판정을 그대로 옮겼다(OK 2건은 싣지 않는다).

- id: boundary-layer
  class: A
  problem: desc 「벽 근처에서 속도가 0이 되는 층」 — 0 인 곳은 벽면뿐이고, 층은 0 에서 바깥 속도까지 회복하는 곳이다. 캡션도 그렇게 말한다 (seed 판정 그대로)
  evidence: docs/topics/topics.yaml:1490 · sims/fluids/boundary-layer/src/schema.ts:123 (caption.profile 「속도가 0 에서 바깥 빠르기로 오르는 일은 벽에 붙은 얇은 층 안에서만」) · sims/fluids/boundary-layer/src/schema.ts:111 (caption.flow 「판에 닿은 흐름은 멈춰 있고」) · sims/fluids/boundary-layer/src/physics.ts:43 (두께 ∝ √x, 맞음)
  fix_at: docs/topics/topics.yaml desc
  suggest: 벽의 0에서 바깥 흐름 속력까지 회복하는 얇은 층 (적용함)
  confidence: high

- id: elastic-collision
  class: A
  problem: desc 「부딪힌 뒤에도 빠르기를 잃지 않는」이 캡션 「부딪친 공은 그 자리에 멈추고」와 모순. 보존되는 것은 운동 에너지의 합이다
  evidence: docs/topics/topics.yaml:645 · sims/mechanics/elastic-collision/src/schema.ts:171 (caption.afterRest) · sims/mechanics/elastic-collision/src/physics.ts:70 (afterVelocities, 일반식 맞음)
  fix_at: docs/topics/topics.yaml desc
  suggest: 부딪치면 빠르기를 서로 주고받는 충돌 (적용함 — 「운동 에너지」는 T22 결정에 따라 넣지 않는다)
  confidence: high

- id: wien-displacement-law
  class: A
  problem: ko desc 「온도와 최대 파장」은 「가장 긴 파장」으로 읽힌다. 화면은 세기가 가장 큰 자리(봉우리)의 파장을 재고 캡션도 「봉우리 파장」이라 말한다. en 「peak wavelength」 는 맞다
  evidence: docs/topics/topics.yaml:3229 · sims/modern/wien-displacement-law/src/schema.ts:221 (caption.first 「봉우리 파장을 잰다」) · sims/modern/wien-displacement-law/src/schema.ts:245 (caption.half) · sims/modern/wien-displacement-law/src/physics.ts:54 (peakNm = b/T, 맞음)
  fix_at: docs/topics/topics.yaml desc (ko)
  suggest: 온도와 봉우리 파장 (적용함)
  langs: [ko]
  confidence: high

- id: pulley-system
  class: B
  kind: 오독
  problem: desc 「힘의 방향과 크기를 바꾸는 장치」는 힘이 줄어드는 쪽만 말한다. 화면의 핵심은 맞바꿈이다 — 받치는 가닥이 많을수록 힘은 약해지고 당겨 낼 줄은 1 · 2 · 4 m 로 길어진다(캡션 hold 는 줄 길이만 말한다). desc 만 보면 힘을 공짜로 줄이는 장치로 읽힌다
  evidence: docs/topics/topics.yaml:371 · sims/mechanics/pulley-system/src/schema.ts:209 (caption.rise) · sims/mechanics/pulley-system/src/schema.ts:221 (caption.hold 1.00 · 2.00 · 4.00 m) · sims/mechanics/pulley-system/src/physics.ts:134 (pulledM = n·riseM) · sims/mechanics/pulley-system/src/scene.ts:408 (force = weight / n)
  fix_at: docs/topics/topics.yaml desc
  suggest: 힘의 방향을 바꾸고, 드는 힘을 줄이는 만큼 당길 줄이 길어지는 장치
  confidence: high

- id: mechanical-advantage
  class: B
  kind: 오독
  problem: desc 「지레와 빗면이 드는 힘을 줄이는 방식」은 힘이 줄어드는 쪽만 말한다. 화면의 핵심은 맞바꿈 — 힘이 절반이면 두 배, 4분의 1이면 네 배 긴 거리를 밀어야 같은 높이에 닿는다(일은 같다). desc 만 읽으면 공짜로 힘이 줄어드는 것으로 오독될 수 있다
  evidence: docs/topics/topics.yaml:507 · sims/mechanics/mechanical-advantage/src/schema.ts:258 (caption.lifting 「힘이 작은 쪽일수록 손은 더 긴 거리를 민다」) · sims/mechanics/mechanical-advantage/src/schema.ts:270 (caption.result) · sims/mechanics/mechanical-advantage/src/physics.ts:52 (force = W/ratio, distance = RISE·ratio, 맞음)
  fix_at: docs/topics/topics.yaml desc
  suggest: 지레와 빗면이 힘을 줄이는 대신 더 먼 거리를 밀게 하는 맞바꿈
  confidence: high

- id: stokes-drag
  class: B
  kind: 오독
  problem: desc 가 「무엇이 가라앉는 빠르기를 정하는가」만 말하고 조각의 핵심(반지름이 두 배면 네 배 빨리 가라앉는다 — 선형 저항의 지문)을 빠뜨렸다. 게다가 en 「how fast a size sinks」 는 「크기가 가라앉는다」로 읽혀 뜻이 서지 않고, ko 「크기가 가라앉는 빠르기」 도 같은 오독을 허용한다
