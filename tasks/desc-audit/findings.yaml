  fix_at: docs/topics/topics.yaml desc
  suggest: 느린 흐름에서 반지름이 두 배면 네 배 빨리 가라앉는 구 (en 예 — In slow flow, a sphere twice the radius sinks four times as fast)
  confidence: high

