<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상평형 그림</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #2b313a;
    --muted: #6b727c;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { max-width: 900px; margin: 0 auto; padding: 8px 12px 10px; box-sizing: border-box; }
  canvas { display: block; width: 100%; height: auto; }
  .caption { min-height: 1.5em; margin: 6px 0 4px; font-size: 15px; line-height: 1.5; }
  .control { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .control input { flex: 0 1 260px; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c"></canvas>
  <div class="caption" id="caption"></div>
  <label class="control">압력 고르기
    <input id="pressure" type="range" min="0.08" max="0.75" step="0.01" value="0.6">
    <span id="pressure-hint">낮음 ← → 높음</span>
  </label>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
// ── 캔버스 배치 (논리 좌표 860×316) ──────────────────────────────
const W = 860, H = 316;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

const DX = 80, DY = 12, DW = 500, DH = 220;          // 상평형 그림
const STRIP_Y = [244, 266], STRIP_H = 16;           // 상 띠 두 줄
const BX = 626, BY = 12, BS = 220;                  // 시료 입자 상자

const COL = {
  S: '#c9d4e2',   // 고체
  L: '#bfdcd2',   // 액체
  G: '#f1e8d6',   // 기체
  line: '#4a5360',
  label: '#3d4550',
  muted: '#8a9099',
  accent: '#e0582b', // 강조색: 지금 데우고 있는 시료 (한 가지 뜻)
  particle: '#3d4550',
};
const NAME = { S: '고체', L: '액체', G: '기체' };

// ── 상평형 모형 (무차원 도식) ────────────────────────────────────
// u: 온도 0..1 (왼쪽→오른쪽), v: 로그 압력 0..1 (아래→위)
const U_T = 0.38, V_T = 0.35, U_C = 0.85;
const temp = u => 0.5 + u;
const B_VAP = 1.188, B_SUB = 2.14, K_MELT = 0.08;
const vVap = u => V_T + B_VAP * (1 / temp(U_T) - 1 / temp(u));
const vSub = u => V_T + B_SUB * (1 / temp(U_T) - 1 / temp(u));
const uMelt = v => U_T + K_MELT * (v - V_T);

function phaseAt(u, v) {
  if (v >= V_T) {
    if (u < uMelt(v)) return 'S';
    return v >= vVap(u) ? 'L' : 'G';
  }
  if (u < U_T && v >= vSub(u)) return 'S';
  return 'G';
}

const px = u => DX + u * DW;
const py = v => DY + (1 - v) * DH;

// 상 영역은 변하지 않으므로 한 번만 칠해 둔다
const field = document.createElement('canvas');
field.width = DW * dpr; field.height = DH * dpr;
(function paintField() {
  const f = field.getContext('2d');
  const img = f.createImageData(field.width, field.height);
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const c = { S: hex(COL.S), L: hex(COL.L), G: hex(COL.G) };
  c.X = c.L.map((x, i) => Math.round((x + c.G[i]) / 2));
  for (let j = 0; j < field.height; j++) {
    const v = 1 - (j + 0.5) / field.height;
    for (let i = 0; i < field.width; i++) {
      const u = (i + 0.5) / field.width;
      const k = (j * field.width + i) * 4;
      let col = c[phaseAt(u, v)];
      if (u >= U_C && v >= V_T) {
        // 임계점 너머: 액체와 기체의 구분이 점점 흐려진다
        const d = v - vVap(u), wd = 0.002 + 0.6 * (u - U_C);
        const x = Math.max(0, Math.min(1, 0.5 + d / (2 * wd)));
        const s = x * x * (3 - 2 * x);
        col = c.G.map((g, q) => Math.round(g + (c.L[q] - g) * s));
      }
      img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
    }
  }
  f.putImageData(img, 0, 0);
})();

// ── 가열 진행 상태 ────────────────────────────────────────────────
const V_HIGH = 0.6, V_LOW = 0.18;
const RATE = 0.15;      // 초당 온도 상승 (일정한 가열)
const PAUSE = 1.2;      // 경계선에서 온도가 멈추는 시간 (상이 바뀌는 동안)
const HOLD = 0.9;       // 끝에서 잠시 머무는 시간
const U_END = 0.8;

const slider = document.getElementById('pressure');
let mode = 'auto';      // auto | manual
const strips = [null, null];   // 각 줄: { v, label, segs:[{u0,u1,phase}], done }
let prevTrace = null;          // 지난 가열 경로 { v, u0, u1 }
let run = null;

function newRun(slot, v, u0, label) {
  run = { slot, v, u: u0, u0, phase: phaseAt(u0, v), status: 'heat',
          from: null, to: null, transT: 0, holdT: 0, hadLiquid: false };
  strips[slot] = { v, label, segs: [{ u0, u1: u0, phase: run.phase }], done: false };
  resetParticles();
}

// 경계선 위치를 이분법으로 찾는다
function boundary(ua, ub, v, ph) {
  for (let i = 0; i < 30; i++) {
    const m = (ua + ub) / 2;
    if (phaseAt(m, v) === ph) ua = m; else ub = m;
  }
  return ua;
}

function fullStrip(v, u0, label) {
  const segs = [];
  let ph = phaseAt(u0, v), start = u0;
  const n = 400;
  for (let i = 1; i <= n; i++) {
    const u = u0 + (U_END - u0) * i / n;
    const p = phaseAt(u, v);
    if (p !== ph) { const b = boundary(u - (U_END - u0) / n, u, v, ph); segs.push({ u0: start, u1: b, phase: ph }); start = b; ph = p; }
  }
  segs.push({ u0: start, u1: U_END, phase: ph });
  return { v, label, segs, done: true };
}

function stepRun(dt) {
  const r = run, strip = strips[r.slot], last = strip.segs[strip.segs.length - 1];
  if (r.status === 'heat') {
    let nu = r.u + RATE * dt;
    const p = phaseAt(nu, r.v);
    if (p !== r.phase) {
      const b = boundary(r.u, nu, r.v, r.phase);
      r.u = b; last.u1 = b;
      r.status = 'trans'; r.from = r.phase; r.to = p; r.transT = 0;
      return;
    }
    if (nu >= U_END) nu = U_END;
    r.u = nu; last.u1 = nu;
    if (nu >= U_END) { r.status = 'hold'; r.holdT = 0; strip.done = true; }
  } else if (r.status === 'trans') {
    r.transT += dt;
    if (r.transT >= PAUSE) {
      r.phase = r.to;
      if (r.to === 'L') r.hadLiquid = true;
      strip.segs.push({ u0: r.u, u1: r.u, phase: r.to });
      r.status = 'heat';
    }
  } else if (r.status === 'hold') {
    r.holdT += dt;
    if (r.holdT >= HOLD) {
      prevTrace = { v: r.v, u0: r.u0, u1: r.u };
      if (mode === 'manual') {
        newRun(1, r.v, 0.14, '고른 압력');
      } else if (r.slot === 0) {
        newRun(1, V_LOW, 0.14, '낮은 압력');
      } else {
        strips[1] = null; prevTrace = null;
        newRun(0, V_HIGH, 0.22, '높은 압력');
      }
    }
  }
}

// 상 가중치: 경계선에서 멈춘 동안 앞 상에서 뒤 상으로 옮겨 간다
function phaseWeights() {
  const w = { S: 0, L: 0, G: 0 };
  if (run.status === 'trans') {
    const k = Math.min(1, run.transT / (0.8 * PAUSE));
    const s = k * k * (3 - 2 * k);
    w[run.from] += 1 - s; w[run.to] += s;
  } else {
    w[run.phase === 'X' ? 'G' : run.phase] = 1;
  }
  return w;
}

// ── 시료 입자 ─────────────────────────────────────────────────────
const COLS = 6, ROWS = 5, SP = 0.085, PR = 0.028;
const parts = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  parts.push({ hx: 0.5 + (c - (COLS - 1) / 2) * SP, hy: 0.92 - PR - r * SP, x: 0, y: 0, vx: 0, vy: 0 });
}
function resetParticles() {
  for (const p of parts) { p.x = p.hx; p.y = p.hy; p.vx = 0; p.vy = 0; }
}
const gauss = () => {
  const a = PieceKit.random() || 1e-9, b = PieceKit.random();
  return Math.sqrt(-2 * Math.log(a)) * Math.cos(2 * Math.PI * b);
};

function stepParticles(dt) {
  const w = phaseWeights();
  const T = temp(run.u);
  const n = parts.length;
  const ax = new Float64Array(n), ay = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const p = parts[i];
    // 고체: 제자리(격자)에 묶임
    ax[i] += w.S * (160 * (p.hx - p.x) - 10 * p.vx);
    ay[i] += w.S * (160 * (p.hy - p.y) - 10 * p.vy);
    // 액체: 바닥으로 가라앉고 서로 붙어 있음
    ay[i] += w.L * 2.2;
    ax[i] += -w.L * 1.6 * p.vx;
    ay[i] += -w.L * 1.6 * p.vy;
  }
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = parts[i], b = parts[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1e-6;
    let f = 0;
    if (d < 2.3 * PR) f = -60 * (2.3 * PR - d) / (2.3 * PR);          // 겹치지 않게 밀어냄
    else if (d < 0.14) f = w.L * 0.9;                                  // 액체의 약한 끌림
    const fx = f * dx / d, fy = f * dy / d;
    ax[i] += fx; ay[i] += fy; ax[j] -= fx; ay[j] -= fy;
  }
  const kickS = 0.35 * Math.sqrt(T), kickL = 0.9 * Math.sqrt(T);
  const gasSpeed = 1.1 * Math.sqrt(T);
  for (let i = 0; i < n; i++) {
    const p = parts[i];
    p.vx += ax[i] * dt; p.vy += ay[i] * dt;
    // 열운동: 온도에 따른 흔들림
    const kick = (w.S * kickS + w.L * kickL) * Math.sqrt(dt) ;
    p.vx += kick * gauss(); p.vy += kick * gauss();
    // 기체: 방향은 제멋대로, 빠르기는 온도에 맞춘다
    if (w.G > 0) {
      p.vx += w.G * 3 * gauss() * Math.sqrt(dt);
      p.vy += w.G * 3 * gauss() * Math.sqrt(dt);
      const s = Math.hypot(p.vx, p.vy) || 1e-6;
      const target = s + (gasSpeed - s) * Math.min(1, 6 * dt);
      const mix = w.G;
      p.vx *= 1 + mix * (target / s - 1);
      p.vy *= 1 + mix * (target / s - 1);
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < PR) { p.x = PR; p.vx = Math.abs(p.vx); }
    if (p.x > 1 - PR) { p.x = 1 - PR; p.vx = -Math.abs(p.vx); }
    if (p.y < PR) { p.y = PR; p.vy = Math.abs(p.vy); }
    if (p.y > 1 - PR) { p.y = 1 - PR; p.vy = -Math.abs(p.vy); }
  }
}

// ── 캡션 ─────────────────────────────────────────────────────────
function captionText() {
  const r = run;
  const lead = r.v < V_T ? '삼중점보다 낮은 압력에서' : '삼중점보다 높은 압력에서';
  if (r.status === 'trans') {
    if (r.from === 'S' && r.to === 'L') return '경계선에 닿자 온도가 멈추고, 고체가 녹아 액체가 된다';
    if (r.from === 'L' && r.to === 'G') return '두 번째 경계선에서 다시 멈추고, 액체가 끓어 기체가 된다';
    if (r.from === 'S' && r.to === 'G') return '경계선이 하나뿐이다 — 고체가 액체를 거치지 않고 곧바로 기체가 된다';
  }
  if (r.phase === 'S') return lead + ' 고체를 데운다';
  if (r.phase === 'L') return '다시 온도가 오른다 — 지금은 액체다';
  return r.hadLiquid
    ? '고체 → 액체 → 기체: 경계선을 두 번 건넜다'
    : '고체 → 기체: 액체 구간을 건너뛰고 경계선을 한 번만 건넜다';
}

// ── 조작기 ───────────────────────────────────────────────────────
if (PieceKit.frozen) slider.disabled = true;
slider.addEventListener('input', () => {
  if (PieceKit.frozen) return;
  const v = parseFloat(slider.value);
  if (mode === 'auto') {
    mode = 'manual';
    strips[0] = fullStrip(V_HIGH, 0.22, '높은 압력');
  }
  prevTrace = { v: V_HIGH, u0: 0.22, u1: U_END };
  newRun(1, v, 0.14, '고른 압력');
});

// ── 그리기 ───────────────────────────────────────────────────────
function text(s, x, y, opt = {}) {
  ctx.font = (opt.weight || '') + ' ' + (opt.size || 12) + 'px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
  ctx.fillStyle = opt.color || COL.label;
  ctx.textAlign = opt.align || 'left';
  ctx.textBaseline = opt.base || 'middle';
  ctx.fillText(s, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  PieceKit.mark('상 영역', () => {
    ctx.drawImage(field, DX, DY, DW, DH);
  });

  PieceKit.mark('상 경계선', () => {
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1.6;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 200; i++) {            // 승화 곡선
      const u = U_T * i / 200, v = vSub(u);
      if (v < 0) continue;
      if (first) { ctx.moveTo(px(u), py(v)); first = false; } else ctx.lineTo(px(u), py(v));
    }
    for (let i = 0; i <= 200; i++) {            // 증발 곡선
      const u = U_T + (U_C - U_T) * i / 200;
      ctx.lineTo(px(u), py(vVap(u)));
    }
    ctx.stroke();
    ctx.beginPath();                            // 융해 곡선
    ctx.moveTo(px(U_T), py(V_T)); ctx.lineTo(px(uMelt(1)), py(1));
    ctx.stroke();
  });

  PieceKit.mark('상 이름', () => {
    text('고체', px(0.14), py(0.72), { size: 14, weight: '600' });
    text('액체', px(0.62), py(0.86), { size: 14, weight: '600' });
    text('기체', px(0.7), py(0.3), { size: 14, weight: '600' });
  });

  PieceKit.mark('삼중점', () => {
    ctx.fillStyle = COL.line;
    ctx.beginPath(); ctx.arc(px(U_T), py(V_T), 3.5, 0, Math.PI * 2); ctx.fill();
    text('삼중점', px(U_T) + 8, py(V_T) + 11, { size: 12, color: COL.label });
  });

  PieceKit.mark('축 안내', () => {
    text('압력 ↑', DX - 10, DY + 8, { size: 12, color: COL.muted, align: 'right' });
    text('온도 →', DX + DW, 300, { size: 12, color: COL.muted, align: 'right' });
  });

  PieceKit.mark('가열 경로 이름', () => {
    const drawn = new Set();
    for (const s of strips) {
      if (!s || drawn.has(s.label)) continue;
      drawn.add(s.label);
      text(s.label, DX - 10, py(s.v), { size: 12, color: COL.muted, align: 'right' });
    }
  });

  PieceKit.mark('지난 가열 경로', () => {
    if (!prevTrace) return;
    ctx.strokeStyle = COL.muted; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px(prevTrace.u0), py(prevTrace.v)); ctx.lineTo(px(prevTrace.u1), py(prevTrace.v)); ctx.stroke();
  });

  PieceKit.mark('지금 가열 경로', () => {
    ctx.strokeStyle = COL.accent; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(px(run.u0), py(run.v)); ctx.lineTo(px(run.u), py(run.v)); ctx.stroke();
  });

  PieceKit.mark('지금 상태점', () => {
    const x = px(run.u), y = py(run.v);
    ctx.fillStyle = COL.accent;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  });

  PieceKit.mark('상 띠', () => {
    for (let k = 0; k < 2; k++) {
      const s = strips[k], y = STRIP_Y[k];
      ctx.strokeStyle = '#d9dde2'; ctx.lineWidth = 1;
      ctx.strokeRect(DX + 0.5, y + 0.5, DW - 1, STRIP_H - 1);
      if (!s) continue;
      text(s.label, DX - 10, y + STRIP_H / 2, { size: 12, color: COL.muted, align: 'right' });
      for (const g of s.segs) {
        const x0 = px(g.u0), x1 = px(g.u1);
        if (x1 - x0 <= 0) continue;
        ctx.fillStyle = COL[g.phase] || COL.G;
        ctx.fillRect(x0, y, x1 - x0, STRIP_H);
        if (x1 - x0 > 34) text(NAME[g.phase] || '', (x0 + x1) / 2, y + STRIP_H / 2 + 0.5, { size: 11, align: 'center' });
      }
      for (let i = 1; i < s.segs.length; i++) {
        const x = px(s.segs[i].u0);
        ctx.strokeStyle = COL.line; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + STRIP_H); ctx.stroke();
      }
    }
  });

  PieceKit.mark('시료 속 입자', () => {
    ctx.strokeStyle = '#c3c8cf'; ctx.lineWidth = 1;
    ctx.strokeRect(BX + 0.5, BY + 0.5, BS - 1, BS - 1);
    ctx.fillStyle = COL.particle;
    for (const p of parts) {
      ctx.beginPath(); ctx.arc(BX + p.x * BS, BY + p.y * BS, PR * BS * 0.85, 0, Math.PI * 2); ctx.fill();
    }
    text('시료 속 입자', BX + BS / 2, BY + BS + 14, { size: 12, color: COL.muted, align: 'center' });
  });

  PieceKit.mark('캡션', () => {
    const el = document.getElementById('caption');
    const s = captionText();
    if (el.textContent !== s) el.textContent = s;
  });

  if (mode === 'auto') slider.value = String(run.v);
}

// ── 시작: 도착한 순간 이미 높은 압력에서 데우는 중 ────────────────
newRun(0, V_HIGH, 0.22, '높은 압력');

PieceKit.loop({
  step(dt) { stepRun(dt); stepParticles(dt); },
  draw() { draw(); },
});
</script>
</body>
</html>
