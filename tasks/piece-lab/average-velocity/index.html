<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평균 속도</title>
<style>
  html, body { margin: 0; background: #fbfaf7; }
  .piece { max-width: 900px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 330px; }
</style>
</head>
<body>
<div class="piece"><canvas id="c"></canvas></div>
<script src="../_harness/piece-kit.js"></script>
<script>
(function () {
  'use strict';

  // ---- 운동: 앞으로 달리다 멈추고, 되돌아온다 ----
  // 꺾인 위치 (모서리가 날카로운 원본). 기준: x(0)=0.
  function xSharp(tau) {
    if (tau <= 4) return 8 * tau;
    if (tau <= 6) return 32;
    return 32 - 5 * (tau - 6);
  }
  // 속도가 순간에 바뀌지 않도록 폭 1초 상자 평균으로 모서리만 둥글린다.
  // 직선 구간에서는 상자 평균이 원래 값과 정확히 같으므로 모서리 밖의 값은 그대로다.
  var W = 1, N = 64;
  function x(tau) {
    var sum = 0;
    for (var i = 0; i < N; i++) {
      sum += xSharp(tau - W / 2 + (i + 0.5) * W / N);
    }
    return sum / N;
  }

  // ---- 자동 진행: 구간 [a, b] 가 시각 t 의 함수로 움직인다 ----
  var PERIOD = 16;
  var OFFSET = 0.8; // 도착한 순간 이미 끝점이 움직이고 있도록
  function ease(s) { s = Math.max(0, Math.min(1, s)); return s * s * (3 - 2 * s); }
  function schedule(t) {
    var u = (t + OFFSET) % PERIOD;
    if (u < 7) return { a: 0, b: 1.5 + 8.5 * ease(u / 7), lead: '끝 시각이 늦어진다' };
    if (u < 8.5) return { a: 0, b: 10, lead: '구간이 운동 전체를 덮었다' };
    if (u < 14) return { a: 6 * ease((u - 8.5) / 5.5), b: 10, lead: '시작 시각이 늦어진다' };
    var s = ease((u - 14) / 2);
    return { a: 6 * (1 - s), b: 10 - 8.5 * s, lead: '구간이 처음으로 돌아간다' };
  }

  // ---- 수 표기: 화면에 쓴 수끼리 계산이 맞도록 반올림한 값으로 다시 계산 ----
  function r1(v) { var r = Math.round(v * 10) / 10; return r === 0 ? 0 : r; }
  function fmt(v) { return r1(v).toFixed(1).replace('-', '−'); }

  // ---- 캔버스 ----
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var CSS_H = 330;
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || 860;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(CSS_H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return w;
  }

  var INK = '#26241f';
  var MUTED = '#8a857a';
  var FAINT = '#e8e4da';
  var ACCENT = '#d2461e'; // 오직 '두 끝을 잇는 직선' 한 가지 뜻
  var FONT = '-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';

  PieceKit.loop({
    step: function () { /* 쌓이는 상태 없음 — 구간은 t 의 함수 */ },
    draw: function (t) {
      var Wc = fit();
      ctx.clearRect(0, 0, Wc, CSS_H);

      // 배치
      var roadX = 56;
      var gL = 128, gR = Wc - 28, gT = 18, gB = 262;
      var T_MIN = 0, T_MAX = 10, X_MIN = -2, X_MAX = 36;
      function px(tau) { return gL + (tau - T_MIN) / (T_MAX - T_MIN) * (gR - gL); }
      function py(pos) { return gB - (pos - X_MIN) / (X_MAX - X_MIN) * (gB - gT); }

      var sc = schedule(t);
      var a = sc.a, b = sc.b;
      var xa = x(a), xb = x(b);

      PieceKit.mark('구간 띠', function () {
        ctx.fillStyle = FAINT;
        ctx.fillRect(px(a), gT, px(b) - px(a), gB - gT);
      });

      PieceKit.mark('축', function () {
        ctx.strokeStyle = MUTED;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(gL, gT); ctx.lineTo(gL, gB); ctx.lineTo(gR, gB);
        ctx.stroke();
        ctx.fillStyle = MUTED;
        ctx.font = '12px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (var s = 0; s <= 10; s += 2) {
          ctx.beginPath(); ctx.moveTo(px(s), gB); ctx.lineTo(px(s), gB + 4); ctx.stroke();
          ctx.fillText(String(s), px(s), gB + 7);
        }
        ctx.textAlign = 'right';
        ctx.fillText('시간 (s)', gR, gB + 22);
        ctx.textBaseline = 'middle';
        for (var m = 0; m <= 30; m += 10) {
          ctx.beginPath(); ctx.moveTo(gL - 4, py(m)); ctx.lineTo(gL, py(m)); ctx.stroke();
          ctx.fillText(String(m), gL - 7, py(m));
        }
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('위치 (m)', gL + 6, gT - 2);
      });

      PieceKit.mark('도로', function () {
        ctx.strokeStyle = MUTED;
        ctx.lineWidth = 10;
        ctx.lineCap = 'butt';
        ctx.globalAlpha = 0.25;
        ctx.beginPath(); ctx.moveTo(roadX, py(X_MIN)); ctx.lineTo(roadX, py(X_MAX)); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = MUTED;
        ctx.font = '12px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('도로', roadX, gB + 7);
      });

      PieceKit.mark('위치 안내선', function () {
        ctx.strokeStyle = MUTED;
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        ctx.moveTo(roadX + 8, py(xa)); ctx.lineTo(px(a), py(xa));
        ctx.moveTo(roadX + 8, py(xb)); ctx.lineTo(px(b), py(xb));
        ctx.stroke();
        ctx.setLineDash([]);
      });

      PieceKit.mark('위치-시간 곡선', function () {
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        var n = 240;
        for (var i = 0; i <= n; i++) {
          var tau = T_MIN + (T_MAX - T_MIN) * i / n;
          if (i === 0) ctx.moveTo(px(tau), py(x(tau))); else ctx.lineTo(px(tau), py(x(tau)));
        }
        ctx.stroke();
      });

      PieceKit.mark('기울기 삼각형', function () {
        ctx.strokeStyle = MUTED;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px(a), py(xa)); ctx.lineTo(px(b), py(xa)); ctx.lineTo(px(b), py(xb));
        ctx.stroke();
      });

      PieceKit.mark('두 끝을 잇는 직선', function () {
        // 구간 밖으로 조금 연장해 기울기가 눈에 띄게 한다
        var ext = 0.6;
        var slope = (xb - xa) / (b - a);
        var t0 = Math.max(T_MIN, a - ext), t1 = Math.min(T_MAX, b + ext);
        ctx.strokeStyle = ACCENT;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.45;
        ctx.beginPath();
        ctx.moveTo(px(t0), py(xa + slope * (t0 - a)));
        ctx.lineTo(px(t1), py(xa + slope * (t1 - a)));
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px(a), py(xa)); ctx.lineTo(px(b), py(xb));
        ctx.stroke();
      });

      PieceKit.mark('구간 양 끝 점', function () {
        [[a, xa], [b, xb]].forEach(function (p) {
          ctx.fillStyle = INK;
          ctx.beginPath(); ctx.arc(px(p[0]), py(p[1]), 5, 0, Math.PI * 2); ctx.fill();
        });
      });

      PieceKit.mark('변위 화살표', function () {
        var y0 = py(xa), y1 = py(xb);
        ctx.fillStyle = INK;
        ctx.strokeStyle = INK;
        ctx.beginPath(); ctx.arc(roadX, y0, 4, 0, Math.PI * 2); ctx.fill();
        if (Math.abs(y1 - y0) > 10) {
          var dir = y1 < y0 ? -1 : 1;
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(roadX, y0); ctx.lineTo(roadX, y1 - dir * 8); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(roadX, y1);
          ctx.lineTo(roadX - 6, y1 - dir * 10);
          ctx.lineTo(roadX + 6, y1 - dir * 10);
          ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(roadX, y1, 4, 0, Math.PI * 2); ctx.fill();
        }
      });

      PieceKit.mark('캡션', function () {
        var ra = r1(a), rb = r1(b);
        var dt = r1(rb - ra);
        // 위치 변화도 화면에 쓴 (반올림한) 시각에서 계산한다 — 0.05초 미만 차이라 그림과 구분되지 않는다
        var dx = r1(x(rb) - x(ra));
        var v = dt > 0 ? r1(dx / dt) : 0;
        var text = sc.lead + ' — ' + fmt(ra) + '~' + fmt(rb) + '초: ' +
          fmt(dx) + ' m ÷ ' + fmt(dt) + ' s = ' + fmt(v) + ' m/s';
        ctx.fillStyle = INK;
        ctx.font = '15px ' + FONT;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(text, 24, CSS_H - 14);
      });
    },
  });
})();
</script>
</body>
</html>
