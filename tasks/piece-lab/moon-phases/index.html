<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달의 위상</title>
<style>
  :root {
    --bg: #0e131d;
    --muted: #8a93a3;
    --text: #d9dde4;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { max-width: 900px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .caption { min-height: 2.8em; padding: 6px 16px 12px; font-size: 15px; line-height: 1.45; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c"></canvas>
  <div class="caption" id="caption"></div>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
// 좌표: 물리 좌표는 y 가 위, 태양은 +x 방향 아주 먼 곳. 달은 북쪽에서 볼 때 반시계로 돈다.
const W = 840, H = 340;
const COLOR = {
  bg: '#0e131d',
  sunlit: '#ece6d6',      // 햇빛 받는 달 표면
  night: '#2b3140',       // 햇빛 못 받는 달 표면
  earthLit: '#4f86c6',
  earthNight: '#1d2c45',
  ray: 'rgba(240, 232, 205, 0.16)',
  orbit: 'rgba(160, 170, 190, 0.28)',
  sight: 'rgba(160, 170, 190, 0.45)',
  label: '#8a93a3',
  accent: '#ff9a3c',      // 강조색: 오직 "지구를 향한 반쪽(보이는 반쪽)"
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const captionEl = document.getElementById('caption');
const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
canvas.width = W * dpr;
canvas.height = H * dpr;

const ORBIT = { cx: 235, cy: 172, R: 104 };
const MOON_R = 24;
const EARTH_R = 13;
const VIEW = { cx: 640, cy: 168, R: 112 };

const PERIOD = 16;               // 한 바퀴 16초
const THETA0 = 0.6;              // 시작: 초승달 무렵 (이미 진행 중)
const OMEGA = 2 * Math.PI / PERIOD;

// 조작 상태: 달을 끌면 자동 진행 위에 위상 차이가 더해진다
let dragOffset = 0;
let dragging = false;
let dragTarget = 0;   // 끄는 중 포인터가 가리키는 궤도 각
let trackedT = 0;     // 마지막으로 그린 시각

function moonAngle(t) {
  trackedT = t;
  if (dragging && !PieceKit.frozen) dragOffset = dragTarget - (THETA0 + OMEGA * t);
  const off = PieceKit.frozen ? 0 : dragOffset;
  return THETA0 + OMEGA * t + off;
}

function moonPos(theta) {
  return { x: ORBIT.cx + ORBIT.R * Math.cos(theta), y: ORBIT.cy - ORBIT.R * Math.sin(theta) };
}

// ── 지구에서 본 달: 구의 각 점마다 햇빛 방향과의 내적으로 명암을 정한다
const N = 200;
const off = document.createElement('canvas');
off.width = N; off.height = N;
const offCtx = off.getContext('2d');
const img = offCtx.createImageData(N, N);
function hex(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
const LIT = hex(COLOR.sunlit), DARK = hex(COLOR.night);

function renderMoonDisc(theta) {
  const dx = Math.cos(theta), dy = Math.sin(theta); // 지구→달 시선 방향
  // 오른쪽 벡터 r = d × z = (dy, -dx, 0), 위쪽 = z, 표면 법선 n = u·r + v·z − w·d
  const data = img.data;
  for (let j = 0; j < N; j++) {
    const v = 1 - (j + 0.5) / N * 2;
    for (let i = 0; i < N; i++) {
      const u = (i + 0.5) / N * 2 - 1;
      const rr = u * u + v * v;
      const k = (j * N + i) * 4;
      if (rr > 1.02) { data[k + 3] = 0; continue; }
      const w = Math.sqrt(Math.max(0, 1 - rr));
      const nx = u * dy - w * dx;           // 법선의 태양 방향 성분
      let s = (nx + 0.025) / 0.05; s = s < 0 ? 0 : s > 1 ? 1 : s;
      s = s * s * (3 - 2 * s);
      const shade = 0.93 + 0.07 * Math.max(0, nx);
      for (let c = 0; c < 3; c++) data[k + c] = DARK[c] + (LIT[c] * shade - DARK[c]) * s;
      const edge = (1 - Math.sqrt(rr)) * N / 2 + 0.5;
      data[k + 3] = 255 * Math.max(0, Math.min(1, edge));
    }
  }
  offCtx.putImageData(img, 0, 0);
}

function captionFor(theta) {
  const k = (1 - Math.cos(theta)) / 2; // 보이는 원판 중 밝은 면적 비율
  const head = '햇빛 받는 반쪽은 늘 태양 쪽을 향한 채 그대로이고, 달이 돌면서 지구를 향한 반쪽이 돌아간다. ';
  if (k < 0.03) return head + '지금은 두 반쪽이 거의 겹치지 않아, 지구에서는 그늘 쪽만 보인다.';
  if (k > 0.97) return head + '지금은 두 반쪽이 거의 포개져, 지구에서는 햇빛 받는 쪽만 보인다.';
  return head + '지금은 두 반쪽이 일부만 겹쳐, 겹친 만큼만 밝게 보인다.';
}
let lastCaption = '';

PieceKit.loop({
  step(dt, t) { /* 달의 위치는 t 의 함수 — 쌓이는 상태 없음 */ },
  draw(t) {
    const theta = moonAngle(t);
    const m = moonPos(theta);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COLOR.bg;
    ctx.fillRect(0, 0, W, H);

    PieceKit.mark('햇빛', () => {
      ctx.strokeStyle = COLOR.ray;
      ctx.lineWidth = 1.2;
      const shift = (t * 70) % 46;
      ctx.beginPath();
      for (let y = 30; y <= 312; y += 18) {
        const stagger = ((y / 18) % 2) * 23;
        for (let x = 470 + 46; x > -46; x -= 46) {
          const x0 = x - shift - stagger;
          const a = Math.max(8, x0), b = Math.min(460, x0 + 22);
          if (b > a) { ctx.moveTo(a, y); ctx.lineTo(b, y); }
        }
      }
      ctx.stroke();
      ctx.fillStyle = COLOR.label;
      ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('← 태양에서 오는 햇빛', 456, 16);
    });

    PieceKit.mark('달의 궤도', () => {
      ctx.strokeStyle = COLOR.orbit;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(ORBIT.cx, ORBIT.cy, ORBIT.R, 0, Math.PI * 2);
      ctx.stroke();
    });

    PieceKit.mark('궤도 위 여덟 자리의 달', () => {
      for (let q = 0; q < 8; q++) {
        const p = moonPos(q * Math.PI / 4);
        const r = 8;
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = COLOR.night;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, Math.PI / 2, Math.PI * 1.5); ctx.fill();
        ctx.fillStyle = COLOR.sunlit;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    });

    PieceKit.mark('지구', () => {
      const { cx, cy } = ORBIT;
      ctx.fillStyle = COLOR.earthNight;
      ctx.beginPath(); ctx.arc(cx, cy, EARTH_R, Math.PI / 2, Math.PI * 1.5); ctx.fill();
      ctx.fillStyle = COLOR.earthLit;
      ctx.beginPath(); ctx.arc(cx, cy, EARTH_R, -Math.PI / 2, Math.PI / 2); ctx.fill();
    });

    PieceKit.mark('지구에서 달을 보는 시선', () => {
      const ang = Math.atan2(m.y - ORBIT.cy, m.x - ORBIT.cx);
      ctx.strokeStyle = COLOR.sight;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(ORBIT.cx + Math.cos(ang) * (EARTH_R + 3), ORBIT.cy + Math.sin(ang) * (EARTH_R + 3));
      ctx.lineTo(m.x - Math.cos(ang) * (MOON_R + 6), m.y - Math.sin(ang) * (MOON_R + 6));
      ctx.stroke();
      ctx.setLineDash([]);
    });

    PieceKit.mark('위에서 본 달', () => {
      ctx.fillStyle = COLOR.night;
      ctx.beginPath(); ctx.arc(m.x, m.y, MOON_R, Math.PI / 2, Math.PI * 1.5); ctx.fill();
      ctx.fillStyle = COLOR.sunlit;
      ctx.beginPath(); ctx.arc(m.x, m.y, MOON_R, -Math.PI / 2, Math.PI / 2); ctx.fill();
    });

    PieceKit.mark('지구를 향한 반쪽(위에서)', () => {
      const a = Math.atan2(ORBIT.cy - m.y, ORBIT.cx - m.x); // 달에서 지구 쪽
      ctx.strokeStyle = COLOR.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y, MOON_R + 3, a - Math.PI / 2, a + Math.PI / 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(m.x + Math.cos(a - Math.PI / 2) * (MOON_R + 3), m.y + Math.sin(a - Math.PI / 2) * (MOON_R + 3));
      ctx.lineTo(m.x + Math.cos(a + Math.PI / 2) * (MOON_R + 3), m.y + Math.sin(a + Math.PI / 2) * (MOON_R + 3));
      ctx.stroke();
      ctx.setLineDash([]);
    });

    PieceKit.mark('지구에서 본 달', () => {
      renderMoonDisc(theta);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, VIEW.cx - VIEW.R, VIEW.cy - VIEW.R, VIEW.R * 2, VIEW.R * 2);
    });

    PieceKit.mark('지구를 향한 반쪽(지구에서)', () => {
      ctx.strokeStyle = COLOR.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(VIEW.cx, VIEW.cy, VIEW.R + 4, 0, Math.PI * 2);
      ctx.stroke();
    });

    PieceKit.mark('칸 이름', () => {
      ctx.fillStyle = COLOR.label;
      ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('북쪽 위에서 내려다본 지구와 달', ORBIT.cx, 332);
      ctx.fillText('지구에서 올려다본 달', VIEW.cx, 332);
    });

    PieceKit.mark('캡션', () => {
      const text = captionFor(theta);
      if (text !== lastCaption) { captionEl.textContent = text; lastCaption = text; }
    });
  },
});

// ── 조작: 왼쪽 칸의 달을 끌어 궤도 위 자리를 옮긴다 (?t= 촬영 중에는 무시)
function pointerToCanvas(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
}
function aim(p) {
  dragTarget = Math.atan2(ORBIT.cy - p.y, p.x - ORBIT.cx);
  dragOffset = dragTarget - (THETA0 + OMEGA * trackedT);
}
canvas.addEventListener('pointerdown', (e) => {
  if (PieceKit.frozen) return;
  const p = pointerToCanvas(e);
  const d = Math.hypot(p.x - ORBIT.cx, p.y - ORBIT.cy);
  if (Math.abs(d - ORBIT.R) < 34) {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    aim(p);
  }
});
canvas.addEventListener('pointermove', (e) => { if (dragging && !PieceKit.frozen) aim(pointerToCanvas(e)); });
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });
</script>
</body>
</html>
