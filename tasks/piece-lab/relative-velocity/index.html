<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상대 속도 — 기준틀을 바꾸면 길이 기운다</title>
<style>
  :root { --paper:#f3efe6; --ink:#3b3a36; --muted:#7a766c; --accent:#d1462f; }
  html,body { margin:0; }
  body { background:var(--paper); color:var(--ink);
         font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; }
  #piece { max-width:880px; margin:0 auto; }
  canvas { display:block; width:100%; height:272px; }
  .row { display:flex; align-items:center; gap:12px; padding:8px 14px 12px; }
  .row label { color:var(--muted); font-size:13px; white-space:nowrap; }
  .row input[type=range] { flex:0 1 260px; accent-color:var(--accent); }
  .row .val { font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink); }
  .row .hint { font-size:12px; color:var(--muted); margin-left:auto; }
</style>
</head>
<body>
<div id="piece">
  <canvas id="c"></canvas>
  <div class="row">
    <label for="u">보는 사람의 속도</label>
    <input id="u" type="range" min="-0.5" max="2" step="0.01" value="0">
    <span class="val" id="uval">0.0 m/s</span>
    <span class="hint">강물은 1.2 m/s</span>
  </div>
</div>

<script src="../_harness/piece-kit.js"></script>
<script>
(function () {
  'use strict';

  // ───────────────────────────────── 물리 상수 (SI)
  var V_WATER  = 1.2;    // 강물의 속도 (m/s, 하류 = +x)
  var V_BOAT   = 1.6;    // 물에 대한 배의 속도 (m/s, 맞은편 = +y). 뱃머리는 언제나 +y.
  var RIVER_W  = 8.0;    // 강폭 (m)
  var CROSS_T  = RIVER_W / V_BOAT;   // 한 번 건너는 데 걸리는 시간 = 5.0 s
  var PIER_L   = 12.0;   // 선착장 간격 (m)
  var SPAN     = 60.0;   // 배경 격자가 되풀이되는 길이 (m) — 어느 기준틀에서도 화면이 유계
  var PX       = 21;     // 1 m = 21 px (가로·세로 같은 배율)

  // ───────────────────────────────── 화면 배치 (CSS px)
  var Y_FAR_END = 30;                       // 맞은편 둑이 끝나고 물이 시작하는 높이
  var Y_NEAR    = Y_FAR_END + RIVER_W * PX; // 이쪽 둑의 물가 = 198
  var Y_LAND    = Y_NEAR + 34;              // 이쪽 둑이 끝나는 높이 = 232
  var H         = 272;

  var COL = {
    paper:'#f3efe6', river:'#86aebb', riverDeep:'#749dac',
    land:'#ded2bb', landEdge:'#c3b294', pebble:'#c6b79b', pier:'#8d7a5d',
    foam:'rgba(255,255,255,0.6)', accent:'#d1462f', ink:'#3b3a36', muted:'#7a766c'
  };

  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  var slider = document.getElementById('u');
  var uval = document.getElementById('uval');
  var W = 860;

  function fit() {
    var d = window.devicePixelRatio || 1;
    W = c.clientWidth || 860;
    c.width = Math.round(W * d); c.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  fit();
  window.addEventListener('resize', fit);

  // ───────────────────────────────── 되풀이되는 배경 (세계 좌표, 미터)
  var foam = [], pebbles = [];
  for (var i = 0; i < 150; i++) {
    foam.push({
      x: PieceKit.random() * SPAN,
      y: 0.25 + PieceKit.random() * (RIVER_W - 0.5),
      len: 0.18 + PieceKit.random() * 0.42,
      a: 0.25 + PieceKit.random() * 0.45
    });
  }
  for (var j = 0; j < 90; j++) {
    var far = PieceKit.random() < 0.5;
    pebbles.push({
      x: PieceKit.random() * SPAN,
      sy: far ? PieceKit.random() * (Y_FAR_END - 5) + 2 : Y_NEAR + 5 + PieceKit.random() * (Y_LAND - Y_NEAR - 8),
      r: 0.7 + PieceKit.random() * 1.8
    });
  }
  var PIERS = Math.round(SPAN / PIER_L); // 5개, 딱 나누어떨어져 이음매가 없다

  // ───────────────────────────────── 상태
  var Xobs = 0;        // 보는 사람이 여기까지 흘러온 거리 (m). x' = x - Xobs
  var u = 0;           // 지금 기준틀의 속도 (m/s)
  var curT = 0;

  var trip = null;     // { x0, tStart }  — 지금 건너는 배
  var trail = [];      // [{x, y, t}] 세계 좌표 + 그때의 시각
  var dots = [];       // 0.4 초마다 찍은 자국
  var ghost = null;    // 방금 끝난 항해의 자취 (0.45 초 동안 사라진다)

  var mode = 'auto';   // 'auto' | 'user'
  var lastInput = -99;
  var blend = 0, blendFrom = 0;   // 자동으로 돌아올 때 값이 튀지 않게 섞는다
  var phaseOff = 3.0;             // 자동 순회의 위상

  // 자동 순회: 강둑에 머물다 → 강물로 옮겨 가고 → 강물에 머물다 → 강둑으로 돌아온다
  var CYCLE = 14.0;
  function smooth(s) { return s * s * (3 - 2 * s); }
  function lambdaAt(t) {
    var p = (t + phaseOff) % CYCLE; if (p < 0) p += CYCLE;
    if (p < 4.5) return 0;
    if (p < 7.5) return smooth((p - 4.5) / 3);
    if (p < 11.0) return 1;
    return 1 - smooth((p - 11.0) / 3);
  }
  function invSmooth(y) {
    y = Math.min(1, Math.max(0, y));
    return 0.5 - Math.sin(Math.asin(1 - 2 * y) / 3);
  }

  function startTrip(t) {
    if (trail.length > 1) ghost = { trail: trail, dots: dots, deadAt: t };
    var targetM = 0.32 * W / PX;                       // 화면 왼쪽 1/3 즈음에서 떠난다
    var x0 = PIER_L * Math.round((Xobs + targetM) / PIER_L);
    trip = { x0: x0, tStart: t };
    trail = []; dots = [];
  }

  function advanceBoat(t, dt) {
    var tau = t - trip.tStart;
    if (tau >= CROSS_T) { startTrip(trip.tStart + CROSS_T); tau = t - trip.tStart; }
    // 배는 뱃머리를 +y 로 고정한 채 물에 대해 V_BOAT 로 나아가고, 물이 +x 로 실어 나른다.
    var x = trip.x0 + V_WATER * tau;
    var y = V_BOAT * tau;
    trail.push({ x: x, y: y, t: t });
    var k = Math.floor(tau / 0.4);
    if (dots.length <= k) dots.push({ x: x, y: y, t: t });
  }

  // ───────────────────────────────── 도착한 순간 이미 진행 중이도록 2.7 초를 미리 돌린다
  (function preroll() {
    var t0 = -2.7;                 // 이 구간의 기준틀은 강둑(u = 0)이므로 Xobs 는 0 그대로
    startTrip(t0);
    for (var n = 0; n < Math.round(2.7 * 60); n++) advanceBoat(t0 + n / 60, 1 / 60);
    curT = 0;
  })();

  // ───────────────────────────────── 조작기
  slider.addEventListener('input', function () {
    if (PieceKit.frozen) return;
    mode = 'user'; lastInput = curT; blend = 0;
  });

  function step(dt, t) {
    curT = t;
    var uAuto = lambdaAt(t) * V_WATER;

    if (!PieceKit.frozen && mode === 'user') {
      if (t - lastInput > 4.0) {
        // 읽는 사람이 놓은 자리에서 순회를 이어 간다 — 값이 튀지 않게 1.2 초 섞는다
        blendFrom = parseFloat(slider.value);
        var lam = Math.min(1, Math.max(0, blendFrom / V_WATER));
        var pStar = 4.5 + 3 * invSmooth(lam);
        phaseOff = pStar - t;
        mode = 'auto'; blend = 1;
        uAuto = lambdaAt(t) * V_WATER;
        u = blendFrom;
      } else {
        u = parseFloat(slider.value);
      }
    }
    if (mode === 'auto' || PieceKit.frozen) {
      if (blend > 0) { blend = Math.max(0, blend - dt / 1.2); u = uAuto + (blendFrom - uAuto) * smooth(blend); }
      else u = uAuto;
    }

    Xobs += u * dt;                 // 보는 사람이 실제로 흘러간 거리 — 둑이 미끄러지는 이유
    advanceBoat(t, dt);
    if (ghost && t - ghost.deadAt > 0.45) ghost = null;
  }

  // ───────────────────────────────── 그리기 도구
  // 지금 기준틀에서 본 화면 가로 위치.
  //   지금 있는 것:   X = (x - Xobs) * PX
  //   지나간 사건:    X = (x - Xobs + u*(t - t_i)) * PX   ← 갈릴레이 변환의 전단
  function screenNow(xm) { return (xm - Xobs) * PX; }
  function screenPast(xm, ti, t) { return (xm - Xobs + u * (t - ti)) * PX; }
  function screenY(ym) { return Y_NEAR - ym * PX; }

  function eachWrapped(xm, fn) {
    var w = ((xm - Xobs) % SPAN + SPAN) % SPAN;
    var px = w * PX;
    if (px > -90 && px < W + 90) fn(px);
    px -= SPAN * PX;
    if (px > -90 && px < W + 90) fn(px);
  }

  function drawPath(list, alpha, t) {
    if (list.length < 2) return;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.strokeStyle = COL.accent; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var i = 0; i < list.length; i++) {
      var p = list[i], X = screenPast(p.x, p.t, t), Y = screenY(p.y);
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke(); ctx.restore();
  }

  function caption(t) {
    var rel = u - V_WATER, who, what;
    if (Math.abs(u) < 0.03) who = '강둑에 서서 본다';
    else if (Math.abs(rel) < 0.03) who = '강물에 떠서 같이 흐르며 본다';
    else if (u < 0) who = '강물을 거슬러 ' + Math.abs(u).toFixed(1) + ' m/s 로 올라가며 본다';
    else who = '강물보다 ' + (rel < 0 ? '느린 ' : '빠른 ') + u.toFixed(1) + ' m/s 로 떠내려가며 본다';

    if (Math.abs(rel) < 0.03) what = '배가 지나온 길이 똑바로 선다';
    else if (rel < 0) what = '배가 지나온 길이 오른쪽으로 기운다';
    else what = '배가 지나온 길이 왼쪽으로 기운다';
    return who + ' — ' + what;
  }

  // ───────────────────────────────── draw
  function draw(t) {
    PieceKit.mark('바탕', function () {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, W, H);
    });

    PieceKit.mark('강물', function () {
      var g = ctx.createLinearGradient(0, Y_FAR_END, 0, Y_NEAR);
      g.addColorStop(0, COL.riverDeep); g.addColorStop(0.5, COL.river); g.addColorStop(1, COL.riverDeep);
      ctx.fillStyle = g; ctx.fillRect(0, Y_FAR_END, W, Y_NEAR - Y_FAR_END);
    });

    PieceKit.mark('물거품', function () {
      // 물과 함께 흐른다. 강물의 기준틀에서는 멈춰 선다.
      for (var i = 0; i < foam.length; i++) {
        var f = foam[i];
        eachWrapped(f.x + V_WATER * t, function (px) {
          ctx.strokeStyle = 'rgba(255,255,255,' + f.a.toFixed(2) + ')';
          ctx.lineWidth = 1.6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(px, screenY(f.y)); ctx.lineTo(px + f.len * PX, screenY(f.y)); ctx.stroke();
        });
      }
    });

    PieceKit.mark('강둑', function () {
      // 땅에 붙어 있다. 강둑의 기준틀에서는 멈춰 서고, 다른 기준틀에서는 미끄러진다.
      ctx.fillStyle = COL.land;
      ctx.fillRect(0, 0, W, Y_FAR_END);
      ctx.fillRect(0, Y_NEAR, W, Y_LAND - Y_NEAR);
      ctx.fillStyle = COL.landEdge;
      ctx.fillRect(0, Y_FAR_END - 2, W, 2);
      ctx.fillRect(0, Y_NEAR, W, 2);
      ctx.fillStyle = COL.pebble;
      for (var i = 0; i < pebbles.length; i++) {
        var p = pebbles[i];
        eachWrapped(p.x, function (px) { ctx.beginPath(); ctx.arc(px, p.sy, p.r, 0, 6.2832); ctx.fill(); });
      }
    });

    PieceKit.mark('선착장', function () {
      ctx.fillStyle = COL.pier;
      for (var k = 0; k < PIERS; k++) {
        eachWrapped(k * PIER_L, function (px) { ctx.fillRect(px - 3, Y_NEAR - 13, 6, 15); });
        eachWrapped(k * PIER_L + PIER_L / 2, function (px) { ctx.fillRect(px - 3, Y_FAR_END - 2, 6, 15); });
      }
    });

    if (ghost) PieceKit.mark('지나온 길', function () { drawPath(ghost.trail, 0.45 * (1 - (t - ghost.deadAt) / 0.45), t); });
    PieceKit.mark('지나온 길', function () { drawPath(trail, 0.9, t); });

    PieceKit.mark('시간 자국', function () {
      // 0.4 초마다 하나. 자국 사이 간격이 곧 이 기준틀에서 본 배의 빠르기다.
      ctx.fillStyle = COL.accent;
      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        ctx.beginPath(); ctx.arc(screenPast(d.x, d.t, t), screenY(d.y), 2.6, 0, 6.2832); ctx.fill();
      }
    });

    var last = trail[trail.length - 1];
    var bx = screenNow(last.x), by = screenY(last.y);

    PieceKit.mark('배', function () {
      // 뱃머리는 언제나 맞은편(+y). 기준틀이 바뀌어도 이것만은 그대로다.
      ctx.save(); ctx.translate(bx, by);
      ctx.beginPath();
      ctx.moveTo(0, -17);
      ctx.quadraticCurveTo(7, -6, 7, 13);
      ctx.lineTo(-7, 13);
      ctx.quadraticCurveTo(-7, -6, 0, -17);
      ctx.fillStyle = COL.accent; ctx.fill();
      ctx.strokeStyle = COL.paper; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = COL.paper;
      ctx.fillRect(-2.5, -3, 5, 8);
      ctx.restore();
    });

    PieceKit.mark('캡션', function () {
      ctx.fillStyle = COL.ink;
      ctx.font = '15px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(caption(t), 14, Y_LAND + 21);
    });

    if (mode === 'auto' || PieceKit.frozen) slider.value = String(Math.max(-0.5, Math.min(2, u)));
    uval.textContent = u.toFixed(1) + ' m/s';
  }

  PieceKit.loop({ step: step, draw: draw });
})();
</script>
</body>
</html>
