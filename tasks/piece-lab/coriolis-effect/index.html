<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코리올리 효과</title>
<style>
  :root { --bg: #fbfaf7; --ink: #2b2b2b; --muted: #77736b; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { max-width: 900px; margin: 0 auto; padding: 12px 16px; box-sizing: border-box; }
  canvas { display: block; width: 100%; height: auto; }
  .caption { margin: 6px 0 0; font-size: 15px; line-height: 1.5; text-align: center; min-height: 1.5em; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="stage"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
  // 논리 좌표계 — 두 패널을 가로로 나란히 둔다
  const W = 840, H = 350;
  const canvas = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 색 — 같은 대상은 두 패널에서 같은 색. 강조색은 '공과 그 길' 하나에만
  const COLOR = {
    disk: '#e9e5dc', diskEdge: '#c9c3b6', spoke: '#d6d0c4',
    target: '#4a4a4a', thrower: '#4a4a4a', label: '#77736b',
    ball: '#d9582b',
  };

  // 물리 설정
  const R = 130;               // 원판 반지름 (화면 단위)
  const OMEGA = 0.7;           // 원판 각속도 [rad/s], 화면에서 시계 방향으로 돈다
  const FLIGHT = 2.4;          // 공이 한가운데서 가장자리까지 가는 시간 [s]
  const CYCLE = 3.6;           // 한 번 던지고 다음 던지기까지 [s]
  const OFFSET = 1.0;          // t=0 에 이미 공이 날아가는 중이도록 주기를 당긴다
  const AIM = -Math.PI / 2;    // 원판 위에 고정된 과녁의 각도 (원판 좌표, 위쪽)
  const TRAIL_SEG = 64;

  const panels = [
    { key: 'outside', cx: 215, cy: 185, label: '바깥에서 보면' },
    { key: 'onDisk',  cx: 625, cy: 185, label: '원판 위에서 보면' },
  ];

  // 시간에서 바로 나오는 상태 — 누적 없이 t 로만 결정된다
  function throwState(t) {
    const n = Math.floor((t + OFFSET) / CYCLE);
    const t0 = n * CYCLE - OFFSET;     // 이번 공을 던진 시각
    const s = t - t0;                  // 던진 뒤 흐른 시간
    const flying = s < FLIGHT;
    const fade = flying ? 1 : Math.max(0, 1 - (s - FLIGHT) / (CYCLE - FLIGHT));
    return { t0, s, flying, fade, tau: Math.min(s, FLIGHT) };
  }

  // 원판이 돈 각도
  const diskAngle = (t) => OMEGA * t;

  // 공의 위치 (패널 중심 기준). 던진 방향은 던지는 순간 과녁을 향한다.
  function ballPos(panelKey, t0, tau) {
    const r = R * tau / FLIGHT;
    // 바깥: 던진 순간의 방향으로 곧게
    // 원판 위: 같은 점을 원판이 돈 만큼 되돌려 본다
    const ang = panelKey === 'outside'
      ? AIM + OMEGA * t0
      : AIM + OMEGA * t0 - OMEGA * (t0 + tau);
    return [r * Math.cos(ang), r * Math.sin(ang)];
  }

  function drawDisk(p, phi) {
    ctx.save();
    ctx.translate(p.cx, p.cy);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = COLOR.disk;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = COLOR.diskEdge;
    ctx.stroke();
    // 살 — 원판이 도는지 서 있는지를 보이게 하는 무늬
    ctx.rotate(phi);
    ctx.strokeStyle = COLOR.spoke;
    ctx.lineWidth = 1;
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3 + Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(R * Math.cos(a), R * Math.sin(a));
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTarget(p, phi) {
    const a = AIM + phi;
    const x = p.cx + R * Math.cos(a), y = p.cy + R * Math.sin(a);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = COLOR.target;
    ctx.strokeStyle = COLOR.target;
    ctx.lineWidth = 2;
    ctx.beginPath();            // 깃대
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -20);
    ctx.stroke();
    ctx.beginPath();            // 깃발
    ctx.moveTo(0, -20);
    ctx.lineTo(12, -15);
    ctx.lineTo(0, -10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();            // 받침
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawThrower(p) {
    ctx.beginPath();
    ctx.arc(p.cx, p.cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = COLOR.thrower;
    ctx.fill();
  }

  function drawTrail(p, st) {
    ctx.save();
    ctx.globalAlpha = 0.85 * st.fade;
    ctx.strokeStyle = COLOR.ball;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= TRAIL_SEG; i++) {
      const [x, y] = ballPos(p.key, st.t0, st.tau * i / TRAIL_SEG);
      if (i === 0) ctx.moveTo(p.cx + x, p.cy + y);
      else ctx.lineTo(p.cx + x, p.cy + y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawBall(p, st) {
    const [x, y] = ballPos(p.key, st.t0, st.tau);
    ctx.save();
    ctx.globalAlpha = st.fade;
    ctx.beginPath();
    ctx.arc(p.cx + x, p.cy + y, 7, 0, Math.PI * 2);
    ctx.fillStyle = COLOR.ball;
    ctx.fill();
    ctx.restore();
  }

  function drawLabel(p) {
    ctx.fillStyle = COLOR.label;
    ctx.font = '14px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(p.label, p.cx, 8);
  }

  PieceKit.loop({
    step(dt, t) {
      // 모든 상태가 t 에서 해석적으로 나오므로 쌓을 것이 없다
    },
    draw(t) {
      ctx.clearRect(0, 0, W, H);
      const st = throwState(t);
      const [outside, onDisk] = panels;

      PieceKit.mark('관점 이름', () => { drawLabel(outside); drawLabel(onDisk); });
      PieceKit.mark('원판', () => {
        drawDisk(outside, diskAngle(t));   // 바깥에서는 돈다
        drawDisk(onDisk, 0);               // 원판 위에서는 서 있다
      });
      PieceKit.mark('과녁', () => {
        drawTarget(outside, diskAngle(t)); // 원판에 붙어 함께 돈다
        drawTarget(onDisk, 0);
      });
      PieceKit.mark('던지는 사람', () => { drawThrower(outside); drawThrower(onDisk); });
      PieceKit.mark('공이 지나간 길', () => { drawTrail(outside, st); drawTrail(onDisk, st); });
      PieceKit.mark('공', () => { drawBall(outside, st); drawBall(onDisk, st); });
      PieceKit.mark('캡션', () => {
        const text = '같은 공인데, 바깥에서는 곧게 날아가고 도는 원판 위에서는 휘어 과녁을 비껴 간다';
        if (captionEl.textContent !== text) captionEl.textContent = text;
      });
    },
  });
</script>
</body>
</html>
