<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케플러 제2법칙</title>
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #2b2b2b;
    --muted: #7a766e;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { max-width: 900px; margin: 0 auto; padding: 8px 0; }
  canvas { display: block; width: 100%; height: auto; }
  .caption { min-height: 1.5em; margin: 6px 12px 0; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
// 논리 좌표계 크기 (CSS 가 가로 폭에 맞춰 줄인다)
const W = 860, H = 320;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const captionEl = document.getElementById('caption');

// ── 색 ── 같은 대상은 같은 색, 강조색은 "지금 쓸고 있는 넓이" 하나에만
const COLOR = {
  orbit: '#b9b3a8',
  sectorA: '#cdd7e3',   // 끝난 칸 (짝수)
  sectorB: '#aebdcf',   // 끝난 칸 (홀수)
  now: '#e07a2f',       // 강조: 지금 쓸고 있는 넓이
  seam: '#fbfaf7',
  sun: '#8a8378',
  planet: '#2b2b2b',
  line: '#2b2b2b',
  label: '#7a766e',
};

// ── 궤도 ──
const E_ECC = 0.8;               // 이심률
const A = 240;                   // 긴반지름 (px)
const B = A * Math.sqrt(1 - E_ECC * E_ECC);
const CX = 280, CY = 160;        // 타원 중심
const SUN = { x: CX - A * E_ECC, y: CY };  // 초점 (왼쪽): 근일점이 왼쪽 끝
const N = 12;                    // 한 바퀴를 나눈 칸 수
const DT_SLOT = 1.5;             // 한 칸 = 1.5초
const PERIOD = N * DT_SLOT;      // 공전 주기 18초
const T0 = PERIOD - DT_SLOT;     // 도착했을 때 이미 11번 칸의 절반을 쓸고 있다

// 평균 근점 이각 M → 행성 위치 (케플러 방정식을 뉴턴법으로 푼다)
function positionAt(M) {
  let E = M + E_ECC * Math.sin(M);
  for (let i = 0; i < 12; i++) {
    E -= (E - E_ECC * Math.sin(E) - M) / (1 - E_ECC * Math.cos(E));
  }
  return { x: CX - A * Math.cos(E), y: CY - B * Math.sin(E) };
}

// 칸 i 의 경계: 근일점(M=0)을 가운데 두도록 반 칸 밀었다
function slotStartM(i) { return (i - 0.5) * (2 * Math.PI / N); }

// 태양에서 궤도 조각까지의 부채꼴 점열 (넓이도 이것으로 직접 잰다)
function fanPoints(M1, M2) {
  const steps = Math.max(2, Math.ceil(Math.abs(M2 - M1) / (2 * Math.PI) * 360));
  const pts = [];
  for (let k = 0; k <= steps; k++) pts.push(positionAt(M1 + (M2 - M1) * k / steps));
  return pts;
}
function fanArea(pts) {
  let s = 0;
  for (let k = 0; k < pts.length - 1; k++) {
    const p = pts[k], q = pts[k + 1];
    s += (p.x - SUN.x) * (q.y - SUN.y) - (q.x - SUN.x) * (p.y - SUN.y);
  }
  return Math.abs(s) / 2;
}
function fillFan(pts, color) {
  ctx.beginPath();
  ctx.moveTo(SUN.x, SUN.y);
  for (const p of pts) ctx.lineTo(p.x, p.y);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

// 끝난 칸은 모양이 매 주기 같으므로 미리 재어 둔다
const SLOT_AREA_IDEAL = Math.PI * A * B / N;
const slots = [];
for (let i = 0; i < N; i++) {
  const pts = fanPoints(slotStartM(i), slotStartM(i + 1));
  const mid = positionAt((slotStartM(i) + slotStartM(i + 1)) / 2);
  const rMid = Math.hypot(mid.x - SUN.x, mid.y - SUN.y);
  slots.push({ pts, area: fanArea(pts), rMid });
}

// ── 넓이 막대 ──
const BAR_LEFT = 604, BAR_RIGHT = 844, BAR_BASE = 262, BAR_FULL = 190;
const BAR_PITCH = (BAR_RIGHT - BAR_LEFT) / N;
const BAR_W = BAR_PITCH - 6;

// 상태: 자동 진행뿐이라 t 에서 바로 나온다
function phase(t) {
  const te = ((t + T0) % PERIOD + PERIOD) % PERIOD;
  const u = te / DT_SLOT + 0.5;           // 칸 경계를 반 칸 민 것과 맞춘다
  const k = Math.floor(u) % N;
  const frac = u - Math.floor(u);
  return { k, frac, M: te / PERIOD * 2 * Math.PI };
}

function captionFor(k) {
  const r = slots[k].rMid;
  if (r < 0.9 * A) return '태양 가까이: 빠르게 지나가며 짧고 넓적한 부채꼴을 쓴다 — 막대는 다른 칸과 같은 높이까지 찬다';
  if (r > 1.4 * A) return '태양에서 멀리: 느리게 지나가며 길고 가는 부채꼴을 쓴다 — 막대는 다른 칸과 같은 높이까지 찬다';
  return '태양과의 거리가 달라지는 구간: 부채꼴 모양이 바뀌어도 — 막대는 다른 칸과 같은 높이까지 찬다';
}

let lastCaption = '';

PieceKit.loop({
  step(dt, t) { /* 누적 상태 없음: 모든 것이 t 에서 나온다 */ },
  draw(t) {
    const { k, frac, M } = phase(t);
    ctx.clearRect(0, 0, W, H);

    PieceKit.mark('끝난 부채꼴', () => {
      for (let i = 0; i < N; i++) {
        if (i === k) continue;  // 지금 칸은 새로 쓸고 있다
        fillFan(slots[i].pts, i % 2 === 0 ? COLOR.sectorA : COLOR.sectorB);
      }
    });

    const M1 = slotStartM(k);
    // 칸 0 의 시작은 M<0 이므로 현재 M 도 같은 쪽으로 맞춘다
    let Mnow = M;
    if (Mnow > M1 + 2 * Math.PI / N + 1e-9) Mnow -= 2 * Math.PI;
    const nowPts = fanPoints(M1, Mnow);
    const nowArea = frac > 0 ? fanArea(nowPts) : 0;

    PieceKit.mark('지금 쓸고 있는 부채꼴', () => {
      if (frac > 0) fillFan(nowPts, COLOR.now);
    });

    PieceKit.mark('칸 경계', () => {
      ctx.strokeStyle = COLOR.seam;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < N; i++) {
        const p = positionAt(slotStartM(i));
        ctx.beginPath();
        ctx.moveTo(SUN.x, SUN.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
    });

    PieceKit.mark('궤도', () => {
      ctx.beginPath();
      ctx.ellipse(CX, CY, A, B, 0, 0, 2 * Math.PI);
      ctx.strokeStyle = COLOR.orbit;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    });

    const planet = positionAt(M);
    PieceKit.mark('태양–행성 선', () => {
      ctx.beginPath();
      ctx.moveTo(SUN.x, SUN.y);
      ctx.lineTo(planet.x, planet.y);
      ctx.strokeStyle = COLOR.line;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    });

    PieceKit.mark('태양', () => {
      ctx.beginPath();
      ctx.arc(SUN.x, SUN.y, 9, 0, 2 * Math.PI);
      ctx.fillStyle = COLOR.sun;
      ctx.fill();
    });

    PieceKit.mark('행성', () => {
      ctx.beginPath();
      ctx.arc(planet.x, planet.y, 5.5, 0, 2 * Math.PI);
      ctx.fillStyle = COLOR.planet;
      ctx.fill();
    });

    PieceKit.mark('넓이 막대', () => {
      for (let i = 0; i < N; i++) {
        const area = i === k ? nowArea : slots[i].area;
        const h = area / SLOT_AREA_IDEAL * BAR_FULL;
        const x = BAR_LEFT + i * BAR_PITCH + 3;
        ctx.fillStyle = i === k ? COLOR.now : (i % 2 === 0 ? COLOR.sectorA : COLOR.sectorB);
        ctx.fillRect(x, BAR_BASE - h, BAR_W, h);
      }
    });

    PieceKit.mark('같은 높이 기준선', () => {
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = COLOR.label;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(BAR_LEFT - 4, BAR_BASE - BAR_FULL + 0.5);
      ctx.lineTo(BAR_RIGHT + 4, BAR_BASE - BAR_FULL + 0.5);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(BAR_LEFT - 4, BAR_BASE + 0.5);
      ctx.lineTo(BAR_RIGHT + 4, BAR_BASE + 0.5);
      ctx.strokeStyle = COLOR.orbit;
      ctx.stroke();
    });

    PieceKit.mark('막대 이름', () => {
      ctx.fillStyle = COLOR.label;
      ctx.font = '13px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('1.5초마다 쓸고 간 넓이', (BAR_LEFT + BAR_RIGHT) / 2, BAR_BASE + 24);
    });

    const cap = captionFor(k);
    PieceKit.mark('캡션', () => {
      if (cap !== lastCaption) { captionEl.textContent = cap; lastCaption = cap; }
    });
  },
});
</script>
</body>
</html>
