<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>박막 간섭</title>
<style>
  html, body { margin: 0; background: #14161a; }
  .piece { max-width: 900px; min-width: 720px; margin: 0 auto; background: #14161a; }
  canvas { display: block; width: 100%; touch-action: none; }
  .caption { margin: 0; padding: 4px 24px 16px; color: #d6d9de; font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(() => {
  // ───── 물리 상수 ─────
  const N_FILM = 1.33;                       // 비눗물 굴절률
  const r = (N_FILM - 1) / (N_FILM + 1);     // 막 경계 한 번의 진폭 반사 계수 크기
  const R_MAX = 4 * r * r / Math.pow(1 + r * r, 2);
  const D_MAX = 1400;                        // 색표를 만들 두께 범위 (nm)

  // 공기–막–공기, 수직 입사. 위쪽 반사는 위상이 뒤집히고 아래쪽은 그대로다.
  function reflectance(dNm, lamNm) {
    const c = Math.cos(4 * Math.PI * N_FILM * dNm / lamNm);
    return 2 * r * r * (1 - c) / (1 + r * r * r * r - 2 * r * r * c);
  }

  // ───── 색맞춤 함수 (CIE 1931, Wyman 외 2013 근사) ─────
  const g = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
  const xbar = l => 1.056 * g(l, 599.8, 37.9, 31.0) + 0.362 * g(l, 442.0, 16.0, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2);
  const ybar = l => 0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1);
  const zbar = l => 1.217 * g(l, 437.0, 11.8, 36.0) + 0.681 * g(l, 459.0, 26.0, 13.8);
  const toLin = (X, Y, Z) => [
     3.2406 * X - 1.5372 * Y - 0.4986 * Z,
    -0.9689 * X + 1.8758 * Y + 0.0415 * Z,
     0.0557 * X - 0.2040 * Y + 1.0570 * Z,
  ];
  const gamma = v => { v = Math.max(0, Math.min(1, v)); return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; };

  const LAMS = [];
  for (let l = 380; l <= 780; l += 5) LAMS.push(l);
  const CMF = LAMS.map(l => [xbar(l), ybar(l), zbar(l)]);

  function spectrumToLin(fn) {
    let X = 0, Y = 0, Z = 0;
    for (let i = 0; i < LAMS.length; i++) {
      const s = fn(LAMS[i]);
      X += s * CMF[i][0]; Y += s * CMF[i][1]; Z += s * CMF[i][2];
    }
    return toLin(X, Y, Z);
  }
  const WHITE = spectrumToLin(() => 1);      // 모든 파장이 그대로 돌아올 때를 흰색으로 맞춘다
  const EXPOSURE = 0.8 / R_MAX;

  function linToRgb(lin, k) {
    return lin.map((v, i) => Math.round(255 * gamma(k * v / WHITE[i])));
  }

  // 두께 → 반사색 표 (1 nm 간격)
  const LUT = new Uint8ClampedArray((D_MAX + 1) * 3);
  for (let d = 0; d <= D_MAX; d++) {
    const rgb = linToRgb(spectrumToLin(l => reflectance(d, l)), EXPOSURE);
    LUT[d * 3] = rgb[0]; LUT[d * 3 + 1] = rgb[1]; LUT[d * 3 + 2] = rgb[2];
  }
  const lutAt = d => { const i = Math.max(0, Math.min(D_MAX, Math.round(d))) * 3; return [LUT[i], LUT[i + 1], LUT[i + 2]]; };

  // 파장 하나만의 색 (스펙트럼 채움용). 단색광은 sRGB 밖이라 구간 근사로 색상만 옮긴다.
  function monoColor(l) {
    let R = 0, G = 0, B = 0;
    if (l < 440) { R = -(l - 440) / 60; B = 1; }
    else if (l < 490) { G = (l - 440) / 50; B = 1; }
    else if (l < 510) { G = 1; B = -(l - 510) / 20; }
    else if (l < 580) { R = (l - 510) / 70; G = 1; }
    else if (l < 645) { R = 1; G = -(l - 645) / 65; }
    else { R = 1; }
    let f = 1;                                    // 가시광 양 끝은 눈에 어둡다
    if (l < 420) f = 0.3 + 0.7 * (l - 380) / 40;
    else if (l > 700) f = 0.3 + 0.7 * (780 - l) / 80;
    const c = v => Math.round(255 * Math.pow(Math.max(0, v * f), 0.8));
    return `rgb(${c(R)},${c(G)},${c(B)})`;
  }

  // ───── 흘러내리는 막 ─────
  // 중력 배수: 위가 먼저 얇아지고 같은 두께의 자리가 아래로 내려간다.
  const PERIOD = 13;       // 막 한 장이 사는 시간 (s)
  const OFFSET = 2;        // 도착했을 때 이미 흘러내리는 중이도록
  const T0 = 3, P_EXP = 0.8, C_H = 2885, BLACK_RATE = 0.012;
  const WIPE = 1;          // 새 막이 위에서부터 덮이는 시간 (s)

  function thicknessAt(x, y, age) {
    const yy = Math.max(0, Math.min(1, y + 0.014 * Math.sin(2 * Math.PI * 1.6 * x + 0.9 * age + 3 * y) * Math.sin(Math.PI * y)));
    const black = BLACK_RATE * age;   // 위에서부터 자라는 검은 막(거의 두께 0) 구간
    return C_H * Math.pow(Math.max(0, yy - black), P_EXP) / Math.pow(age + T0, P_EXP);
  }
  // 새 막 경계보다 위는 새 막, 아래는 아직 이전 막
  function filmAge(y, t) {
    const a = (t + OFFSET) % PERIOD;
    if (a < WIPE && y > a / WIPE) return a + PERIOD;
    return a;
  }
  const localThickness = (x, y, t) => thicknessAt(x, y, filmAge(y, t));

  // ───── 배치 ─────
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const captionEl = document.getElementById('caption');
  const W = Math.max(720, Math.min(900, canvas.parentElement.clientWidth || 860));
  const H = 290;
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.height = (H * (canvas.clientWidth || W) / W) + 'px';
  ctx.scale(dpr, dpr);

  const FILM = { x: 28, y: 22, w: 190, h: 246 };
  const THICK = { x0: 250, x1: 390, dMax: 1200 };
  const SPEC = { x0: 440, x1: W - 120, top: 44, bottom: 232, l0: 380, l1: 740 };
  const SWATCH = { x: W - 62, y: 138, r: 28 };

  const INK = '#a9adb5';
  const FAINT = 'rgba(169,173,181,0.35)';
  const ACCENT = '#ffffff';  // 강조색의 뜻은 하나: 「관찰점」

  const off = document.createElement('canvas');
  off.width = FILM.w; off.height = FILM.h;
  const offCtx = off.getContext('2d');
  const img = offCtx.createImageData(FILM.w, FILM.h);

  const PROBE_X = 0.5;
  let probeY = 0.6;
  let dragging = false;

  function setProbeFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const y = (e.clientY - rect.top) * (H / rect.height);
    probeY = Math.max(0.04, Math.min(0.97, (y - FILM.y) / FILM.h));
  }
  function inDragZone(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    return x >= FILM.x - 10 && x <= THICK.x1 + 20 && y >= FILM.y && y <= FILM.y + FILM.h;
  }
  canvas.addEventListener('pointerdown', e => {
    if (PieceKit.frozen || !inDragZone(e)) return;
    dragging = true; canvas.setPointerCapture(e.pointerId); setProbeFromEvent(e);
  });
  canvas.addEventListener('pointermove', e => {
    if (PieceKit.frozen) return;
    if (dragging) setProbeFromEvent(e);
    canvas.style.cursor = inDragZone(e) ? 'ns-resize' : 'default';
  });
  const endDrag = () => { dragging = false; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  const specX = l => SPEC.x0 + (l - SPEC.l0) / (SPEC.l1 - SPEC.l0) * (SPEC.x1 - SPEC.x0);
  const specY = v => SPEC.bottom - v * (SPEC.bottom - SPEC.top);
  const thickX = d => THICK.x0 + d / THICK.dMax * (THICK.x1 - THICK.x0);
  const filmYpx = y => FILM.y + y * FILM.h;

  const MONO = [];
  for (let l = SPEC.l0; l < SPEC.l1; l += 2) MONO.push([l, monoColor(l + 1)]);

  function drawFilm(t) {
    const data = img.data;
    for (let py = 0; py < FILM.h; py++) {
      const y = (py + 0.5) / FILM.h;
      const age = filmAge(y, t);
      for (let px = 0; px < FILM.w; px++) {
        const d = thicknessAt((px + 0.5) / FILM.w, y, age);
        const i = Math.max(0, Math.min(D_MAX, Math.round(d))) * 3;
        const o = (py * FILM.w + px) * 4;
        data[o] = LUT[i]; data[o + 1] = LUT[i + 1]; data[o + 2] = LUT[i + 2]; data[o + 3] = 255;
      }
    }
    offCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, FILM.x, FILM.y, FILM.w, FILM.h);
  }

  PieceKit.loop({
    step() {},
    draw(t) {
      const py = PieceKit.frozen ? 0.6 : probeY;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#14161a';
      ctx.fillRect(0, 0, W, H);

      PieceKit.mark('비누막', () => drawFilm(t));

      PieceKit.mark('철사 틀', () => {
        ctx.strokeStyle = '#6b7079';
        ctx.lineWidth = 3;
        ctx.strokeRect(FILM.x - 1.5, FILM.y - 1.5, FILM.w + 3, FILM.h + 3);
      });

      const a = (t + OFFSET) % PERIOD;
      if (a < WIPE) {
        PieceKit.mark('새 막 경계', () => {
          const yb = filmYpx(a / WIPE);
          ctx.strokeStyle = 'rgba(210,214,220,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(FILM.x, yb); ctx.lineTo(FILM.x + FILM.w, yb); ctx.stroke();
        });
      }

      PieceKit.mark('두께 단면', () => {
        ctx.fillStyle = 'rgba(169,173,181,0.16)';
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(THICK.x0, FILM.y);
        const steps = 120;
        for (let k = 0; k <= steps; k++) {
          const y = k / steps;
          ctx.lineTo(thickX(Math.min(THICK.dMax, localThickness(PROBE_X, y, t))), filmYpx(y));
        }
        ctx.lineTo(THICK.x0, FILM.y + FILM.h);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        for (let k = 0; k <= steps; k++) {
          const y = k / steps;
          const X = thickX(Math.min(THICK.dMax, localThickness(PROBE_X, y, t)));
          if (k === 0) ctx.moveTo(X, filmYpx(y)); else ctx.lineTo(X, filmYpx(y));
        }
        ctx.stroke();
        ctx.strokeStyle = FAINT; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(THICK.x0, FILM.y); ctx.lineTo(THICK.x0, FILM.y + FILM.h); ctx.stroke();
        ctx.fillStyle = INK;
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('0', THICK.x0 - 3, FILM.y + FILM.h + 16);
        ctx.textAlign = 'right';
        ctx.fillText('1000 nm', thickX(1000) + 18, FILM.y + FILM.h + 16);
        ctx.textAlign = 'center';
        ctx.fillText('막 두께', (THICK.x0 + THICK.x1) / 2, FILM.y - 8);
      });

      const dProbe = localThickness(PROBE_X, py, t);
      const probeLin = spectrumToLin(l => reflectance(dProbe, l));
      const probeRgb = linToRgb(probeLin, EXPOSURE);

      PieceKit.mark('되돌아오는 빛 스펙트럼', () => {
        const base = SPEC.bottom;
        for (const [l, col] of MONO) {
          const v = reflectance(dProbe, l + 1) / R_MAX;
          const x0 = specX(l), x1 = specX(l + 2);
          ctx.fillStyle = col;
          ctx.globalAlpha = 0.9;
          ctx.fillRect(x0, specY(v), x1 - x0 + 0.6, base - specY(v));
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#e4e6ea';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let l = SPEC.l0; l <= SPEC.l1; l += 1) {
          const X = specX(l), Y = specY(reflectance(dProbe, l) / R_MAX);
          if (l === SPEC.l0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
        ctx.stroke();
        ctx.strokeStyle = FAINT; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(SPEC.x0, base + 0.5); ctx.lineTo(SPEC.x1, base + 0.5); ctx.stroke();
        ctx.fillStyle = INK;
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        for (const l of [400, 500, 600, 700]) {
          ctx.fillText(String(l), specX(l), base + 16);
        }
        ctx.textAlign = 'right';
        ctx.fillText('파장 (nm)', SPEC.x1, base + 34);
        ctx.textAlign = 'left';
        ctx.fillText('관찰점에서 되돌아오는 빛', SPEC.x0, SPEC.top - 16);
      });

      PieceKit.mark('관찰점', () => {
        const yPx = filmYpx(py);
        const xPx = FILM.x + PROBE_X * FILM.w;
        const dx = thickX(Math.min(THICK.dMax, dProbe));
        ctx.strokeStyle = ACCENT;
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(xPx + 9, yPx); ctx.lineTo(dx, yPx); ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(xPx, yPx, 8, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = ACCENT;
        ctx.beginPath(); ctx.arc(dx, yPx, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${Math.round(dProbe)} nm`, Math.min(dx + 8, THICK.x1 + 4), yPx - 7);
      });

      PieceKit.mark('관찰점의 색', () => {
        ctx.fillStyle = `rgb(${probeRgb[0]},${probeRgb[1]},${probeRgb[2]})`;
        ctx.beginPath(); ctx.arc(SWATCH.x, SWATCH.y, SWATCH.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = ACCENT; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = INK;
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('보이는 색', SWATCH.x, SWATCH.y + SWATCH.r + 18);
      });

      PieceKit.mark('캡션', () => {
        const text = '두께가 바뀌는 자리마다 지워지는 파장이 옮겨 가고, 남은 빛이 그 자리의 색이 된다.';
        if (captionEl.textContent !== text) captionEl.textContent = text;
      });
    },
  });
})();
</script>
</body>
</html>
