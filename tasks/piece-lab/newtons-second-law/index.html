<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가속도 법칙</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  .piece { max-width: 880px; margin: 0 auto; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  canvas { display: block; width: 100%; height: auto; }
  .caption { margin: 6px 12px 10px; font-size: 15px; line-height: 1.5; color: #333; min-height: 1.5em; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="scene" width="880" height="270"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
// 같은 질량의 수레 셋을 1배·2배·3배 힘으로 민다.
// 1초마다 속도 막대에 "그 1초 동안 붙은 속도" 조각이 하나씩 쌓인다 — 조각 크기가 힘에 비례한다.

const W = 880, H = 270;
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const captionEl = document.getElementById('caption');

// 고해상도 화면 대응
const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
canvas.width = W * dpr;
canvas.height = H * dpr;

// 물리 설정 (질량 1, 가속도 = 힘)
const FORCES = [1, 2, 3];
const RUN = 4.0;          // 미는 시간 (초)
const HOLD = 1.4;         // 끝난 모습을 보여 주는 시간
const CYCLE = RUN + HOLD;
const OFFSET = 1.0;       // 도착한 순간 이미 1초째 진행 중

// 화면 배치
const LANE_TOP = 12;
const LANE_H = 84;
const TRACK_X0 = 124;     // 수레 뒤끝의 출발 위치
const PX_PER_M = 29;      // 위치 축척: 3배 수레가 4초에 24 단위 → 696px
const CART_W = 44, CART_H = 24;
const FORCE_PX = 18;      // 힘 1 단위당 화살표 길이
const BAR_X0 = TRACK_X0;
const PX_PER_V = 60;      // 속도 1 단위당 막대 길이

const COLOR = {
  track: '#c9c9c9',
  cart: '#3a4452',
  wheel: '#1f252d',
  ghost: 'rgba(58, 68, 82, 0.22)',
  force: '#e0782a',
  bar: '#4a86c5',
  barLight: '#a9c8e8',
  divider: '#ffffff',
  label: '#555555',
};

function phase(t) {
  const u = (t + OFFSET) % CYCLE;
  return u;
}

function laneY(i) { return LANE_TOP + i * LANE_H; }

function arrow(x1, y, x2, color, head) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2 - head, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y);
  ctx.lineTo(x2 - head, y - head * 0.6);
  ctx.lineTo(x2 - head, y + head * 0.6);
  ctx.closePath();
  ctx.fill();
}

function drawCart(x, yBase, fill, ghost) {
  const y = yBase - CART_H - 6;
  if (ghost) {
    ctx.strokeStyle = COLOR.ghost;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, CART_W - 1, CART_H - 1);
    return;
  }
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.roundRect(x, y, CART_W, CART_H, 4);
  ctx.fill();
  ctx.fillStyle = COLOR.wheel;
  ctx.beginPath();
  ctx.arc(x + 10, yBase - 4, 4, 0, Math.PI * 2);
  ctx.arc(x + CART_W - 10, yBase - 4, 4, 0, Math.PI * 2);
  ctx.fill();
}

function captionFor(u) {
  if (u < RUN) {
    return '같은 수레를 2배, 3배 힘으로 밀면 1초마다 붙는 속도(막대 한 칸)도 2배, 3배다.';
  }
  return '4초 동안 쌓인 칸은 셋 모두 넷 — 다른 것은 칸 하나의 크기뿐이다.';
}

let lastCaption = '';

PieceKit.loop({
  step(dt, t) {
    // 상태는 시각 t 에서 바로 계산한다 (쌓이는 상태 없음)
  },
  draw(t) {
    const u = phase(t);
    const tau = Math.min(u, RUN);          // 밀어 준 시간
    const pushing = u < RUN;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    PieceKit.mark('줄 이름', () => {
      ctx.fillStyle = COLOR.label;
      ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif';
      ctx.textBaseline = 'middle';
      FORCES.forEach((F, i) => {
        const y = laneY(i);
        ctx.fillText(`힘 ${F}배`, 8, y + 30);
        ctx.fillText('속도', 8, y + 62);
      });
    });

    PieceKit.mark('선로', () => {
      ctx.strokeStyle = COLOR.track;
      ctx.lineWidth = 2;
      FORCES.forEach((F, i) => {
        const yBase = laneY(i) + 44;
        ctx.beginPath();
        ctx.moveTo(TRACK_X0 - 4, yBase + 0.5);
        ctx.lineTo(W - 8, yBase + 0.5);
        ctx.stroke();
      });
    });

    PieceKit.mark('1초 간격 잔상', () => {
      FORCES.forEach((F, i) => {
        const yBase = laneY(i) + 44;
        for (let k = 0; k <= Math.floor(tau + 1e-9); k++) {
          const x = TRACK_X0 + 0.5 * F * k * k * PX_PER_M;
          drawCart(x, yBase, null, true);
        }
      });
    });

    PieceKit.mark('수레', () => {
      FORCES.forEach((F, i) => {
        const yBase = laneY(i) + 44;
        const x = TRACK_X0 + 0.5 * F * tau * tau * PX_PER_M;
        drawCart(x, yBase, COLOR.cart, false);
      });
    });

    PieceKit.mark('미는 힘', () => {
      if (!pushing) return;
      FORCES.forEach((F, i) => {
        const yBase = laneY(i) + 44;
        const x = TRACK_X0 + 0.5 * F * tau * tau * PX_PER_M;
        const yMid = yBase - 6 - CART_H / 2;
        arrow(x - 3 - F * FORCE_PX, yMid, x - 3, COLOR.force, 9);
      });
    });

    PieceKit.mark('속도 막대', () => {
      FORCES.forEach((F, i) => {
        const y = laneY(i) + 55;
        const h = 14;
        const v = F * tau;
        const full = Math.floor(tau + 1e-9);
        // 다 채워진 1초 칸
        ctx.fillStyle = COLOR.bar;
        ctx.fillRect(BAR_X0, y, Math.min(full, RUN) * F * PX_PER_V, h);
        // 지금 채워지는 칸
        if (tau > full) {
          ctx.fillStyle = COLOR.barLight;
          ctx.fillRect(BAR_X0 + full * F * PX_PER_V, y, (v - full * F) * PX_PER_V, h);
        }
        // 칸 경계
        ctx.fillStyle = COLOR.divider;
        for (let k = 1; k <= full; k++) {
          ctx.fillRect(BAR_X0 + k * F * PX_PER_V - 1, y, 2, h);
        }
      });
    });

    const c = captionFor(u);
    if (c !== lastCaption) {
      captionEl.textContent = c;
      lastCaption = c;
    }
  },
});
</script>
</body>
</html>
