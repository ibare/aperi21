<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연직 투상</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #2a2a2a; }
  .piece { max-width: 900px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 310px; }
  .caption { margin: 6px 16px 12px; font-size: 15px; line-height: 1.5; text-align: center; min-height: 1.5em; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="stage"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
// 연직 투상 — 내려오는 공은 올라갈 때 지난 높이를 같은 빠르기로, 방향만 거꾸로 지난다.
// 모든 화면 상태는 t 의 함수다. 프레임 사이에 쌓이는 상태는 없다.

const G = 9.8;            // 중력 가속도 [m/s^2]
const V0 = 14.7;          // 던지는 속력 [m/s] → 올라가는 시간 1.5 s
const T_TOP = V0 / G;     // 1.5 s
const T_FLIGHT = 2 * T_TOP; // 3.0 s
const H_MAX = V0 * V0 / (2 * G); // 11.025 m
const STROBE = 0.25;      // 도장 간격 [s]
const CYCLE = 4.8;        // 한 번 던지고 완성된 그림을 보여 주는 주기 [s]
const PHASE_OFFSET = 0.6; // 도착한 순간 이미 공이 올라가는 중
const SLIDE = 0.2;        // 도장이 옆 칸으로 밀려나는 시간 [s]
const MIRROR = 0.5;       // 거울 사본이 건너가며 뒤집히는 시간 [s]
const FADE_OUT = 0.4;     // 주기 끝에서 도장이 사라지는 시간 [s]

const INK = '#2a2a2a';
const BALL = '#2f6fb3';
const FAINT = 'rgba(42,42,42,0.18)';

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const captionEl = document.getElementById('caption');
const CAPTION = '내려오는 공은 올라갈 때 지난 높이마다 같은 빠르기로 지난다 — 방향만 거꾸로.';

let W = 0, Hpx = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  W = r.width; Hpx = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(Hpx * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// 좌표 변환
const GROUND_Y = () => Hpx - 52;
const PX_PER_M = () => (Hpx - 52 - 24) / H_MAX;
const ARROW_PX_PER_MS = 3; // 속도 화살표 길이 [px / (m/s)]
const COL_GAP = () => Math.min(110, W * 0.14);

function heightAt(s) { return V0 * s - 0.5 * G * s * s; }
function velocityAt(s) { return V0 - G * s; }
function yOf(h) { return GROUND_Y() - h * PX_PER_M(); }

// 한 주기 안의 위상
function phaseOf(t) {
  const p = (t + PHASE_OFFSET) % CYCLE;
  return p < 0 ? p + CYCLE : p;
}

function easeInOut(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }

// 속도 화살표 (v > 0 위, v < 0 아래)
function arrow(x, y, v, color, alpha) {
  const len = v * ARROW_PX_PER_MS;
  if (Math.abs(len) < 2) return;
  const dir = Math.sign(len);
  const tipY = y - len;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, tipY + dir * 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, tipY);
  ctx.lineTo(x - 5, tipY + dir * 8);
  ctx.lineTo(x + 5, tipY + dir * 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function stampDisc(x, y, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = BALL;
  ctx.globalAlpha = alpha * 0.35;
  ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = BALL; ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

// 도장 목록: 섬광 시각 k*STROBE (0 ≤ s ≤ T_FLIGHT)
const STAMP_TIMES = [];
for (let k = 0; k * STROBE <= T_FLIGHT + 1e-9; k++) STAMP_TIMES.push(k * STROBE);

PieceKit.loop({
  step(dt, t) { /* 모든 상태가 t 의 함수라 전진할 것이 없다 */ },
  draw(t) {
    ctx.clearRect(0, 0, W, Hpx);
    const p = phaseOf(t);
    const cx = W / 2;
    const gap = COL_GAP();
    const fade = p > CYCLE - FADE_OUT ? (CYCLE - p) / FADE_OUT : 1;

    PieceKit.mark('땅', () => {
      ctx.save();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - gap - 40, GROUND_Y() + 9);
      ctx.lineTo(cx + gap + 40, GROUND_Y() + 9);
      ctx.stroke();
      ctx.restore();
    });

    // 짝을 잇는 가는 수평선 — 거울 사본이 포개진 뒤에만
    PieceKit.mark('같은 높이 잇는 선', () => {
      for (const s of STAMP_TIMES) {
        if (s <= T_TOP + 1e-9) continue;
        const done = p - (s + SLIDE + MIRROR);
        if (done < 0) continue;
        const y = yOf(heightAt(s));
        ctx.save();
        ctx.globalAlpha = fade * Math.min(1, done / 0.2);
        ctx.strokeStyle = FAINT; ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        ctx.moveTo(cx - gap + 12, y); ctx.lineTo(cx + gap - 12, y);
        ctx.stroke();
        ctx.restore();
      }
    });

    // 섬광 도장: 올라갈 때는 왼쪽, 내려올 때는 오른쪽 칸으로 밀려난다
    PieceKit.mark('올라갈 때 도장', () => {
      for (const s of STAMP_TIMES) {
        if (s >= T_TOP - 1e-9 || p < s) continue;
        const u = easeInOut((p - s) / SLIDE);
        const x = cx - gap * u;
        const y = yOf(heightAt(s));
        stampDisc(x, y, fade);
        arrow(x, y, velocityAt(s), INK, fade);
      }
    });

    PieceKit.mark('꼭대기 도장', () => {
      if (p < T_TOP) return;
      stampDisc(cx, yOf(H_MAX), fade);
    });

    PieceKit.mark('내려올 때 도장', () => {
      for (const s of STAMP_TIMES) {
        if (s <= T_TOP + 1e-9 || p < s) continue;
        const u = easeInOut((p - s) / SLIDE);
        const x = cx + gap * u;
        const y = yOf(heightAt(s));
        stampDisc(x, y, fade);
        arrow(x, y, velocityAt(s), INK, fade);
      }
    });

    // 거울 사본: 올라갈 때 도장의 화살표가 뒤집히며 건너가 내려올 때 도장에 포개진다
    PieceKit.mark('거울 사본', () => {
      for (const s of STAMP_TIMES) {
        if (s <= T_TOP + 1e-9) continue;
        const a = p - (s + SLIDE);
        if (a < 0 || a > MIRROR) continue;
        const u = easeInOut(a / MIRROR);
        const twin = T_FLIGHT - s; // 같은 높이의 올라갈 때 섬광 시각
        const x = (cx - gap) + 2 * gap * u;
        const y = yOf(heightAt(twin));
        const vUp = velocityAt(twin);
        const flipped = vUp * Math.cos(Math.PI * u); // +v → -v
        const alpha = fade * (u < 0.85 ? 0.55 : 0.55 * (1 - (u - 0.85) / 0.15));
        stampDisc(x, y, alpha);
        arrow(x, y, flipped, INK, alpha);
      }
    });

    // 공 — 가운데 칸에서 곧게 오르내린다
    PieceKit.mark('공', () => {
      const s = Math.min(p, T_FLIGHT);
      const y = yOf(Math.max(0, heightAt(s)));
      ctx.save();
      ctx.fillStyle = BALL;
      ctx.beginPath(); ctx.arc(cx, y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    PieceKit.mark('공의 속도 화살표', () => {
      if (p >= T_FLIGHT) return;
      const y = yOf(heightAt(p));
      arrow(cx, y, velocityAt(p), INK, 1);
    });

    PieceKit.mark('캡션', () => {
      if (captionEl.textContent !== CAPTION) captionEl.textContent = CAPTION;
    });
  },
});
</script>
</body>
</html>
