<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가속도-시간 그래프</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #222; }
  .piece { max-width: 860px; margin: 0 auto; padding: 8px 0; }
  canvas { display: block; width: 100%; height: auto; }
  .caption { min-height: 1.6em; margin: 6px 12px 0; font-size: 15px; line-height: 1.6; color: #333; text-align: center; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="scene" width="860" height="300"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(() => {
  // ── 화면 좌표 (논리 크기 860 × 300) ──
  const W = 860, H = 300;
  const canvas = document.getElementById('scene');
  const captionEl = document.getElementById('caption');
  const ratio = window.devicePixelRatio || 1;
  canvas.width = W * ratio;
  canvas.height = H * ratio;
  const ctx = canvas.getContext('2d');

  const GRAPH_X0 = 60;        // 시간 0 의 x
  const PX_PER_S = 80;        // 1 초의 폭
  const AXIS_Y = 150;         // 가속도 0 의 y
  const PX_PER_A = 40;        // 1 m/s² 의 높이
  const BAR_X = 700;          // 속도 변화 막대 왼쪽
  const BAR_W = PX_PER_S * 1; // 1초 칸의 폭과 같다 → 칸이 모양 그대로 얹힌다
  const BAR_BASE = 280;       // 속도 변화 0 의 y
  const PX_PER_V = PX_PER_A * 1; // 칸 폭이 같으므로 1 m/s = 1 m/s²·1 s 의 높이

  // ── 물리: 1초 칸마다 일정한 가속도 (m/s²) ──
  const ACCEL = [2, 2, 1, 1, 0, -1.5, -1.5];
  const DURATION = ACCEL.length;          // 7 초
  const FLIGHT = 0.9;                      // 칸이 막대까지 옮겨지는 시간
  const ERASE = 0.5;                       // 축 아래 칸이 막대를 깎는 시간
  const CYCLE = 11;                        // 한 바퀴
  const START_OFFSET = 1.6;                // 도착한 순간 첫 칸이 이미 옮겨지는 중

  // 각 칸이 얹히기 직전까지 쌓인 속도 변화
  const vBefore = [];
  { let v = 0; for (const a of ACCEL) { vBefore.push(v); v += a * 1; } }
  const vFinal = vBefore[DURATION - 1] + ACCEL[DURATION - 1];

  const FILL = 'rgba(52, 116, 204, 0.55)';
  const FILL_EDGE = 'rgba(52, 116, 204, 0.95)';
  const INK = '#333';
  const FAINT = '#9aa3ad';

  const ease = (p) => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const fmt = (v) => String(Math.round(v * 10) / 10).replace('-', '−');

  // 칸 k 의 그래프 위 사각형
  function slabInGraph(k) {
    const a = ACCEL[k];
    const x = GRAPH_X0 + PX_PER_S * k;
    const h = Math.abs(a) * PX_PER_A;
    const y = a >= 0 ? AXIS_Y - h : AXIS_Y;
    return { x, y, w: PX_PER_S, h };
  }
  // 칸 k 가 막대에 닿는 자리
  function slabOnBar(k) {
    const a = ACCEL[k];
    const h = Math.abs(a) * PX_PER_V;
    const topOfStack = BAR_BASE - vBefore[k] * PX_PER_V;
    // 양의 칸은 쌓인 꼭대기 위에, 음의 칸은 꼭대기에서 아래로 겹친다
    const y = a >= 0 ? topOfStack - h : topOfStack;
    return { x: BAR_X, y, w: BAR_W, h };
  }

  function roundRectPath(r) {
    ctx.beginPath();
    ctx.rect(r.x, r.y, r.w, r.h);
  }

  function draw(t) {
    const tau = ((t + START_OFFSET) % CYCLE + CYCLE) % CYCLE;
    const fadeOut = 1 - clamp01((tau - 10.4) / 0.6);

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '13px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif';

    // ── 시간 축 ──
    PieceKit.mark('시간 축', () => {
      ctx.strokeStyle = FAINT;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(GRAPH_X0, AXIS_Y + 0.5);
      ctx.lineTo(GRAPH_X0 + PX_PER_S * DURATION + 14, AXIS_Y + 0.5);
      ctx.stroke();
      ctx.fillStyle = FAINT;
      ctx.textAlign = 'center';
      for (let s = 0; s <= DURATION; s++) {
        const x = GRAPH_X0 + PX_PER_S * s + 0.5;
        ctx.beginPath();
        ctx.moveTo(x, AXIS_Y - 3);
        ctx.lineTo(x, AXIS_Y + 3);
        ctx.stroke();
      }
      ctx.textAlign = 'left';
      ctx.fillText('시간', GRAPH_X0 + PX_PER_S * DURATION + 18, AXIS_Y + 4);
      ctx.fillText('가속도', 8, 30);
      // 한 칸의 폭이 1 초라는 것만 알린다
      ctx.textAlign = 'center';
      ctx.fillText('1 s', GRAPH_X0 + PX_PER_S * 0.5, AXIS_Y + 72 + 18);
      ctx.beginPath();
      ctx.moveTo(GRAPH_X0 + 0.5, AXIS_Y + 78);
      ctx.lineTo(GRAPH_X0 + PX_PER_S - 0.5, AXIS_Y + 78);
      ctx.stroke();
    });

    // ── 채워지는 넓이 (지금 훑고 있는 칸) ──
    PieceKit.mark('채워지는 넓이', () => {
      ctx.globalAlpha = fadeOut;
      for (let k = 0; k < DURATION; k++) {
        if (ACCEL[k] === 0) continue;
        const p = clamp01(tau - k);
        if (p <= 0 || tau >= k + 1) continue;
        const r = slabInGraph(k);
        ctx.fillStyle = FILL;
        ctx.fillRect(r.x, r.y, r.w * p, r.h);
      }
      ctx.globalAlpha = 1;
    });

    // ── 떠난 넓이 자리 (옮겨 간 칸의 빈 윤곽) ──
    PieceKit.mark('떠난 넓이 자리', () => {
      ctx.globalAlpha = fadeOut;
      ctx.strokeStyle = FILL_EDGE;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      for (let k = 0; k < DURATION; k++) {
        if (ACCEL[k] === 0 || tau < k + 1) continue;
        const r = slabInGraph(k);
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      }
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    });

    // ── 가속도 선 ──
    PieceKit.mark('가속도 선', () => {
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let k = 0; k < DURATION; k++) {
        const y = AXIS_Y - ACCEL[k] * PX_PER_A;
        const x0 = GRAPH_X0 + PX_PER_S * k, x1 = x0 + PX_PER_S;
        if (k === 0) ctx.moveTo(x0, y); else ctx.lineTo(x0, y);
        ctx.lineTo(x1, y);
      }
      ctx.stroke();
      // 구간마다 가속도 값
      ctx.fillStyle = INK;
      ctx.textAlign = 'center';
      const segs = [[0, 2], [2, 4], [4, 5], [5, 7]];
      for (const [s0, s1] of segs) {
        const a = ACCEL[s0];
        const x = GRAPH_X0 + PX_PER_S * (s0 + s1) / 2;
        const y = a >= 0 ? AXIS_Y - a * PX_PER_A - 8 : AXIS_Y - a * PX_PER_A + 18;
        ctx.fillText(fmt(a) + ' m/s²', x, y);
      }
    });

    // ── 지금 시각 선 ──
    PieceKit.mark('지금 시각 선', () => {
      if (tau > DURATION) return;
      const x = GRAPH_X0 + PX_PER_S * tau;
      ctx.strokeStyle = FAINT;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, AXIS_Y - 100);
      ctx.lineTo(x + 0.5, AXIS_Y + 80);
      ctx.stroke();
    });

    // ── 속도 변화 막대 (얹힌 칸이 쌓인 기둥) ──
    let barTop = 0; // 지금 막대 높이 (m/s)
    PieceKit.mark('속도 변화 막대', () => {
      ctx.globalAlpha = fadeOut;
      // 바닥선
      ctx.strokeStyle = FAINT;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(BAR_X - 16, BAR_BASE + 0.5);
      ctx.lineTo(BAR_X + BAR_W + 16, BAR_BASE + 0.5);
      ctx.stroke();
      ctx.fillStyle = FAINT;
      ctx.textAlign = 'center';
      ctx.fillText('속도 변화', BAR_X + BAR_W / 2, BAR_BASE + 16);

      // 내려앉은 양의 칸들
      for (let k = 0; k < DURATION; k++) {
        if (ACCEL[k] <= 0) continue;
        if (tau < k + 1 + FLIGHT) continue;
        const r = slabOnBar(k);
        ctx.fillStyle = FILL;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = FILL_EDGE;
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      }
      // 지금까지 확정된 높이
      barTop = 0;
      for (let k = 0; k < DURATION; k++) {
        const a = ACCEL[k];
        if (a > 0 && tau >= k + 1 + FLIGHT) barTop = vBefore[k] + a;
        if (a < 0) {
          const e = clamp01((tau - (k + 1 + FLIGHT)) / ERASE);
          if (tau >= k + 1 + FLIGHT) barTop = vBefore[k] + a * ease(e);
        }
      }
      // 깎여 나간 윗부분을 지운다
      const peak = Math.max(...vBefore.map((v, k) => v + Math.max(0, ACCEL[k])));
      const cutTopY = BAR_BASE - peak * PX_PER_V - 2;
      const cutBottomY = BAR_BASE - barTop * PX_PER_V;
      if (cutBottomY > cutTopY) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(BAR_X - 1, cutTopY, BAR_W + 2, cutBottomY - cutTopY);
        // 남은 꼭대기 테두리
        ctx.strokeStyle = FILL_EDGE;
        ctx.beginPath();
        ctx.moveTo(BAR_X, cutBottomY + 0.5);
        ctx.lineTo(BAR_X + BAR_W, cutBottomY + 0.5);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });

    // ── 깎이는 넓이 (축 아래 칸이 막대 꼭대기에 겹쳐 함께 사라진다) ──
    PieceKit.mark('깎이는 넓이', () => {
      for (let k = 0; k < DURATION; k++) {
        const a = ACCEL[k];
        if (a >= 0) continue;
        const start = k + 1 + FLIGHT;
        if (tau < start || tau >= start + ERASE) continue;
        const e = ease(clamp01((tau - start) / ERASE));
        const r = slabOnBar(k);
        const remainH = r.h * (1 - e);
        const y = r.y + r.h - remainH;
        ctx.fillStyle = FILL;
        ctx.fillRect(r.x, y, r.w, remainH);
        ctx.save();
        ctx.beginPath();
        ctx.rect(r.x, y, r.w, remainH);
        ctx.clip();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 2;
        for (let d = -r.h; d < r.w + r.h; d += 9) {
          ctx.beginPath();
          ctx.moveTo(r.x + d, r.y + r.h);
          ctx.lineTo(r.x + d + r.h, r.y);
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = FILL_EDGE;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(r.x + 0.5, y + 0.5, r.w - 1, Math.max(0, remainH - 1));
        ctx.setLineDash([]);
      }
    });

    // ── 옮겨지는 넓이 칸 ──
    PieceKit.mark('옮겨지는 넓이 칸', () => {
      for (let k = 0; k < DURATION; k++) {
        const a = ACCEL[k];
        if (a === 0) continue;
        const start = k + 1;
        if (tau < start || tau >= start + FLIGHT) continue;
        const p = ease(clamp01((tau - start) / FLIGHT));
        const from = slabInGraph(k), to = slabOnBar(k);
        // 그래프 위 빈 곳으로 들어 올렸다가 막대에 내려놓는 이차 곡선
        const apex = Math.max(4, Math.min(from.y, to.y) - 60);
        const ctrl = 2 * apex - (from.y + to.y) / 2;
        const r = {
          x: from.x + (to.x - from.x) * p,
          y: (1 - p) * (1 - p) * from.y + 2 * p * (1 - p) * ctrl + p * p * to.y,
          w: from.w, h: from.h,
        };
        ctx.fillStyle = FILL;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = FILL_EDGE;
        ctx.lineWidth = 1;
        if (a < 0) ctx.setLineDash([4, 3]);
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
        ctx.setLineDash([]);
        ctx.fillStyle = INK;
        ctx.textAlign = 'center';
        ctx.fillText((a > 0 ? '+' : '') + fmt(a) + ' m/s', r.x + r.w / 2, r.y + r.h / 2 + 5);
      }
    });

    // ── 속도 변화 값 (내려앉기가 끝난 합만 적는다) ──
    PieceKit.mark('속도 변화 값', () => {
      let settled = 0;
      for (let k = 0; k < DURATION; k++) {
        const a = ACCEL[k];
        const done = k + 1 + FLIGHT + (a < 0 ? ERASE : 0);
        if (a === 0 ? tau >= k + 1 : tau >= done) settled = vBefore[k] + a;
      }
      ctx.globalAlpha = fadeOut;
      ctx.fillStyle = INK;
      ctx.textAlign = 'left';
      ctx.font = '15px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif';
      const y = Math.min(BAR_BASE - 6, BAR_BASE - barTop * PX_PER_V + 5);
      ctx.fillText(fmt(settled) + ' m/s', BAR_X + BAR_W + 10, y);
      ctx.globalAlpha = 1;
    });

    // ── 캡션 (지금 벌어지는 일 하나) ──
    PieceKit.mark('캡션', () => {
      let text;
      const flying = (k) => tau >= k + 1 && tau < k + 1 + FLIGHT + (ACCEL[k] < 0 ? ERASE : 0);
      let active = -1;
      for (let k = 0; k < DURATION; k++) if (ACCEL[k] !== 0 && flying(k)) active = k;
      if (active >= 0 && ACCEL[active] < 0) text = '축 아래 넓이는 쌓인 속도 변화를 깎아 낸다';
      else if (active >= 0) text = '1초 동안의 넓이가 모양 그대로 속도 변화에 얹힌다';
      else if (tau >= 4 && tau < 5.2) text = '가속도가 0인 동안은 얹을 넓이가 없다';
      else if (tau >= DURATION) text = '넓이를 모두 얹고 깎은 높이 ' + fmt(vFinal) + ' m/s 가 속도 변화다';
      else text = '가속도 아래 넓이가 1초씩 채워진다';
      if (captionEl.textContent !== text) captionEl.textContent = text;
    });
  }

  PieceKit.loop({
    step() { /* 모든 움직임이 t 의 함수라 쌓을 상태가 없다 */ },
    draw,
  });
})();
</script>
</body>
</html>
