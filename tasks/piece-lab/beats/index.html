<meta charset="utf-8">
<title>맥놀이</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #faf8f4;
    font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #2b2823;
  }
  .piece { max-width: 860px; margin: 0 auto; padding: 8px 0 14px; }
  canvas { display: block; width: 100%; height: auto; }
  .ctl {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px 0;
  }
  .ctl label { color: #6f6a61; white-space: nowrap; }
  .ctl input {
    flex: 1 1 auto; min-width: 120px; max-width: 420px;
    accent-color: #c2472f; height: 18px;
  }
  .ctl output {
    font-variant-numeric: tabular-nums;
    color: #2b2823; min-width: 74px;
  }
</style>

<div class="piece">
  <canvas id="scene"></canvas>
  <div class="ctl">
    <label for="df">두 음의 진동수 차이</label>
    <input id="df" type="range" min="0" max="1" step="0.05" value="0.45">
    <output id="dfv" for="df">0.45 Hz</output>
  </div>
</div>

<script src="../_harness/piece-kit.js"></script>
<script>
(function () {
  'use strict';
  var K = window.PieceKit;

  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');

  // ---- 판 ----
  var CW = 860, CH = 400;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(CW * dpr);
  cv.height = Math.round(CH * dpr);

  var BG   = '#faf8f4';
  var INK  = '#2b2823';
  var SOFT = '#9c968c';   // 두 음 — 둘은 같은 대상이라 같은 색
  var FILL = '#eae4d9';   // 두 음이 벌어진 자리
  var FAINT= '#ded7ca';
  var NODE = '#c4bcae';
  var HOT  = '#c2472f';   // 강조색 — 오직 "실제로 들리는 소리"
  var MUTE = '#8b857a';

  var X0 = 20, X1 = 828, PW = X1 - X0;
  var YA = 84,  AMP  = 46;          // 위 트랙 — 두 음
  var YB = 246, AMP2 = AMP * 2;     // 아래 트랙 — 합친 소리

  var WIN = 4.5;      // 화면이 담는 시간(초)
  var F1  = 3.0;      // 기준 음의 진동수(Hz)
  var DF0 = 0.45;     // 두 음의 차이 기본값(Hz)
  var TAU = Math.PI * 2;
  var N   = Math.round(WIN / K.DT);
  var SPEED = PW / WIN;             // 잔상이 왼쪽으로 흐르는 속도(px/s)

  // ---- 상태 ----
  var df = DF0;
  var p1 = 0, p2 = 0;   // 각 음의 위상(누적)
  var D  = 0;           // 두 음의 위상차(누적) — 차이를 바꿔도 이어진다
  var nodeIdx = 0;
  var hist = [];        // 최근 WIN 초의 {a, b}
  var nodes = [];       // 합이 지워진 순간들의 시각

  // 도착한 순간 이미 진행 중이도록, 지난 WIN 초를 거슬러 채워 둔다
  (function fillPast() {
    for (var i = -N; i < 0; i++) {
      var tt = i * K.DT;
      hist.push({ a: Math.sin(TAU * F1 * tt), b: Math.sin(TAU * (F1 + df) * tt) });
    }
    if (df > 0) {
      for (var k = -1; k > -400; k--) {
        var tm = (2 * k + 1) / (2 * df);
        if (tm < -WIN) break;
        nodes.unshift(tm);
      }
    }
  })();

  // ---- 조작기 ----
  var rng = document.getElementById('df');
  var out = document.getElementById('dfv');
  function sync() {
    df = parseFloat(rng.value);
    out.textContent = df.toFixed(2) + ' Hz';
  }
  rng.value = String(DF0);
  sync();
  if (K.frozen) rng.disabled = true;
  else rng.addEventListener('input', sync);

  // ---- 시간 ----
  function step(dt, t) {
    var now = t + dt;
    p1 = (p1 + TAU * F1 * dt) % TAU;
    p2 = (p2 + TAU * (F1 + df) * dt) % TAU;
    D += TAU * df * dt;

    hist.push({ a: Math.sin(p1), b: Math.sin(p2) });
    if (hist.length > N) hist.shift();

    var idx = Math.floor((D - Math.PI) / TAU) + 1;
    if (idx > nodeIdx) { nodes.push(now); nodeIdx = idx; }
    while (nodes.length && nodes[0] < now - WIN) nodes.shift();
  }

  // ---- 그리기 ----
  function xAt(j) { return X0 + (j * PW) / (N - 1); }

  function poly(pick, y0, amp, color, w) {
    ctx.beginPath();
    for (var j = 0; j < hist.length; j++) {
      var y = y0 - amp * pick(hist[j]);
      if (j === 0) ctx.moveTo(xAt(j), y); else ctx.lineTo(xAt(j), y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.stroke();
  }

  function caption() {
    if (df <= 0.0001) return '두 음이 한 치도 어긋나지 않는다 — 합친 소리가 줄곧 크다';
    var half = ((D / 2) % Math.PI + Math.PI) % Math.PI;
    var c = Math.abs(Math.cos(half));
    if (c > 0.86) return '두 음이 발맞춰 흔들린다 — 합친 소리가 가장 크다';
    if (c < 0.18) return '두 음이 정반대로 엇갈렸다 — 합친 소리가 사라진다';
    if (half < Math.PI / 2) return '두 음이 어긋나는 중 — 합친 소리가 잦아든다';
    return '두 음이 다시 발맞추는 중 — 합친 소리가 되살아난다';
  }

  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    K.mark('바탕', function () {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, CW, CH);
    });

    K.mark('흔들림의 기준선', function () {
      ctx.strokeStyle = FAINT;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(X0, YA + 0.5); ctx.lineTo(X1, YA + 0.5);
      ctx.moveTo(X0, YB + 0.5); ctx.lineTo(X1, YB + 0.5);
      ctx.stroke();
    });

    K.mark('울렁임의 마디', function () {
      ctx.strokeStyle = NODE;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 5]);
      ctx.beginPath();
      for (var i = 0; i < nodes.length; i++) {
        var x = X1 - (t - nodes[i]) * SPEED;
        if (x < X0 || x > X1) continue;
        ctx.moveTo(x + 0.5, 30); ctx.lineTo(x + 0.5, 344);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    });

    K.mark('두 음이 벌어진 자리', function () {
      ctx.fillStyle = FILL;
      for (var j = 0; j < hist.length; j++) {
        var ya = YA - AMP * hist[j].a;
        var yb = YA - AMP * hist[j].b;
        var top = Math.min(ya, yb);
        ctx.fillRect(xAt(j) - 1.6, top, 3.2, Math.abs(ya - yb));
      }
    });

    K.mark('두 음의 파형', function () {
      poly(function (s) { return s.a; }, YA, AMP, SOFT, 1.3);
      poly(function (s) { return s.b; }, YA, AMP, SOFT, 1.3);
    });

    K.mark('합친 소리의 파형', function () {
      poly(function (s) { return s.a + s.b; }, YB, AMP, HOT, 2.1);
    });

    K.mark('울렁임 한 칸', function () {
      if (nodes.length < 2) return;
      var xa = X1 - (t - nodes[nodes.length - 2]) * SPEED;
      var xb = X1 - (t - nodes[nodes.length - 1]) * SPEED;
      if (xa < X0 || xb > X1) return;
      var y = 356;
      ctx.strokeStyle = NODE;
      ctx.lineWidth = 1;
      ctx.font = '11px system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif';
      var label = '울렁임 한 번';
      var w = ctx.measureText(label).width;
      var gap = (xb - xa > w + 44) ? w + 16 : 0;
      var mid = (xa + xb) / 2;
      ctx.beginPath();
      if (gap) {
        ctx.moveTo(xa, y); ctx.lineTo(mid - gap / 2, y);
        ctx.moveTo(mid + gap / 2, y); ctx.lineTo(xb, y);
      } else {
        ctx.moveTo(xa, y); ctx.lineTo(xb, y);
      }
      ctx.moveTo(xa + 0.5, y - 4); ctx.lineTo(xa + 0.5, y + 4);
      ctx.moveTo(xb + 0.5, y - 4); ctx.lineTo(xb + 0.5, y + 4);
      ctx.stroke();
      if (gap) {
        ctx.fillStyle = MUTE;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, mid, y + 1);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }
    });

    var cur = hist[hist.length - 1];

    K.mark('지금 흔들리는 두 음', function () {
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = BG;
      ctx.fillStyle = SOFT;
      [cur.a, cur.b].forEach(function (v) {
        ctx.beginPath();
        ctx.arc(X1, YA - AMP * v, 5.5, 0, TAU);
        ctx.fill();
        ctx.stroke();
      });
    });

    K.mark('지금 들리는 소리', function () {
      ctx.beginPath();
      ctx.arc(X1, YB - AMP * (cur.a + cur.b), 7.5, 0, TAU);
      ctx.fillStyle = HOT;
      ctx.fill();
      ctx.strokeStyle = BG;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    });

    K.mark('캡션', function () {
      ctx.fillStyle = INK;
      ctx.font = '15px system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
      ctx.fillText(caption(), X0, 386);
    });
  }

  K.loop({ step: step, draw: draw });
})();
</script>
