<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하위헌스 원리</title>
<style>
  html, body { margin: 0; background: #f6f5f1; }
  .piece { max-width: 900px; margin: 0 auto; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
  .caption { margin: 10px 4px 0; font-size: 15px; line-height: 1.5; color: #2b2f36; min-height: 1.5em; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="scene" width="840" height="320"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(() => {
  // ── 장면 치수 (논리 픽셀) ──
  const W = 840, H = 320;
  const X0 = 230;              // 점파원이 놓인 파면 자리
  const LAMBDA = 36;           // 파장
  const C = 90;                // 파의 속력
  const K = 2 * Math.PI / LAMBDA;
  const OMEGA = K * C;
  const CELL = 3;              // 장을 계산하는 격자 한 칸
  const SEG_MAX = 32;          // 가장 촘촘할 때 구간 수 → 점 33개
  const D_MIN = H / SEG_MAX;
  const A = D_MIN / LAMBDA;    // 점파원 하나의 세기 — 촘촘해졌을 때 들어오는 파와 같은 세기가 되도록

  // ── 한 주기의 순서: 점 수가 늘어나는 시각 ──
  const STAGES = [
    { n: 1,  at: 0 },
    { n: 3,  at: 8 },
    { n: 5,  at: 11 },
    { n: 9,  at: 14 },
    { n: 17, at: 17 },
    { n: 33, at: 21 },
  ];
  const PERIOD = 29;
  const FAR = Math.hypot(W - X0, H); // 가장 먼 화면 지점까지 거리

  // 점 i 가 처음 등장하는 단계: 가운데 하나 → 양 끝 → 그 사이를 반씩 채운다
  function levelOf(i) {
    if (i === SEG_MAX / 2) return 0;
    let level = 1, step = SEG_MAX / 2;
    while (i % step !== 0) { step /= 2; level++; }
    return level;
  }
  const sources = [];
  for (let i = 0; i <= SEG_MAX; i++) {
    const stage = STAGES[levelOf(i)];
    sources.push({ y: i * D_MIN, bornAt: stage.at, always: stage === STAGES[0] });
  }

  const cycleOf = t => Math.floor(t / PERIOD);
  const phaseOf = t => t - cycleOf(t) * PERIOD;

  function currentStage(u) {
    let cur = STAGES[0];
    for (const s of STAGES) if (u >= s.at) cur = s;
    return cur;
  }

  // 한 점파원이 파를 내는 시간 구간들 [태어남, 멈춤] — 지난 주기의 꼬리까지 포함
  function windows(src, t) {
    if (src.always) return [[-Infinity, Infinity]];
    const k = cycleOf(t);
    const out = [];
    for (const kk of [k - 1, k]) {
      if (kk < 0) continue;
      out.push([kk * PERIOD + src.bornAt, (kk + 1) * PERIOD]);
    }
    return out;
  }

  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

  // ── 격자 캔버스 ──
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const captionEl = document.getElementById('caption');

  const leftCols = Math.ceil(X0 / CELL), rows = Math.ceil(H / CELL);
  const rightCols = Math.ceil((W - X0) / CELL);
  const leftBuf = document.createElement('canvas'); leftBuf.width = leftCols; leftBuf.height = rows;
  const rightBuf = document.createElement('canvas'); rightBuf.width = rightCols; rightBuf.height = rows;
  const leftImg = leftBuf.getContext('2d').createImageData(leftCols, rows);
  const rightImg = rightBuf.getContext('2d').createImageData(rightCols, rows);

  // 변위 → 색: 골(짙은 남색) ─ 0(회청) ─ 마루(밝은 색). 한 대상(물결의 변위)에 한 색 띠
  const TROUGH = [28, 40, 58], MID = [104, 120, 138], CREST = [236, 240, 244];
  function shade(v, data, idx) {
    // 약한 점파도 보이도록 제곱근으로 누르되 부호는 유지
    let s = Math.sign(v) * Math.sqrt(Math.min(1.2, Math.abs(v)) / 1.2);
    const a = MID, b = s >= 0 ? CREST : TROUGH, m = Math.abs(s);
    data[idx]   = a[0] + (b[0] - a[0]) * m;
    data[idx+1] = a[1] + (b[1] - a[1]) * m;
    data[idx+2] = a[2] + (b[2] - a[2]) * m;
    data[idx+3] = 255;
  }

  function drawIncident(t) {
    const d = leftImg.data;
    for (let cx = 0; cx < leftCols; cx++) {
      const x = (cx + 0.5) * CELL;
      const v = Math.cos(K * (x - X0) - OMEGA * t);
      for (let cy = 0; cy < rows; cy++) shade(v, d, (cy * leftCols + cx) * 4);
    }
    leftBuf.getContext('2d').putImageData(leftImg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(leftBuf, 0, 0, leftCols, rows, 0, 0, leftCols * CELL, rows * CELL);
  }

  function drawWavelets(t) {
    const active = [];
    for (const s of sources) {
      const ws = windows(s, t).filter(([b, e]) => b <= t && C * (t - e) < FAR + LAMBDA);
      if (ws.length) active.push({ y: s.y, ws });
    }
    const d = rightImg.data;
    const soft = LAMBDA * 0.5;
    for (let cy = 0; cy < rows; cy++) {
      const y = (cy + 0.5) * CELL;
      for (let cx = 0; cx < rightCols; cx++) {
        const dx = (cx + 0.5) * CELL;
        let v = 0;
        for (const s of active) {
          const dy = y - s.y;
          const r = Math.sqrt(dx * dx + dy * dy);
          let w = 0;
          for (const [b, e] of s.ws) {
            const front = b === -Infinity ? 1 : smooth((C * (t - b) - r) / soft);
            const tail = e === Infinity ? 1 : smooth((r - C * (t - e)) / soft);
            w += front * tail;
          }
          if (w === 0) continue;
          v += w * A / Math.sqrt((r + LAMBDA / 4) / LAMBDA) * Math.cos(K * r - OMEGA * t - Math.PI / 4);
        }
        shade(v, d, (cy * rightCols + cx) * 4);
      }
    }
    rightBuf.getContext('2d').putImageData(rightImg, 0, 0);
    ctx.drawImage(rightBuf, 0, 0, rightCols, rows, X0, 0, rightCols * CELL, rows * CELL);
  }

  function aliveSources(t) {
    const u = phaseOf(t);
    return sources.filter(s => s.always || u >= s.bornAt);
  }

  function captionText(t) {
    const u = phaseOf(t), k = cycleOf(t);
    const st = currentStage(u);
    const n = st.n;
    if (st === STAGES[0]) {
      if (k >= 1 && C * u < FAR) return `점을 ${n}개로 줄였다 — 곧은 파면이 빠져나가고 동그란 파만 남는다`;
      return `파면 위 점 ${n}개가 동그란 파를 낸다`;
    }
    if (H / (n - 1) < LAMBDA) return `점 ${n}개 — 동그란 파들이 겹쳐 곧은 파면으로 펴진다`;
    return `점 ${n}개 — 동그란 파들이 겹치지만 파면이 아직 울퉁불퉁하다`;
  }

  PieceKit.loop({
    step() { /* 모든 상태는 t 의 함수 — 쌓이는 것이 없다 */ },
    draw(t) {
      PieceKit.mark('들어오는 평면파', () => drawIncident(t));
      PieceKit.mark('점파원이 낸 파의 합', () => drawWavelets(t));
      PieceKit.mark('파면 자리', () => {
        ctx.save();
        ctx.strokeStyle = 'rgba(246,245,241,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(X0 + 0.5, 0); ctx.lineTo(X0 + 0.5, H); ctx.stroke();
        ctx.restore();
      });
      PieceKit.mark('파면 위의 점파원', () => {
        ctx.save();
        for (const s of aliveSources(t)) {
          ctx.beginPath();
          ctx.arc(X0, Math.min(H - 4, Math.max(4, s.y)), 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ff8a3d';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#1c2838';
          ctx.stroke();
        }
        ctx.restore();
      });
      PieceKit.mark('캡션', () => {
        const txt = captionText(t);
        if (captionEl.textContent !== txt) captionEl.textContent = txt;
      });
    },
  });
})();
</script>
</body>
</html>
