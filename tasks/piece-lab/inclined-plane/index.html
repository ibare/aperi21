<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빗면</title>
<style>
  html, body { margin: 0; background: #fbfaf7; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #2b2b2b; }
  .piece { max-width: 900px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; }
  .control { display: flex; align-items: center; gap: 12px; padding: 4px 24px 12px; font-size: 14px; color: #666; }
  .control input { flex: 0 1 240px; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c" width="860" height="370"></canvas>
  <label class="control">빗면 기울기 <input id="angle" type="range" min="5" max="70" step="1" value="20"></label>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(() => {
  // 논리 좌표 (캔버스 860 × 370)
  const W = 860, H = 370;
  const canvas = document.getElementById('c');
  const slider = document.getElementById('angle');
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');

  // 색 — 같은 대상은 같은 색, 강조색은 "면에 나란한 성분" 한 가지 뜻에만
  const INK = '#2b2b2b';          // 중력과 수직 성분 (주장의 배경)
  const FAINT = '#9a968c';        // 보조선
  const WEDGE = '#e7e2d6';        // 빗면
  const BLOCK = '#c9c3b4';        // 물체
  const ACCENT = '#d2552b';       // 면에 나란한 성분

  // 장면 치수
  const PIVOT = { x: 700, y: 290 };  // 빗면의 아래 모서리 (각의 꼭짓점)
  const SLOPE_LEN = 300;             // 빗면 길이
  const BLOCK_S = 190;               // 꼭짓점에서 물체까지 빗면을 따라 잰 거리
  const BLOCK_W = 64, BLOCK_H = 40;
  const G_LEN = 110;                 // 중력 화살표 길이 — 어떤 각에서도 그대로

  // 자동 진행: 12초 주기로 10°↔60° 왕복, t=0 에서 20° 를 지나 가팔라지는 중
  const PERIOD = 12;
  const PHASE = Math.acos(0.6) / (2 * Math.PI) * PERIOD; // cos = 0.6 → 35 - 25·0.6 = 20°
  const autoAngleDeg = (t) => 35 - 25 * Math.cos(2 * Math.PI * (t + PHASE) / PERIOD);

  // 조작기 상태 — 손을 떼고 3초 뒤 1초에 걸쳐 자동 진행으로 돌아간다
  const state = { manualDeg: 20, weight: 0, idle: 0, angleDeg: autoAngleDeg(0) };
  const frozen = !!PieceKit.frozen;
  if (frozen) slider.disabled = true;
  slider.addEventListener('input', () => {
    if (frozen) return;
    state.manualDeg = Number(slider.value);
    state.weight = 1;
    state.idle = 0;
  });

  const rad = (d) => d * Math.PI / 180;

  function arrow(from, vec, color, width) {
    const len = Math.hypot(vec.x, vec.y);
    if (len < 0.5) return;
    const ux = vec.x / len, uy = vec.y / len;
    const head = Math.min(14, len * 0.6);
    const tip = { x: from.x + vec.x, y: from.y + vec.y };
    const base = { x: tip.x - ux * head, y: tip.y - uy * head };
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(base.x, base.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(base.x - uy * head * 0.45, base.y + ux * head * 0.45);
    ctx.lineTo(base.x + uy * head * 0.45, base.y - ux * head * 0.45);
    ctx.closePath();
    ctx.fill();
  }

  PieceKit.loop({
    step(dt, t) {
      if (frozen) { state.weight = 0; }
      else if (state.weight > 0) {
        state.idle += dt;
        if (state.idle > 3) state.weight = Math.max(0, state.weight - dt);
      }
      const auto = autoAngleDeg(t);
      state.angleDeg = auto + (state.manualDeg - auto) * state.weight;
    },
    draw(t) {
      const deg = state.weight > 0 ? state.angleDeg : autoAngleDeg(t);
      if (state.weight === 0) slider.value = String(Math.round(deg));
      const th = rad(deg);
      const s = Math.sin(th), c = Math.cos(th);
      const up = { x: -c, y: -s };        // 꼭짓점에서 빗면 위쪽으로
      const down = { x: c, y: s };        // 빗면을 따라 아래로
      const out = { x: s, y: -c };        // 면 바깥(위)으로
      const into = { x: -s, y: c };       // 면 속으로
      const top = { x: PIVOT.x + up.x * SLOPE_LEN, y: PIVOT.y + up.y * SLOPE_LEN };
      const foot = { x: top.x, y: PIVOT.y };
      const center = {
        x: PIVOT.x + up.x * BLOCK_S + out.x * BLOCK_H / 2,
        y: PIVOT.y + up.y * BLOCK_S + out.y * BLOCK_H / 2,
      };
      const gVec = { x: 0, y: G_LEN };
      const parVec = { x: down.x * G_LEN * s, y: down.y * G_LEN * s };
      const perVec = { x: into.x * G_LEN * c, y: into.y * G_LEN * c };

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      PieceKit.mark('빗면', () => {
        ctx.fillStyle = WEDGE;
        ctx.beginPath();
        ctx.moveTo(PIVOT.x, PIVOT.y);
        ctx.lineTo(top.x, top.y);
        ctx.lineTo(foot.x, foot.y);
        ctx.closePath();
        ctx.fill();
      });

      PieceKit.mark('기울기 각', () => {
        const r = 58;
        ctx.strokeStyle = FAINT;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(PIVOT.x, PIVOT.y, r, Math.PI, Math.PI + th, false);
        ctx.stroke();
        // 각 안쪽은 화살표가 지나가므로 글자는 꼭짓점 오른쪽 바깥에 둔다
        ctx.fillStyle = '#666';
        ctx.font = '15px -apple-system, "Apple SD Gothic Neo", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(Math.round(deg) + '°', PIVOT.x + 12, PIVOT.y - 4);
      });

      PieceKit.mark('물체', () => {
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.rotate(th);
        ctx.fillStyle = BLOCK;
        ctx.fillRect(-BLOCK_W / 2, -BLOCK_H / 2, BLOCK_W, BLOCK_H);
        ctx.restore();
      });

      PieceKit.mark('분해 보조선', () => {
        const gTip = { x: center.x + gVec.x, y: center.y + gVec.y };
        ctx.strokeStyle = FAINT;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(center.x + parVec.x, center.y + parVec.y);
        ctx.lineTo(gTip.x, gTip.y);
        ctx.moveTo(center.x + perVec.x, center.y + perVec.y);
        ctx.lineTo(gTip.x, gTip.y);
        ctx.stroke();
        ctx.setLineDash([]);
      });

      PieceKit.mark('중력', () => {
        arrow(center, gVec, INK, 3);
        ctx.fillStyle = INK;
        ctx.font = '15px -apple-system, "Apple SD Gothic Neo", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('중력', center.x + 8, center.y + G_LEN + 2);
      });

      PieceKit.mark('면에 수직인 성분', () => {
        arrow(center, perVec, INK, 2);
      });

      PieceKit.mark('면에 나란한 성분', () => {
        arrow(center, parVec, ACCENT, 4);
        const tip = { x: center.x + parVec.x, y: center.y + parVec.y };
        ctx.fillStyle = ACCENT;
        ctx.font = '15px -apple-system, "Apple SD Gothic Neo", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('면을 따라 끄는 몫', tip.x + 12, tip.y - 12);
      });

      PieceKit.mark('캡션', () => {
        ctx.fillStyle = INK;
        ctx.font = '16px -apple-system, "Apple SD Gothic Neo", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('중력은 그대로인데, 빗면이 기울수록 면을 따라 끄는 몫이 커진다', 24, H - 18);
      });
    },
  });
})();
</script>
</body>
</html>
