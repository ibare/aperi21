<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장력</title>
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #2b2a27;
    --muted: #8c887f;
    --faint: #dcd8cf;
    --accent: #c2541b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --ink: #e8e5de;
      --muted: #9a968d;
      --faint: #3a3935;
      --accent: #f0864a;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { max-width: 900px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .caption { margin: 6px 16px 12px; font-size: 15px; line-height: 1.5; min-height: 1.5em; }
  .caption b { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c" width="860" height="310" aria-label="손이 당기는 줄이 도르래를 돌아 바닥 고리에 묶여 있고, 줄 세 곳에 저울이 끼워져 있다"></canvas>
  <p class="caption" id="cap"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(() => {
  // ── 화면 크기(논리 좌표) ─────────────────────────────
  const W = 860, H = 310;
  const canvas = document.getElementById('c');
  const cap = document.getElementById('cap');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');

  const css = getComputedStyle(document.documentElement);
  const C = {
    bg: css.getPropertyValue('--bg').trim(),
    ink: css.getPropertyValue('--ink').trim(),
    muted: css.getPropertyValue('--muted').trim(),
    faint: css.getPropertyValue('--faint').trim(),
    accent: css.getPropertyValue('--accent').trim(),
  };

  // ── 물리 약속 ───────────────────────────────────────
  // 줄은 늘지 않고 질량이 없다. 저울 셋은 똑같은 용수철이다.
  // 줄 한 가닥이므로 어느 곳이든 장력은 손이 당기는 힘 F 와 같다.
  // 저울 하나는 F 에 비례해 늘어나고(1 N 당 PX_PER_N), 손은 세 저울이 늘어난 합만큼 물러난다.
  const F_MAX = 80;          // N
  const PX_PER_N = 0.5;      // 저울 늘음 (px / N)

  // 저울 치수 (저울 윗고리 쪽에서 잰 길이)
  const CASE_LEN = 84;       // 투명 몸통 길이
  const CASE_W = 20;
  const SPRING_REST = 20;    // F=0 일 때 용수철 길이 → 눈금 0 위치
  const ROD_LEN = 62;        // 눈금 바늘에서 아래 고리까지의 막대
  const scaleLen = (F) => SPRING_REST + F * PX_PER_N + ROD_LEN + 8; // 끝 고리 포함

  // 배치
  const CEIL_Y = 30;
  const pulley = { x: 640, y: 88, r: 26 };
  const floorY = 292;
  const anchor = { x: pulley.x + pulley.r, y: floorY - 14 };
  const ropeTopY = pulley.y - pulley.r;             // 수평 줄 높이
  const vertX = pulley.x + pulley.r;                // 수직 줄 x

  // 수평 줄: 도르래 꼭대기 → (줄 a) → 저울2 → (줄 b) → 저울1 → (줄 c) → 손
  const ROPE_A = 80, ROPE_B = 80, ROPE_C = 40;
  // 수직 줄: 바닥 고리 → (줄 d) → 저울3 → 도르래 오른쪽
  const ROPE_D = 20;

  // ── 자동 진행: 손이 당기는 힘 ────────────────────────
  const KEYS = [
    [0, 30], [1.6, 70], [4.2, 70], [6.0, 15], [8.4, 15], [10.0, 50], [11.6, 50], [13.0, 30],
  ];
  const PERIOD = 13.0;
  const smooth = (u) => u * u * (3 - 2 * u);
  function autoForce(t) {
    const tt = ((t % PERIOD) + PERIOD) % PERIOD;
    for (let i = 0; i < KEYS.length - 1; i++) {
      const [t0, f0] = KEYS[i], [t1, f1] = KEYS[i + 1];
      if (tt >= t0 && tt <= t1) return f0 + (f1 - f0) * smooth((tt - t0) / (t1 - t0));
    }
    return KEYS[0][1];
  }

  // ── 상태 ────────────────────────────────────────────
  let F = autoForce(0);
  const drag = { on: false, F: 0 };
  let releaseF = null, releaseAge = 0;   // 손을 놓은 뒤 자동 진행으로 돌아가는 중
  const BLEND = 0.8;

  const handXFor = (f) => {
    const s = scaleLen(f);
    // 수직 저울이 늘어난 만큼 줄이 도르래를 넘어 수평 쪽으로 미끄러진다
    return pulley.x - (ROPE_A + f * PX_PER_N) - s - ROPE_B - s - ROPE_C;
  };
  const HAND_X0 = handXFor(0);

  PieceKit.loop({
    step(dt, t) {
      if (!PieceKit.frozen && drag.on) {
        F = drag.F;
        releaseF = null;
        return;
      }
      const target = autoForce(t);
      if (releaseF !== null && !PieceKit.frozen) {
        releaseAge += dt;
        const u = Math.min(1, releaseAge / BLEND);
        F = releaseF + (target - releaseF) * smooth(u);
        if (u >= 1) releaseF = null;
      } else {
        F = target;
      }
    },
    draw(t) {
      if (PieceKit.frozen) F = autoForce(t);
      render();
    },
  });

  // ── 그리기 ──────────────────────────────────────────
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    const shown = Math.round(F);             // 화면의 모든 눈금·캡션은 이 값 하나
    const s = scaleLen(F);

    // 수평 줄 위 점들 (x 좌표, 오른쪽에서 왼쪽으로)
    const xTop = pulley.x;
    const s2Right = xTop - (ROPE_A + F * PX_PER_N);
    const s2Left = s2Right - s;
    const s1Right = s2Left - ROPE_B;
    const s1Left = s1Right - s;
    const handX = s1Left - ROPE_C;

    // 수직 줄 위 점들 (y 좌표, 아래에서 위로)
    const s3Bottom = anchor.y - ROPE_D;
    const s3Top = s3Bottom - s;

    PieceKit.mark('천장과 바닥', () => {
      ctx.strokeStyle = C.muted;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pulley.x - 40, CEIL_Y); ctx.lineTo(pulley.x + 60, CEIL_Y);
      ctx.moveTo(pulley.x - 60, floorY); ctx.lineTo(pulley.x + 120, floorY);
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = C.faint;
      ctx.beginPath();
      for (let x = pulley.x - 36; x < pulley.x + 60; x += 10) { ctx.moveTo(x, CEIL_Y); ctx.lineTo(x + 6, CEIL_Y - 6); }
      for (let x = pulley.x - 56; x < pulley.x + 120; x += 10) { ctx.moveTo(x, floorY); ctx.lineTo(x - 6, floorY + 6); }
      ctx.stroke();
    });

    PieceKit.mark('도르래', () => {
      ctx.strokeStyle = C.muted;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pulley.x, CEIL_Y); ctx.lineTo(pulley.x, pulley.y);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pulley.x, pulley.y, pulley.r, 0, Math.PI * 2);
      ctx.fillStyle = C.bg; ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(pulley.x, pulley.y, pulley.r - 6, 0, Math.PI * 2);
      ctx.strokeStyle = C.faint; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath();
      ctx.arc(pulley.x, pulley.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = C.muted; ctx.fill();
    });

    PieceKit.mark('바닥 고리', () => {
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(anchor.x, anchor.y, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = C.muted;
      ctx.fillRect(anchor.x - 14, floorY - 4, 28, 4);
      ctx.beginPath();
      ctx.moveTo(anchor.x, anchor.y + 6); ctx.lineTo(anchor.x, floorY - 4);
      ctx.stroke();
    });

    PieceKit.mark('줄', () => {
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      // 손 → 저울1
      ctx.moveTo(handX, ropeTopY); ctx.lineTo(s1Left, ropeTopY);
      // 저울1 → 저울2
      ctx.moveTo(s1Right, ropeTopY); ctx.lineTo(s2Left, ropeTopY);
      // 저울2 → 도르래 꼭대기 → 둘레 → 수직으로 저울3
      ctx.moveTo(s2Right, ropeTopY); ctx.lineTo(pulley.x, ropeTopY);
      ctx.arc(pulley.x, pulley.y, pulley.r, -Math.PI / 2, 0);
      ctx.lineTo(vertX, s3Top);
      // 저울3 → 바닥 고리
      ctx.moveTo(vertX, s3Bottom); ctx.lineTo(anchor.x, anchor.y - 6);
      ctx.stroke();
    });

    // 저울: 윗고리(끝점 a) 에서 끝점 b 방향으로 늘어난다
    function drawScale(ax, ay, angle, label, labelPos) {
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(angle);
      const ext = F * PX_PER_N;
      const pointerU = 4 + SPRING_REST + ext;
      // 고리 (윗쪽)
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
      // 투명 몸통
      ctx.fillStyle = C.bg;
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5;
      roundRect(4, -CASE_W / 2, CASE_LEN, CASE_W, 4);
      ctx.fill(); ctx.stroke();
      // 눈금: 0 ~ 80 N, 10 N 마다
      ctx.strokeStyle = C.faint; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let n = 0; n <= F_MAX; n += 10) {
        const u = 4 + SPRING_REST + n * PX_PER_N;
        const long = n % 40 === 0;
        ctx.moveTo(u, -CASE_W / 2); ctx.lineTo(u, -CASE_W / 2 + (long ? 6 : 4));
        ctx.moveTo(u, CASE_W / 2); ctx.lineTo(u, CASE_W / 2 - (long ? 6 : 4));
      }
      ctx.strokeStyle = C.muted;
      ctx.stroke();
      // 용수철 (몸통 안, 윗끝 → 바늘)
      const coils = 9;
      const u0 = 6, u1 = pointerU;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(u0, 0);
      for (let i = 1; i <= coils * 2; i++) {
        const u = u0 + (u1 - u0) * (i / (coils * 2));
        const v = i === coils * 2 ? 0 : (i % 2 ? -5 : 5);
        ctx.lineTo(u, v);
      }
      ctx.stroke();
      // 막대 (바늘 → 아랫고리, 몸통 밖으로 나온다)
      const rodEnd = pointerU + ROD_LEN;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pointerU, 0); ctx.lineTo(rodEnd, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(rodEnd + 4, 0, 4, 0, Math.PI * 2); ctx.stroke();
      // 바늘 (강조색 = 저울이 가리키는 값)
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(pointerU, -CASE_W / 2 + 1); ctx.lineTo(pointerU, CASE_W / 2 - 1); ctx.stroke();
      ctx.restore();

      // 읽은 값 (회전하지 않은 글자)
      ctx.fillStyle = C.accent;
      ctx.font = '600 14px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
      ctx.textAlign = labelPos.align;
      ctx.textBaseline = 'middle';
      ctx.fillText(label, labelPos.x, labelPos.y);
    }

    const label = `${shown} N`;

    // 저울1·2 는 오른쪽(도르래 쪽) 고리가 줄에 걸리고 왼쪽(손 쪽)으로 늘어난다
    PieceKit.mark('저울 1', () => {
      drawScale(s1Right, ropeTopY, Math.PI, label, { x: s1Right - 4 - (SPRING_REST + F * PX_PER_N), y: ropeTopY + 26, align: 'center' });
    });
    PieceKit.mark('저울 2', () => {
      drawScale(s2Right, ropeTopY, Math.PI, label, { x: s2Right - 4 - (SPRING_REST + F * PX_PER_N), y: ropeTopY + 26, align: 'center' });
    });
    // 저울3 은 위쪽 고리가 도르래 쪽 줄에 걸리고 아래로 늘어난다
    PieceKit.mark('저울 3', () => {
      drawScale(vertX, s3Top, Math.PI / 2, label, { x: vertX - 18, y: s3Top + 4 + SPRING_REST + F * PX_PER_N, align: 'right' });
    });

    PieceKit.mark('손', () => {
      // 팔: 왼쪽 가장자리에서 주먹까지
      ctx.strokeStyle = C.muted;
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-10, ropeTopY + 22); ctx.lineTo(handX - 16, ropeTopY + 6);
      ctx.stroke();
      // 주먹
      ctx.fillStyle = C.bg;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      roundRect(handX - 18, ropeTopY - 11, 22, 22, 7);
      ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < 3; i++) {
        const y = ropeTopY - 11 + (22 / 3) * i;
        ctx.moveTo(handX - 4, y); ctx.lineTo(handX + 4, y);
      }
      ctx.stroke();
    });

    const text = `줄 어디에 끼운 저울도 — 도르래를 돌아 꺾인 뒤에도 — 모두 <b>${shown} N</b>을 가리킨다.`;
    if (cap.innerHTML !== text) cap.innerHTML = text;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ── 조작기: 손을 잡아 끈다 ───────────────────────────
  function toLocal(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function forceAt(x) {
    const f = (HAND_X0 - x) / (3 * PX_PER_N);
    return Math.max(0, Math.min(F_MAX, f));
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (PieceKit.frozen) return;
    const p = toLocal(e);
    const hx = handXFor(F);
    if (Math.abs(p.x - hx) < 40 && Math.abs(p.y - ropeTopY) < 40) {
      drag.on = true; drag.F = forceAt(p.x);
      canvas.setPointerCapture(e.pointerId);
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = toLocal(e);
    if (drag.on) { drag.F = forceAt(p.x); return; }
    const hx = handXFor(F);
    canvas.style.cursor = (Math.abs(p.x - hx) < 40 && Math.abs(p.y - ropeTopY) < 40) ? 'grab' : '';
  });
  const end = () => {
    if (!drag.on) return;
    drag.on = false; releaseF = F; releaseAge = 0;
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
})();
</script>
</body>
</html>
