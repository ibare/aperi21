<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부력(힘으로서)</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #26282c; }
  .piece { max-width: 900px; margin: 0 auto; padding: 8px 16px; box-sizing: border-box; }
  canvas { display: block; width: 100%; height: auto; }
  .caption { min-height: 1.5em; margin: 6px 0 0; font-size: 16px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>
<div class="piece">
  <canvas id="stage" width="860" height="360"></canvas>
  <p class="caption" id="caption"></p>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(function () {
  // 화면 좌표(논리 픽셀) 기준 상수
  var W = 860, H = 360;
  var WATER_Y = 210;          // 물 표면
  var TANK = { x0: 250, x1: 610, y1: 345 };
  var CX = 430;               // 물체 가운데 x
  var BW = 64, BH = 50;       // 물체 가로·세로 (BH 가 잠길 수 있는 깊이 전체)
  var L0 = 30;                // 힘을 받지 않을 때 용수철 길이
  var EXT_PER_W = 50;         // 무게 전체를 당길 때 늘어나는 길이
  var W_ARROW = 70;           // 무게 화살표 길이 — 모든 힘 화살표의 축척
  var BETA = 0.6;             // 다 잠겼을 때 물이 미는 힘 / 무게
  var S_TOP = 64, S_BOTTOM = 180; // 손잡이(용수철 윗끝) 높이 범위
  var PERIOD = 16;            // 한 번 내려갔다 올라오는 데 걸리는 초
  var PHASE = 1.75;           // t=0 에 이미 반쯤 내려가는 중이도록

  var ACCENT = '#e0701f';     // 강조색: 물이 미는 힘 하나에만
  var INK = '#26282c';
  var BLOCK = '#6b6f76';
  var WATER_FILL = 'rgba(96, 160, 214, 0.38)';
  var WATER_EDGE = 'rgba(60, 120, 180, 0.9)';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var captionEl = document.getElementById('caption');

  // 손잡이 높이 → 평형 상태(잠긴 깊이, 각 힘)를 구한다.
  // 바닥 = s + L0 + 늘어난 길이 + BH, 늘어난 길이는 줄이 당기는 힘에 비례,
  // 줄이 당기는 힘 = 무게 − 물이 미는 힘, 물이 미는 힘은 잠긴 깊이에 비례.
  function solve(s) {
    var d = 0;
    for (var i = 0; i < 80; i++) {
      var tension = 1 - BETA * d / BH;
      var bottom = s + L0 + EXT_PER_W * tension + BH;
      d = Math.max(0, Math.min(BH, bottom - WATER_Y));
    }
    var buoy = BETA * d / BH;
    var ten = 1 - buoy;
    var springLen = L0 + EXT_PER_W * ten;
    var top = s + springLen;
    return { s: s, d: d, buoy: buoy, ten: ten, springLen: springLen, top: top, bottom: top + BH };
  }

  function supportAt(t) {
    var u = (1 - Math.cos(2 * Math.PI * t / PERIOD + PHASE)) / 2;
    return S_TOP + (S_BOTTOM - S_TOP) * u;
  }

  function arrow(x, y0, y1, color, width) {
    var len = Math.abs(y1 - y0);
    if (len < 0.5) return;
    var dir = y1 < y0 ? -1 : 1;
    var head = Math.min(10, len * 0.6);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1 - dir * head * 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x - head * 0.55, y1 - dir * head);
    ctx.lineTo(x + head * 0.55, y1 - dir * head);
    ctx.closePath();
    ctx.fill();
  }

  function label(text, x, y, color, align) {
    ctx.fillStyle = color;
    ctx.font = '14px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
  }

  var state = solve(supportAt(0));

  PieceKit.loop({
    step: function (dt, t) {
      state = solve(supportAt(t));
    },
    draw: function (t) {
      state = solve(supportAt(t));
      var st = state;
      ctx.clearRect(0, 0, W, H);

      PieceKit.mark('물통', function () {
        ctx.strokeStyle = '#9aa0a8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(TANK.x0, WATER_Y - 40);
        ctx.lineTo(TANK.x0, TANK.y1);
        ctx.lineTo(TANK.x1, TANK.y1);
        ctx.lineTo(TANK.x1, WATER_Y - 40);
        ctx.stroke();
      });

      PieceKit.mark('손잡이 막대', function () {
        ctx.strokeStyle = '#8a8f96';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(CX, 0);
        ctx.lineTo(CX, st.s);
        ctx.stroke();
        ctx.fillStyle = '#8a8f96';
        ctx.fillRect(CX - 12, st.s - 3, 24, 6);
      });

      PieceKit.mark('용수철', function () {
        var coils = 7, amp = 9;
        var y0 = st.s + 3, y1 = st.top;
        var lead = 5;
        ctx.strokeStyle = '#555a61';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(CX, y0);
        ctx.lineTo(CX, y0 + lead);
        var span = (y1 - lead) - (y0 + lead);
        var n = coils * 2;
        for (var i = 1; i <= n; i++) {
          var yy = y0 + lead + span * (i - 0.5) / n;
          ctx.lineTo(CX + (i % 2 ? amp : -amp), yy);
        }
        ctx.lineTo(CX, y1 - lead);
        ctx.lineTo(CX, y1);
        ctx.stroke();
      });

      PieceKit.mark('물체', function () {
        ctx.fillStyle = BLOCK;
        ctx.fillRect(CX - BW / 2, st.top, BW, BH);
      });

      PieceKit.mark('물', function () {
        ctx.fillStyle = WATER_FILL;
        ctx.fillRect(TANK.x0 + 1, WATER_Y, TANK.x1 - TANK.x0 - 2, TANK.y1 - WATER_Y - 1);
        ctx.strokeStyle = WATER_EDGE;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(TANK.x0 + 1, WATER_Y);
        ctx.lineTo(TANK.x1 - 1, WATER_Y);
        ctx.stroke();
      });

      var cy = st.top + BH / 2;
      var gx = CX - BW / 2 - 26;
      var ux = CX + BW / 2 + 26;
      var buoyPx = W_ARROW * st.buoy;
      var tenPx = W_ARROW * st.ten;

      PieceKit.mark('무게 화살표', function () {
        arrow(gx, cy, cy + W_ARROW, INK, 3);
        label('무게', gx - 8, cy + W_ARROW / 2, INK, 'right');
      });

      PieceKit.mark('물이 미는 힘 화살표', function () {
        if (buoyPx < 0.5) return;
        arrow(ux, cy, cy - buoyPx, ACCENT, 3);
        label('물이 미는 힘', ux + 10, cy - Math.min(buoyPx, 20) / 2, ACCENT, 'left');
      });

      PieceKit.mark('용수철이 당기는 힘 화살표', function () {
        arrow(ux, cy - buoyPx, cy - buoyPx - tenPx, INK, 3);
        label('용수철이 당기는 힘', ux + 10, cy - W_ARROW + 6, INK, 'left');
      });

      PieceKit.mark('캡션', function () {
        var text;
        if (st.d <= 0.5) {
          text = '물 밖에서는 용수철이 무게를 혼자 떠받친다';
        } else if (st.d >= BH - 0.5) {
          text = '다 잠기면 더 깊이 내려가도 물이 미는 힘은 그대로다';
        } else {
          text = '잠긴 만큼 물이 떠받쳐, 용수철이 그만큼 덜 늘어난다';
        }
        if (captionEl.textContent !== text) captionEl.textContent = text;
      });
    }
  });
})();
</script>
</body>
</html>
