<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에너지 흐름도</title>
<style>
  :root {
    --ink: #2b2f36;
    --muted: #6b7280;
    --stream: #5b6b7f;
    --heat: #d9b9ab;
    --light: #eea200;
    --bg: #ffffff;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { width: 860px; max-width: 100%; margin: 0 auto; padding: 8px 0 12px; }
  .bar { display: flex; justify-content: flex-end; gap: 0; padding: 0 12px 4px; }
  .bar button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid #c9ced6;
    background: #fff; color: var(--muted); cursor: pointer; }
  .bar button:first-child { border-radius: 6px 0 0 6px; }
  .bar button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .bar button[aria-pressed="true"] { background: #eef1f5; color: var(--ink); }
  canvas { display: block; width: 860px; max-width: 100%; height: auto; }
  .caption { min-height: 1.5em; padding: 6px 16px 0; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<div class="piece">
  <div class="bar" role="group" aria-label="전구 종류">
    <button type="button" data-bulb="0" aria-pressed="true">백열전구</button>
    <button type="button" data-bulb="1" aria-pressed="false">LED 전구</button>
  </div>
  <canvas id="c" width="860" height="340"></canvas>
  <div class="caption" id="caption"></div>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
  // 화면 크기와 배치 (단위 1 = 석탄 에너지 100 가운데 1)
  const W = 860, H = 340;
  const X0 = 84;           // 줄기가 시작하는 x
  const XS = [210, 440, 650]; // 발전소 · 송전선 · 전구 마디의 x
  const XE = 780;          // 빛 갈래가 끝나는 x
  const Y0 = 44;           // 줄기 윗변
  const SC = 1.6;          // 에너지 1 당 굵기(px)
  const Y_END = 272;       // 열 갈래가 아래로 내려와 닿는 y
  const FADE = 58;         // 열이 흩어지는 구간 길이
  const R = 16;            // 갈래가 꺾일 때 안쪽 반지름

  // 흐름값 — 석탄 100 기준, 대략값
  const PLANT_HEAT = 62;   // 발전소 폐열
  const LINE_HEAT = 3;     // 송전선에서 열로
  const AT_HOME = 35;      // 집에 닿는 전기
  const LIGHT_OF = [2, 14]; // 백열전구 · LED 전구의 빛

  const COLOR = {
    stream: '#5b6b7f', streamDot: 'rgba(236,241,247,0.85)',
    heat: '#d9b9ab', heatDot: 'rgba(146,96,78,0.9)',
    light: '#eea200', lightDot: 'rgba(255,248,214,0.95)',
    node: '#2b2f36', ink: '#2b2f36', muted: '#6b7280',
  };

  const canvas = document.getElementById('c');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const captionEl = document.getElementById('caption');

  // 조작 상태
  let chosen = 0;   // 0 백열, 1 LED
  let mix = 0;      // 화면에 보이는 전구 상태 (0→1 로 부드럽게)
  const buttons = Array.from(document.querySelectorAll('.bar button'));
  buttons.forEach(b => b.addEventListener('click', () => {
    chosen = Number(b.dataset.bulb);
  }));

  // 에너지 알갱이 — 각자 자기 차선(u)을 따라 흐른다
  const N = 900, PERIOD = 1000, SPEED = 72;
  const dots = [];
  for (let i = 0; i < N; i++) {
    dots.push({ u: (i + PieceKit.random()) / N * 100, phase: PieceKit.random() * PERIOD, wob: PieceKit.random() * 6.283 });
  }

  function bez(p0, p1, p2, p3, s) {
    const a = 1 - s;
    return [
      a*a*a*p0[0] + 3*a*a*s*p1[0] + 3*a*s*s*p2[0] + s*s*s*p3[0],
      a*a*a*p0[1] + 3*a*a*s*p1[1] + 3*a*s*s*p2[1] + s*s*s*p3[1],
    ];
  }

  // 지금 전구 상태에서의 흐름값
  function flows() {
    const e = mix * mix * (3 - 2 * mix);
    const lightRaw = LIGHT_OF[0] + (LIGHT_OF[1] - LIGHT_OF[0]) * e;
    const light = Math.round(lightRaw);
    return { lightRaw, light, bulbHeatRaw: AT_HOME - lightRaw, bulbHeat: AT_HOME - light };
  }

  // 갈래 하나: 줄기 아래쪽 [from, to) 차선이 xs 에서 아래로 꺾여 나간다
  function branch(xs, from, to) {
    const ya = Y0 + from * SC, yb = Y0 + to * SC, w = yb - ya;
    const outer = [[xs, ya], [xs + (R + w) * 0.55, ya], [xs + R + w, Y_END - (Y_END - ya) * 0.45], [xs + R + w, Y_END]];
    const inner = [[xs, yb], [xs + R * 0.55, yb], [xs + R, Y_END - (Y_END - yb) * 0.45], [xs + R, Y_END]];
    const len = (R + w / 2) * 0.7 + (Y_END - (ya + yb) / 2);
    return { xs, from, to, w, outer, inner, len };
  }

  function branches(f) {
    return [
      { b: branch(XS[0], AT_HOME + LINE_HEAT, 100), value: PLANT_HEAT },
      { b: branch(XS[1], AT_HOME, AT_HOME + LINE_HEAT), value: LINE_HEAT },
      { b: branch(XS[2], f.lightRaw, AT_HOME), value: f.bulbHeat },
    ];
  }

  function drawBranchRibbon(b) {
    const S = 24;
    ctx.beginPath();
    for (let i = 0; i <= S; i++) { const p = bez(...b.outer, i / S); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    for (let i = S; i >= 0; i--) { const p = bez(...b.inner, i / S); ctx.lineTo(p[0], p[1]); }
    ctx.closePath();
    ctx.fillStyle = COLOR.heat;
    ctx.fill();
    // 흩어지는 꼬리 — 아래로 퍼지며 옅어진다
    const xl = b.xs + R, xr = b.xs + R + b.w, spread = 8 + b.w * 0.35;
    const g = ctx.createLinearGradient(0, Y_END, 0, Y_END + FADE);
    g.addColorStop(0, 'rgba(217,185,171,1)');
    g.addColorStop(1, 'rgba(217,185,171,0)');
    ctx.beginPath();
    ctx.moveTo(xl, Y_END - 0.5); ctx.lineTo(xr, Y_END - 0.5);
    ctx.lineTo(xr + spread, Y_END + FADE); ctx.lineTo(xl - spread, Y_END + FADE);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
  }

  function dotPosition(d, t, f, brs) {
    const g = (d.phase + t * SPEED) % PERIOD;
    if (d.u < f.lightRaw) {
      const lm = XE - X0;
      if (g < lm) return { x: X0 + g, y: Y0 + d.u * SC, a: Math.min(1, g / 20), kind: 'stream', light: true };
      const e = (g - lm) / 18;
      if (e > 1) return null;
      return { x: XE + e * 18, y: Y0 + d.u * SC, a: 1 - e, kind: 'light' };
    }
    let br = brs[2].b;
    if (d.u >= brs[0].b.from) br = brs[0].b;
    else if (d.u >= brs[1].b.from) br = brs[1].b;
    const lm = br.xs - X0;
    if (g < lm) return { x: X0 + g, y: Y0 + d.u * SC, a: Math.min(1, g / 20), kind: 'stream' };
    const lane = (d.u - br.from) / Math.max(1e-6, br.to - br.from);
    const s = (g - lm) / br.len;
    if (s <= 1) {
      const po = bez(...br.outer, s), pi = bez(...br.inner, s);
      return { x: po[0] + (pi[0] - po[0]) * lane, y: po[1] + (pi[1] - po[1]) * lane, a: 1, kind: 'heat' };
    }
    const e = (g - lm - br.len) / FADE;
    if (e > 1) return null;
    const spread = 8 + br.w * 0.35;
    const x0 = br.xs + R + br.w * (1 - lane);
    const x = x0 + (0.5 - lane) * 2 * spread * e + Math.sin(t * 2.3 + d.wob) * 4 * e;
    return { x, y: Y_END + e * FADE, a: 1 - e, kind: 'heat' };
  }

  PieceKit.loop({
    step(dt) {
      const target = PieceKit.frozen ? 0 : chosen;
      const k = dt * 1.6;
      mix += Math.max(-k, Math.min(k, target - mix));
    },
    draw(t) {
      const f = flows();
      const brs = branches(f);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      PieceKit.mark('열 갈래', () => {
        brs.forEach(x => drawBranchRibbon(x.b));
      });

      PieceKit.mark('에너지 줄기', () => {
        ctx.beginPath();
        ctx.moveTo(X0, Y0);
        ctx.lineTo(XS[2], Y0);
        ctx.lineTo(XS[2], Y0 + f.lightRaw * SC);
        ctx.lineTo(XS[2], Y0 + AT_HOME * SC);
        ctx.lineTo(XS[1], Y0 + AT_HOME * SC);
        ctx.lineTo(XS[1], Y0 + (AT_HOME + LINE_HEAT) * SC);
        ctx.lineTo(XS[0], Y0 + (AT_HOME + LINE_HEAT) * SC);
        ctx.lineTo(XS[0], Y0 + 100 * SC);
        ctx.lineTo(X0, Y0 + 100 * SC);
        ctx.closePath();
        ctx.fillStyle = COLOR.stream;
        ctx.fill();
      });

      PieceKit.mark('빛 갈래', () => {
        const x1 = XS[2];
        ctx.beginPath();
        ctx.rect(x1, Y0, XE - x1, f.lightRaw * SC);
        ctx.fillStyle = COLOR.light;
        ctx.fill();
      });

      PieceKit.mark('단계 마디', () => {
        ctx.fillStyle = COLOR.node;
        ctx.fillRect(X0 - 3, Y0, 3, 100 * SC);
        ctx.fillRect(XS[0] - 1.5, Y0, 3, 100 * SC);
        ctx.fillRect(XS[1] - 1.5, Y0, 3, (AT_HOME + LINE_HEAT) * SC);
        ctx.fillRect(XS[2] - 1.5, Y0, 3, AT_HOME * SC);
      });

      PieceKit.mark('에너지 알갱이', () => {
        for (const d of dots) {
          const p = dotPosition(d, t, f, brs);
          if (!p) continue;
          let color = COLOR.streamDot;
          if (p.kind === 'heat') color = COLOR.heatDot;
          else if (p.kind === 'light' || (p.light && p.x >= XS[2])) color = COLOR.lightDot;
          if (p.kind === 'light') color = 'rgba(238,162,0,1)';
          ctx.globalAlpha = p.a;
          ctx.fillStyle = color;
          ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
        }
        ctx.globalAlpha = 1;
      });

      PieceKit.mark('단계 이름', () => {
        ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif';
        ctx.fillStyle = COLOR.muted;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('발전소', XS[0], Y0 - 12);
        ctx.fillText('송전선', XS[1], Y0 - 12);
        ctx.fillText('전구', XS[2], Y0 - 12);
      });

      PieceKit.mark('갈래 값', () => {
        ctx.font = '14px -apple-system, "Apple SD Gothic Neo", sans-serif';
        ctx.fillStyle = COLOR.ink;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'right';
        ctx.fillText('석탄', X0 - 10, Y0 + 50 * SC - 9);
        ctx.fillText('100', X0 - 10, Y0 + 50 * SC + 9);
        ctx.textAlign = 'left';
        ctx.fillText('빛 ' + f.light, XE + 24, Y0 + f.lightRaw * SC / 2);
        brs.forEach(x => {
          ctx.fillText('열 ' + x.value, x.b.xs + R + x.b.w + 10, Y_END - 14);
        });
      });

      // 캡션과 버튼 표시는 화면에 그려진 흐름값에서만 나온다
      PieceKit.mark('캡션', () => {
        const text = '석탄 100 가운데 빛에 닿는 것은 ' + f.light + ', 나머지 ' + (100 - f.light) +
          ' 은 발전소 · 송전선 · 전구에서 차례로 열 갈래로 새어 나간다.';
        if (captionEl.textContent !== text) captionEl.textContent = text;
        const shown = PieceKit.frozen ? 0 : chosen;
        buttons.forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.bulb) === shown)));
      });
    },
  });
</script>
</body>
</html>
