<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>중력 가속도 — 꼭대기에서도 멈추지 않는다</title>
<style>
  html, body { margin: 0; background: #fbfaf7; }
  .piece { max-width: 860px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="piece"><canvas id="c"></canvas></div>
<script src="../_harness/piece-kit.js"></script>
<script>
// 위로 던진 공 — 꼭대기에서 속도가 0 이 되는 순간에도
// 같은 시간마다 더해지는 속도 변화(중력의 몫)는 그대로다.

const W = 860, H = 360;
const canvas = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
canvas.width = W * dpr;
canvas.height = H * dpr;
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);

// ── 물리 ──
const G = 9.8;          // m/s²
const V0 = 9.8;         // m/s, 던지는 속력 → 1초에 꼭대기, 2초에 착지
const FLIGHT = 2 * V0 / G;
const DT_SAMPLE = 0.2;  // 속도 화살표를 찍는 간격 (시뮬레이션 초)
const N_SAMPLE = Math.round(FLIGHT / DT_SAMPLE); // 10 칸 (화살표 11개)

// ── 재생 ──
const SLOW = 0.5;       // 느린 재생: 실제 2초 비행을 화면에서 4초로
const START_SIM = 0.45;  // 도착한 순간 이미 날고 있다
const HOLD = 2.0;       // 착지 뒤 멈춰 보여 주는 시간 (화면 초)
const CYCLE = FLIGHT / SLOW + HOLD - START_SIM / SLOW; // 한 바퀴 화면 초

// ── 배치 ──
const INK = '#2f3a45';     // 속도 화살표 (두 곳 모두)
const BALL = '#5b6570';
const ACCENT = '#d9641e';  // 0.2초 동안 더해지는 속도 변화 — 이 뜻에만 쓴다
const FAINT = '#c9c4ba';
const TEXT = '#2b2b2b';

const PX_PER_MPS = 9;             // 속도 → 화살표 길이
const GROUND_Y = 222;
const BALL_X = 130, BALL_R = 10;
const PX_PER_M = 170 / (V0 * V0 / (2 * G)); // 최고 높이 4.9 m → 170 px

const ROW_Y = 130;
const ROW_X0 = 330, ROW_X1 = 820;
const ROW_STEP = (ROW_X1 - ROW_X0) / N_SAMPLE;

// 화면 시각 t → 시뮬레이션 시각 (착지 뒤에는 FLIGHT 에 머문다)
function simTime(t) {
  const local = t % CYCLE;
  const s = START_SIM + local * SLOW;
  return Math.min(s, FLIGHT);
}
const velocity = (s) => V0 - G * s;
const height = (s) => V0 * s - 0.5 * G * s * s;
const sampleV = (k) => V0 * (N_SAMPLE - 2 * k) / N_SAMPLE; // k*0.2초의 속도 (반올림 오차 없이)

function arrow(x, y0, y1, color, width) {
  const len = y1 - y0;
  const dir = Math.sign(len);
  const head = Math.min(6, Math.abs(len));
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'butt';
  if (Math.abs(len) > head) {
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1 - dir * head);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(x, y1);
  ctx.lineTo(x - head * 0.75, y1 - dir * head);
  ctx.lineTo(x + head * 0.75, y1 - dir * head);
  ctx.closePath();
  ctx.fill();
}

let state = { s: START_SIM };

function draw(t) {
  const s = simTime(t);
  const landed = s >= FLIGHT - 1e-9;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fbfaf7';
  ctx.fillRect(0, 0, W, H);

  PieceKit.mark('땅', () => {
    ctx.strokeStyle = FAINT;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(BALL_X - 70, GROUND_Y);
    ctx.lineTo(BALL_X + 70, GROUND_Y);
    ctx.stroke();
  });

  const by = GROUND_Y - BALL_R - height(s) * PX_PER_M;
  const v = landed ? velocity(FLIGHT) : velocity(s);

  PieceKit.mark('공', () => {
    ctx.fillStyle = BALL;
    ctx.beginPath();
    ctx.arc(BALL_X, by, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  });

  const ax = BALL_X + 24;
  const tipY = by - v * PX_PER_MPS;
  if (!landed) PieceKit.mark('공의 속도 화살표', () => {
    if (Math.abs(v * PX_PER_MPS) < 1.5) {
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(ax, by, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      arrow(ax, by, tipY, INK, 3);
    }
  });

  if (!landed) {
    PieceKit.mark('공에 다음 순간 더해질 속도 변화', () => {
      arrow(ax + 11, tipY, tipY + G * DT_SAMPLE * PX_PER_MPS, ACCENT, 3);
    });
  }

  PieceKit.mark('속도 0 기준선', () => {
    ctx.strokeStyle = FAINT;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ROW_X0 - 16, ROW_Y);
    ctx.lineTo(ROW_X1 + 16, ROW_Y);
    ctx.stroke();
  });

  const shown = Math.min(N_SAMPLE, Math.floor(s / DT_SAMPLE + 1e-6));

  PieceKit.mark('0.2초마다 찍힌 속도 화살표', () => {
    for (let k = 0; k <= shown; k++) {
      const x = ROW_X0 + k * ROW_STEP;
      const vk = sampleV(k);
      if (vk === 0) {
        ctx.fillStyle = INK;
        ctx.beginPath();
        ctx.arc(x, ROW_Y, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        arrow(x, ROW_Y, ROW_Y - vk * PX_PER_MPS, INK, 3);
      }
    }
  });

  PieceKit.mark('0.2초마다 더해진 속도 변화', () => {
    for (let k = 1; k <= shown; k++) {
      const x = ROW_X0 + k * ROW_STEP + 10;
      const yPrev = ROW_Y - sampleV(k - 1) * PX_PER_MPS;
      const yNow = ROW_Y - sampleV(k) * PX_PER_MPS;
      arrow(x, yPrev, yNow, ACCENT, 3);
    }
  });

  let caption;
  if (landed) caption = '속도는 0에서 멈추지 않았다 — 처음부터 끝까지 같은 몫씩 아래로 바뀌었다';
  else if (s < 0.85) caption = '올라가는 동안 — 같은 시간마다 같은 만큼 느려진다';
  else if (s <= 1.15) caption = '꼭대기 — 속도는 0이 되지만, 아래로 더해지는 몫은 그대로다';
  else caption = '내려오는 동안 — 같은 시간마다 같은 만큼 빨라진다';

  PieceKit.mark('캡션', () => {
    ctx.fillStyle = TEXT;
    ctx.font = '17px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(caption, W / 2, H - 18);
  });
}

PieceKit.loop({
  step(dt, t) { state.s = simTime(t); },
  draw(t) { draw(t); },
});
</script>
</body>
</html>
