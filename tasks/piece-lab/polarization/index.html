<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편광</title>
<style>
  :root {
    --bg: #101317;
    --ink: #d9e0e8;
    --muted: #8a96a3;
    --accent: #f0a53a; /* 뜻 하나: 독자가 돌리는 가운데 편광판 */
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .piece { max-width: 900px; margin: 0 auto; padding: 8px 12px 10px; box-sizing: border-box; }
  canvas { display: block; width: 100%; height: 330px; }
  .caption { min-height: 2.9em; font-size: 15px; line-height: 1.45; margin: 4px 2px 6px; }
  .controls { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .controls button { background: transparent; color: var(--ink); border: 1px solid #4a5561;
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .controls input[type=range] { width: 220px; accent-color: var(--accent); }
</style>
</head>
<body>
<div class="piece">
  <canvas id="c"></canvas>
  <div class="caption" id="caption"></div>
  <div class="controls">
    <button id="toggle" type="button">가운데 판 빼기</button>
    <label>가운데 판 각도 <input id="angle" type="range" min="0" max="180" step="1" value="45"></label>
  </div>
</div>
<script src="../_harness/piece-kit.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const captionEl = document.getElementById('caption');
  const toggleBtn = document.getElementById('toggle');
  const angleInput = document.getElementById('angle');

  const COL = {
    field: '#b9c9da',      // 빛의 전기장 — 모든 구간에서 같은 색
    fieldStem: 'rgba(185,201,218,0.40)',
    fieldSheet: 'rgba(185,201,218,0.13)',
    axis: 'rgba(140,150,162,0.35)',
    plateFill: 'rgba(170,182,196,0.08)',
    plateEdge: 'rgba(170,182,196,0.55)',
    plateHatch: 'rgba(170,182,196,0.22)',
    plateSlot: '#c3ccd6',
    accent: '#f0a53a',
    label: '#8a96a3',
  };

  // ── 세계 설정 ──
  const TAU = Math.PI * 2;
  const H = 1.2;          // 편광판 반쪽 크기
  const LIFT = 2.6;       // 뺀 가운데 판이 떠 있는 높이
  const DX = -0.55, DY = 0.45; // 관찰자 쪽 가로축(x)의 비스듬한 투영
  const LAM = 0.9, K = TAU / LAM, SPEED = 1.3, PACKET = 1.35;
  const PERIOD = 14;

  // 편광되지 않은 빛: 짧은 묶음마다 진동 방향이 제각각
  const packetAngles = Array.from({ length: 64 }, () => PieceKit.random() * Math.PI);

  let W = 860, S = 54, OX = 40, OY = 0, Z = null;

  function layout() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    W = Math.max(320, rect.width || 860);
    const Hpx = 330;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(Hpx * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 세로: 위로 뺀 판 꼭대기(-(H+LIFT) - DY*H) ~ 아래 모서리(H + DY*H)
    const top = H + LIFT + DY * H + 0.15;
    const bottom = H + DY * H + 0.1;
    S = (Hpx - 16) / (top + bottom);
    OY = 8 + top * S;
    OX = 16 + (-DX) * H * S;
    const zEnd = (W - OX - (-DX) * H * S - 12) / S;
    Z = { start: 0, p1: zEnd * 0.25, p2: zEnd * 0.52, p3: zEnd * 0.79, screen: zEnd };
  }

  function P(x, y, z) {
    return [OX + z * S + x * DX * S, OY - y * S + x * DY * S];
  }

  // ── 상태 ──
  const state = {
    theta: Math.PI / 4, // 가운데 판 축 각도 (첫 판의 세로 축에서 잰 값)
    s: 0,               // 끼워진 정도 0(빠짐)~1(빛길 안)
    dir: 0,             // +1 끼우는 중, -1 빼는 중
    manual: false,
    target: 1,
  };

  const ease = (u) => { u = Math.min(1, Math.max(0, u)); return u * u * (3 - 2 * u); };

  function applyAuto(t) {
    const p = ((t % PERIOD) + PERIOD) % PERIOD;
    const D = Math.PI / 180;
    let s = 0, th = 45, dir = 0;
    if (p < 2.5) { s = 0; th = 45; }
    else if (p < 3.2) { s = ease((p - 2.5) / 0.7); th = 45; dir = 1; }
    else if (p < 6) { s = 1; th = 45; }
    else if (p < 8) { s = 1; th = 45 + 45 * ease((p - 6) / 2); }
    else if (p < 11) { s = 1; th = 90 + 90 * ease((p - 8) / 3); }
    else if (p < 11.7) { s = 1; th = 180; }
    else if (p < 12.4) { s = 1 - ease((p - 11.7) / 0.7); th = 180; dir = -1; }
    else { s = 0; th = 180 + 45 * ease((p - 12.4) / 1.6); }
    if (s <= 0) dir = 0;
    if (s >= 1) dir = 0;
    state.s = s; state.theta = th * D; state.dir = dir;
  }

  const inserted = () => state.s >= 1;

  // 위치 z 에서의 전기장 (x, y 성분) 과 구간·묶음 번호
  function field(z, t) {
    const u = z - SPEED * t;
    const idx = ((Math.floor(u / PACKET) % 64) + 64) % 64;
    const a0 = packetAngles[idx];
    const ph = Math.cos(K * u);
    const th = state.theta;
    let phi, amp, region;
    if (z < Z.p1) { phi = a0; amp = 1; region = 0; }
    else if (z < Z.p2) { phi = 0; amp = Math.cos(a0); region = 1; }
    else if (z < Z.p3) {
      region = 2;
      if (inserted()) { phi = th; amp = Math.cos(a0) * Math.cos(th); }
      else { phi = 0; amp = Math.cos(a0); }
    } else {
      region = 3; phi = Math.PI / 2;
      amp = inserted() ? Math.cos(a0) * Math.cos(th) * Math.sin(th) : 0;
    }
    const e = amp * ph;
    return { ex: e * Math.sin(phi), ey: e * Math.cos(phi), key: region * 100 + idx };
  }

  function drawField(t) {
    const dz = 0.05;
    const pts = [];
    for (let z = Z.start; z <= Z.screen - 0.02; z += dz) {
      const f = field(z, t);
      const fade = Math.min(1, (z - Z.start) / 0.6);
      pts.push({ z, ex: f.ex * fade, ey: f.ey * fade, key: f.key });
    }
    // 진동면 띠: 같은 묶음·구간이 이어지는 동안 축과 끝점 사이를 옅게 채운다
    ctx.fillStyle = COL.fieldSheet;
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        ctx.beginPath();
        const a0 = P(0, 0, run[0].z);
        ctx.moveTo(a0[0], a0[1]);
        for (const q of run) { const b = P(q.ex, q.ey, q.z); ctx.lineTo(b[0], b[1]); }
        const a1 = P(0, 0, run[run.length - 1].z);
        ctx.lineTo(a1[0], a1[1]);
        ctx.closePath();
        ctx.fill();
      }
      run = [];
    };
    for (const q of pts) {
      if (run.length && run[run.length - 1].key !== q.key) flush();
      run.push(q);
    }
    flush();
    ctx.lineWidth = 1;
    ctx.strokeStyle = COL.fieldStem;
    ctx.beginPath();
    for (const q of pts) {
      const a = P(0, 0, q.z), b = P(q.ex, q.ey, q.z);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    }
    ctx.stroke();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = COL.field;
    ctx.beginPath();
    let prev = null;
    for (const q of pts) {
      const b = P(q.ex, q.ey, q.z);
      if (!prev || prev.key !== q.key) ctx.moveTo(b[0], b[1]);
      else ctx.lineTo(b[0], b[1]);
      prev = q;
    }
    ctx.stroke();
  }

  function platePath(z, yoff) {
    const c = [[-H, -H], [H, -H], [H, H], [-H, H]].map(([x, y]) => P(x, y + yoff, z));
    ctx.beginPath();
    ctx.moveTo(c[0][0], c[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(c[i][0], c[i][1]);
    ctx.closePath();
  }

  function drawPlate(z, phi, yoff, slotColor, label) {
    platePath(z, yoff);
    ctx.fillStyle = COL.plateFill;
    ctx.fill();
    ctx.save();
    platePath(z, yoff);
    ctx.clip();
    // 투과축과 나란한 결
    const ux = Math.sin(phi), uy = Math.cos(phi);
    const nx = Math.cos(phi), ny = -Math.sin(phi);
    ctx.strokeStyle = COL.plateHatch;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let o = -1.7; o <= 1.7001; o += 0.24) {
      const a = P(nx * o - ux * 2, ny * o - uy * 2 + yoff, z);
      const b = P(nx * o + ux * 2, ny * o + uy * 2 + yoff, z);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    }
    ctx.stroke();
    // 투과축
    ctx.strokeStyle = slotColor;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    const a = P(-ux * 2, -uy * 2 + yoff, z), b = P(ux * 2, uy * 2 + yoff, z);
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
    ctx.stroke();
    ctx.restore();
    platePath(z, yoff);
    ctx.strokeStyle = COL.plateEdge;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    if (label) {
      const q = P(-H, H + yoff, z);
      ctx.fillStyle = label.color;
      ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(label.text, q[0] + 5, q[1] + 4);
    }
  }

  // 마지막 판을 지난 빛의 평균 세기, 최댓값(45°일 때)을 1 로 맞춘 값
  function relIntensity() {
    if (!inserted()) return 0;
    const v = Math.sin(2 * state.theta);
    return v * v;
  }

  function drawScreen() {
    const z = Z.screen;
    platePath(z, 0);
    ctx.fillStyle = '#06080a';
    ctx.fill();
    ctx.strokeStyle = COL.plateEdge;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    const r = relIntensity();
    if (r > 0) {
      ctx.save();
      platePath(z, 0);
      ctx.clip();
      const c = P(0, 0, z);
      const g = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], 1.05 * S);
      g.addColorStop(0, `rgba(255,251,240,${r})`);
      g.addColorStop(0.45, `rgba(255,251,240,${0.55 * r})`);
      g.addColorStop(1, 'rgba(255,251,240,0)');
      ctx.fillStyle = g;
      ctx.fillRect(c[0] - 2 * S, c[1] - 2 * S, 4 * S, 4 * S);
      ctx.restore();
    }
  }

  function degLabel(th) {
    let d = Math.round(th * 180 / Math.PI) % 180;
    if (d < 0) d += 180;
    return d + '°';
  }

  function captionText() {
    if (state.s <= 0) {
      return '두 판의 축이 직각이다. 첫 판을 지난 세로 진동은 가로 축 판에서 남김없이 사라져 스크린이 어둡다.';
    }
    if (state.s < 1) {
      return state.dir < 0 ? '가운데 판을 빛길에서 뺀다.' : '두 판 사이에 세 번째 판을 끼운다.';
    }
    const r = relIntensity();
    const c = Math.cos(state.theta);
    if (r < 0.03) {
      return c * c > 0.5
        ? '가운데 판이 첫 판과 나란하다. 진동이 세로 그대로라 마지막 판에서 막힌다.'
        : '가운데 판이 첫 판과 직각이다. 세로 진동이 가운데 판에서 이미 사라진다.';
    }
    if (r < 0.5) {
      return '가운데 판이 조금만 기울었다. 진동이 그만큼만 기울어 스크린이 희미하게 밝아진다.';
    }
    return '비스듬한 가운데 판이 진동을 기울여 놓는다. 기운 진동의 가로 몫이 마지막 판을 지나 빛이 되살아난다.';
  }

  // ── 조작 ──
  function goManual() {
    if (!state.manual) { state.manual = true; state.target = state.s >= 0.5 ? 1 : 0; }
  }
  angleInput.addEventListener('input', () => {
    if (PieceKit.frozen) return;
    goManual();
    state.theta = Number(angleInput.value) * Math.PI / 180;
  });
  toggleBtn.addEventListener('click', () => {
    if (PieceKit.frozen) return;
    goManual();
    state.target = state.target === 1 ? 0 : 1;
  });

  layout();
  window.addEventListener('resize', layout);

  PieceKit.loop({
    step(dt, t) {
      if (state.manual && !PieceKit.frozen) {
        const goal = state.target;
        if (state.s !== goal) {
          state.dir = goal > state.s ? 1 : -1;
          state.s = Math.min(1, Math.max(0, state.s + state.dir * dt / 0.7));
        }
        if (state.s === 0 || state.s === 1) state.dir = 0;
      }
    },
    draw(t) {
      if (!state.manual || PieceKit.frozen) applyAuto(t);
      ctx.clearRect(0, 0, W, 330);

      PieceKit.mark('빛길 중심선', () => {
        const a = P(0, 0, Z.start), b = P(0, 0, Z.screen);
        ctx.strokeStyle = COL.axis; ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.setLineDash([]);
      });
      PieceKit.mark('빛의 전기장 진동', () => drawField(t));
      PieceKit.mark('첫 편광판', () => drawPlate(Z.p1, 0, 0, COL.plateSlot, { text: '0°', color: COL.label }));
      PieceKit.mark('가운데 편광판', () => {
        const yoff = LIFT * (1 - state.s);
        drawPlate(Z.p2, state.theta, yoff, COL.accent, { text: degLabel(state.theta), color: COL.accent });
      });
      PieceKit.mark('마지막 편광판', () => drawPlate(Z.p3, Math.PI / 2, 0, COL.plateSlot, { text: '90°', color: COL.label }));
      PieceKit.mark('스크린의 밝기', () => drawScreen());
      PieceKit.mark('캡션', () => {
        const txt = captionText();
        if (captionEl.textContent !== txt) captionEl.textContent = txt;
        const btn = (state.manual ? state.target : (state.dir !== 0 ? (state.dir > 0 ? 1 : 0) : (state.s >= 1 ? 1 : 0))) === 1
          ? '가운데 판 빼기' : '가운데 판 끼우기';
        if (toggleBtn.textContent !== btn) toggleBtn.textContent = btn;
        if (document.activeElement !== angleInput) {
          const d = String(Math.round(((state.theta * 180 / Math.PI) % 180 + 180) % 180));
          if (angleInput.value !== d) angleInput.value = d;
        }
      });
    },
  });
})();
</script>
</body>
</html>
