<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>harness example</title>
<style>body{margin:0;background:#f6f3ec}canvas{display:block;width:100%;height:240px}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../piece-kit.js"></script>
<script>
  var c = document.getElementById('c'), ctx = c.getContext('2d');
  function fit(){ var d=devicePixelRatio||1; c.width=c.clientWidth*d; c.height=c.clientHeight*d; ctx.setTransform(d,0,0,d,0,0); }
  fit();
  var x = 0, v = 120, dots = [];
  for (var i=0;i<20;i++) dots.push([PieceKit.random()*c.clientWidth, PieceKit.random()*240]);
  PieceKit.loop({
    step: function (dt) { x = (x + v*dt) % c.clientWidth; },
    draw: function (t) {
      ctx.clearRect(0,0,c.clientWidth,240);
      PieceKit.mark('배경 점', function(){ ctx.fillStyle='#bbb'; dots.forEach(function(d){ ctx.beginPath(); ctx.arc(d[0],d[1],2,0,7); ctx.fill(); }); });
      PieceKit.mark('움직이는 공', function(){ ctx.fillStyle='#c33'; ctx.beginPath(); ctx.arc(x,120,10,0,7); ctx.fill(); });
      ctx.fillStyle='#333'; ctx.fillText('t = '+t.toFixed(2), 10, 20);
    }
  });
</script></body></html>
