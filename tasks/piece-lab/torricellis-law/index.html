<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper:   #f6f3ec;
    --ink:     #23282e;
    --ink-mid: #6a7480;
    --mark:    #d25a24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px;
  }

  .piece {
    width: 100%;
    max-width: 760px;
  }

  .stage {
    position: relative;
    width: 100%;
  }
  canvas { display: block; width: 100%; height: auto; }

  .caption {
    position: relative;
    margin: 14px 2px 0;
    min-height: 3.4em;
  }
  .caption > span {
    position: absolute;
    inset: 0;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink-mid);
    letter-spacing: -0.01em;
    opacity: 0;
    transition: opacity 380ms ease;
  }
  .caption > span.on { opacity: 1; }
  .caption b {
    font-weight: 600;
    color: var(--ink);
  }
  .caption .accent { color: var(--mark); font-weight: 600; }

  .aside {
    display: flex;
    justify-content: flex-end;
    margin-top: 2px;
  }
  button {
    appearance: none;
    border: 1px solid rgba(35,40,46,0.16);
    background: transparent;
    color: var(--ink-mid);
    font: inherit;
    font-size: 12.5px;
    line-height: 1;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 160ms, border-color 160ms, background 160ms;
  }
  button:hover { color: var(--ink); border-color: rgba(35,40,46,0.34); }
  button[aria-pressed="true"] {
    color: var(--paper);
    background: var(--ink);
    border-color: var(--ink);
  }
  button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
</style>
</head>
<body>

<figure class="piece" style="margin:0">
  <div class="stage"><canvas id="c"></canvas></div>

  <figcaption class="caption" aria-live="polite">
    <span id="capA" class="on">깊은 구멍일수록 물줄기가 <b>더 빠르게</b> 뿜어 나간다.</span>
    <span id="capB"><span class="accent">같은 순간</span>에 출발한 세 물방울 — 아래 구멍 것이 가장 앞서 있다.</span>
  </figcaption>

  <div class="aside">
    <button id="slow" type="button" aria-pressed="false">느리게</button>
  </div>
</figure>

<script>
(function () {
  "use strict";

  /* ── 확정값 ────────────────────────────────────────────────────────────
     g = 9.8 m/s², 수면 높이 H = 0.80 m (일정 유지)
     구멍 높이 y / 물기둥 h = H − y / 분출 속도 v = √(2gh)
       0.10 m / 0.70 m / 3.70 m/s
       0.30 m / 0.50 m / 3.13 m/s
       0.60 m / 0.20 m / 1.98 m/s
     ── 도달 거리와 낙하 시간은 화면에 두지 않는다. 이유는 NOTES.md 참조. */
  var G = 9.8;
  var H = 0.80;

  var HOLES = [
    { y: 0.60, h: 0.20, v: 1.98, depthInset: -0.22 },
    { y: 0.30, h: 0.50, v: 3.13, depthInset: -0.30 },
    { y: 0.10, h: 0.70, v: 3.70, depthInset: -0.38 }
  ];

  /* 물방울 수명은 세 구멍 모두 같다 = 화면의 모든 물방울은 "같은 시간 동안 날아간
     것들"이다. 그래서 앞선 물방울 = 빠른 물줄기 로 항상 읽힌다. */
  var LIFE      = 0.26;   // s
  var SPACING   = 0.006;  // s, 물방울 간 발사 간격
  var STREAK    = 0.006;  // s, 잔상 길이

  var PULSE_PERIOD = 2.6;  // s
  var PULSE_HOLD   = 0.46; // s, 표지 물방울이 멈춰 머무는 시간

  /* 화면 좌표계(월드, 단위 m) */
  var VIEW = { x0: -0.52, x1: 1.06, y0: -0.30, y1: 0.99 };
  var VW = VIEW.x1 - VIEW.x0;
  var VH = VIEW.y1 - VIEW.y0;

  var TANK_LEFT = -0.45, WALL = 0, TANK_TOP = 0.92;

  var C = {
    ink:     "#23282e",
    inkMid:  "#6a7480",
    paper:   "#f6f3ec",
    waterHi: "#bcd9e8",
    waterLo: "#8fbcd6",
    surface: "#5c96b8",
    depth:   "#2b5b74",
    mark:    "#d25a24"
  };

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var capA = document.getElementById("capA");
  var capB = document.getElementById("capB");
  var slowBtn = document.getElementById("slow");

  var S = 1;      // px per meter
  var cssW = 0, cssH = 0;

  function resize() {
    cssW = canvas.parentNode.clientWidth || 760;
    cssH = cssW * (VH / VW);
    var dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = cssW / VW;
  }
  window.addEventListener("resize", resize);

  function X(x) { return (x - VIEW.x0) * S; }
  function Y(y) { return (VIEW.y1 - y) * S; }
  function P(px) { return px * (S / 481); }  // 기준 배율에서의 px 크기 유지

  /* 안정적인 의사난수 (물방울 출생 번호 기준) */
  function hash(i, k) {
    var n = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }

  /* ── 물통 ─────────────────────────────────────────────────────────── */
  function drawTank(t) {
    var amp = 0.0035;

    // 물
    var grad = ctx.createLinearGradient(0, Y(H), 0, Y(0));
    grad.addColorStop(0, C.waterHi);
    grad.addColorStop(1, C.waterLo);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(X(TANK_LEFT), Y(0));
    ctx.lineTo(X(TANK_LEFT), Y(H + amp * Math.sin(t * 1.7)));
    for (var x = TANK_LEFT; x <= WALL + 1e-9; x += 0.02) {
      var wave = amp * Math.sin(x * 13 + t * 2.1) + amp * 0.5 * Math.sin(x * 27 - t * 3.3);
      ctx.lineTo(X(x), Y(H + wave));
    }
    ctx.lineTo(X(WALL), Y(0));
    ctx.closePath();
    ctx.fill();

    // 수면선
    ctx.strokeStyle = C.surface;
    ctx.lineWidth = P(1.6);
    ctx.beginPath();
    for (var x2 = TANK_LEFT, first = true; x2 <= WALL + 1e-9; x2 += 0.02) {
      var w2 = amp * Math.sin(x2 * 13 + t * 2.1) + amp * 0.5 * Math.sin(x2 * 27 - t * 3.3);
      if (first) { ctx.moveTo(X(x2), Y(H + w2)); first = false; }
      else ctx.lineTo(X(x2), Y(H + w2));
    }
    ctx.stroke();

    // 벽 (오른쪽 벽은 구멍에서 끊긴다)
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = P(3);
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(X(TANK_LEFT), Y(TANK_TOP));
    ctx.lineTo(X(TANK_LEFT), Y(0));
    ctx.lineTo(X(WALL), Y(0));
    ctx.stroke();

    var gap = 0.019;
    var segs = [[0, HOLES[2].y - gap], [HOLES[2].y + gap, HOLES[1].y - gap],
                [HOLES[1].y + gap, HOLES[0].y - gap], [HOLES[0].y + gap, TANK_TOP]];
    ctx.beginPath();
    for (var i = 0; i < segs.length; i++) {
      ctx.moveTo(X(WALL), Y(segs[i][0]));
      ctx.lineTo(X(WALL), Y(segs[i][1]));
    }
    ctx.stroke();
  }

  /* ── 깊이 표시 (물통 안쪽: 수면에서 구멍까지) ───────────────────────── */
  function drawDepths() {
    ctx.save();
    ctx.lineWidth = P(1.2);
    ctx.font = "600 " + P(12.5).toFixed(1) + "px -apple-system, 'Apple SD Gothic Neo', sans-serif";
    ctx.textBaseline = "alphabetic";

    for (var i = 0; i < HOLES.length; i++) {
      var ho = HOLES[i];
      var x = ho.depthInset;

      // 수면에서 구멍 높이까지 내려온 뒤, 구멍까지 가로로 이어 붙인다
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.setLineDash([P(4), P(4)]);
      ctx.beginPath();
      ctx.moveTo(X(x), Y(H));
      ctx.lineTo(X(x), Y(ho.y));
      ctx.lineTo(X(-0.006), Y(ho.y));
      ctx.stroke();
      ctx.setLineDash([]);

      // 수면 쪽 끝 눈금
      ctx.beginPath();
      ctx.moveTo(X(x) - P(4.5), Y(H)); ctx.lineTo(X(x) + P(4.5), Y(H));
      ctx.stroke();

      ctx.fillStyle = C.depth;
      ctx.textAlign = "left";
      ctx.fillText("깊이 " + ho.h.toFixed(2) + " m", X(x) + P(6), Y(ho.y) - P(6));
    }
    ctx.restore();
  }

  /* ── 물줄기 ───────────────────────────────────────────────────────── */
  function drawJets(t) {
    ctx.save();
    ctx.lineCap = "round";
    var n = Math.floor(LIFE / SPACING);
    var frac = t % SPACING;

    for (var i = 0; i < HOLES.length; i++) {
      var ho = HOLES[i];
      for (var k = 0; k <= n; k++) {
        var age = frac + k * SPACING;
        if (age > LIFE) continue;

        var id = Math.floor((t - age) / SPACING);
        var j = (hash(id, i) - 0.5) * 0.007;          // 흩날림
        var wob = (hash(id, i + 31) - 0.5) * 0.004;

        var a2 = Math.max(0, age - STREAK);
        var x1 = ho.v * age,  y1 = ho.y - 0.5 * G * age * age + j;
        var x2 = ho.v * a2,   y2 = ho.y - 0.5 * G * a2 * a2 + j;

        var p = age / LIFE;
        var alpha = Math.min(1, age / 0.012) * (p > 0.72 ? (1 - p) / 0.28 : 1);
        var w = P(3.9 - 1.9 * p);

        ctx.strokeStyle = "rgba(77,143,180," + (alpha * 0.92).toFixed(3) + ")";
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(X(x2), Y(y2 + wob));
        ctx.lineTo(X(x1), Y(y1 + wob));
        ctx.stroke();
      }

      // 구멍 목 부분: 짧은 실선으로 물이 '벽을 뚫고 나오는' 연결감
      ctx.strokeStyle = "rgba(77,143,180,0.95)";
      ctx.lineWidth = P(4.4);
      ctx.beginPath();
      ctx.moveTo(X(-0.012), Y(ho.y));
      ctx.lineTo(X(0.03), Y(ho.y - 0.5 * G * Math.pow(0.03 / ho.v, 2)));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ── 구멍과 속도 값 ───────────────────────────────────────────────── */
  function drawHoleLabels() {
    ctx.save();
    ctx.textBaseline = "alphabetic";
    for (var i = 0; i < HOLES.length; i++) {
      var ho = HOLES[i];

      ctx.fillStyle = C.ink;
      ctx.textAlign = "left";
      ctx.font = "600 " + P(16).toFixed(1) + "px ui-monospace, SFMono-Regular, Menlo, monospace";
      var label = ho.v.toFixed(2);
      ctx.fillText(label, X(0.045), Y(ho.y + 0.055));

      var wNum = ctx.measureText(label).width;
      ctx.fillStyle = C.inkMid;
      ctx.font = "400 " + P(11.5).toFixed(1) + "px -apple-system, 'Apple SD Gothic Neo', sans-serif";
      ctx.fillText(" m/s", X(0.045) + wNum + P(2), Y(ho.y + 0.055));
    }
    ctx.restore();
  }

  /* ── 동시 출발 표지 ───────────────────────────────────────────────── */
  function drawPulse(t) {
    var ph = t % PULSE_PERIOD;
    if (ph > LIFE + PULSE_HOLD) return;

    var age = Math.min(ph, LIFE);
    var fade = 1;
    if (ph > LIFE) {
      var q = (ph - LIFE) / PULSE_HOLD;
      fade = q < 0.45 ? 1 : 1 - (q - 0.45) / 0.55;
    }
    if (fade <= 0) return;

    var pts = HOLES.map(function (ho) {
      return { x: ho.v * age, y: ho.y - 0.5 * G * age * age };
    });

    ctx.save();
    ctx.globalAlpha = fade;

    // 세 표지를 잇는 선 = "이 셋은 같은 순간에 출발했다"
    ctx.strokeStyle = "rgba(210,90,36,0.5)";
    ctx.lineWidth = P(1.3);
    ctx.setLineDash([P(3.5), P(3.5)]);
    ctx.beginPath();
    ctx.moveTo(X(pts[0].x), Y(pts[0].y));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i].x), Y(pts[i].y));
    ctx.stroke();
    ctx.setLineDash([]);

    for (var j = 0; j < pts.length; j++) {
      ctx.fillStyle = C.paper;
      ctx.beginPath();
      ctx.arc(X(pts[j].x), Y(pts[j].y), P(7.4), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.mark;
      ctx.beginPath();
      ctx.arc(X(pts[j].x), Y(pts[j].y), P(5.2), 0, Math.PI * 2);
      ctx.fill();
    }

    // 경과 시간 — 물줄기가 닿지 않는 오른쪽 위 여백에 둔다
    ctx.fillStyle = C.mark;
    ctx.beginPath();
    ctx.arc(X(0.46), Y(0.893), P(3.4), 0, Math.PI * 2);
    ctx.fill();

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    var bx = X(0.485), by = Y(0.878);
    ctx.font = "500 " + P(13).toFixed(1) + "px -apple-system, 'Apple SD Gothic Neo', sans-serif";
    var lead = "함께 출발한 지 ";
    ctx.fillText(lead, bx, by);
    bx += ctx.measureText(lead).width;
    ctx.font = "700 " + P(14).toFixed(1) + "px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.fillText(age.toFixed(2), bx, by);
    bx += ctx.measureText(age.toFixed(2)).width;
    ctx.font = "500 " + P(13).toFixed(1) + "px -apple-system, 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText("초", bx + P(1.5), by);
    ctx.restore();
  }

  /* ── 루프 ─────────────────────────────────────────────────────────── */
  var slow = false;
  var t = 1.15;
  var last = null;

  slowBtn.addEventListener("click", function () {
    slow = !slow;
    slowBtn.setAttribute("aria-pressed", String(slow));
    slowBtn.textContent = slow ? "보통 속도" : "느리게";
  });

  function captions(t) {
    var ph = t % PULSE_PERIOD;
    var showB = ph < 1.25;
    capB.classList.toggle("on", showB);
    capA.classList.toggle("on", !showB);
  }

  function frame(now) {
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt * (slow ? 0.28 : 1);

    ctx.clearRect(0, 0, cssW, cssH);
    drawTank(t);
    drawDepths();
    drawJets(t);
    drawHoleLabels();
    drawPulse(t);
    captions(t);

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
